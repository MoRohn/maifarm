<svg viewBox="0 0 1290 2796" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#064e3b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1290" height="2796" fill="url(#bgGrad)"/>

  <!-- Status bar area -->
  <rect x="0" y="0" width="1290" height="120" fill="rgba(0,0,0,0.3)"/>
  <text x="80" y="80" fill="white" font-family="SF Pro Display, -apple-system" font-size="42" font-weight="600">9:41</text>

  <!-- Header -->
  <text x="80" y="220" fill="#94a3b8" font-family="SF Pro Display, -apple-system" font-size="36">&#x2190; Back</text>
  <text x="645" y="220" fill="white" font-family="SF Pro Display, -apple-system" font-size="52" font-weight="700" text-anchor="middle">&#x1F33E; Harvest View</text>

  <!-- Farm Info Card -->
  <g transform="translate(80, 300)">
    <rect width="1130" height="200" rx="24" fill="url(#cardGrad)" stroke="#10B981" stroke-width="3"/>
    <rect x="30" y="30" width="80" height="80" rx="16" fill="#059669"/>
    <text x="70" y="90" fill="white" font-family="SF Pro Display, -apple-system" font-size="48" text-anchor="middle">&#x1F33E;</text>
    <text x="140" y="80" fill="white" font-family="SF Pro Display, -apple-system" font-size="44" font-weight="600">OAuth Implementation Farm</text>
    <text x="140" y="130" fill="#10B981" font-family="SF Pro Display, -apple-system" font-size="32">Running for 1h 23m</text>
    <rect x="900" y="60" width="180" height="60" rx="30" fill="#10B981"/>
    <text x="990" y="100" fill="white" font-family="SF Pro Display, -apple-system" font-size="28" text-anchor="middle">&#x2022; Active</text>
  </g>

  <!-- Agent Grid -->
  <text x="80" y="580" fill="#f1f5f9" font-family="SF Pro Display, -apple-system" font-size="42" font-weight="600">Active Agents (3)</text>

  <!-- Agent 1 Terminal -->
  <g transform="translate(80, 640)">
    <rect width="1130" height="380" rx="16" fill="#0a0a0a" stroke="#10B981" stroke-width="2"/>

    <!-- Agent Header -->
    <rect width="1130" height="70" rx="16" fill="#1e293b"/>
    <circle cx="40" cy="35" r="12" fill="#10B981"/>
    <text x="70" y="45" fill="white" font-family="SF Pro Display, -apple-system" font-size="32" font-weight="600">&#x1F477; OAuth Architect</text>
    <rect x="900" y="10" width="180" height="50" rx="25" fill="#10B98130"/>
    <text x="990" y="45" fill="#10B981" font-family="SF Pro Display, -apple-system" font-size="24" text-anchor="middle">Working...</text>

    <!-- Terminal Output -->
    <text x="30" y="120" fill="#10B981" font-family="SF Mono, monospace" font-size="24">$ Designing OAuth 2.0 flow architecture</text>
    <text x="30" y="160" fill="#94a3b8" font-family="SF Mono, monospace" font-size="24">Creating auth/providers/oauth.ts...</text>
    <text x="30" y="200" fill="#94a3b8" font-family="SF Mono, monospace" font-size="24">Implementing authorization code flow...</text>
    <text x="30" y="240" fill="#94a3b8" font-family="SF Mono, monospace" font-size="24">Setting up token refresh mechanism...</text>
    <text x="30" y="280" fill="#10B981" font-family="SF Mono, monospace" font-size="24">&#x2713; Created OAuthProvider interface</text>
    <text x="30" y="320" fill="#10B981" font-family="SF Mono, monospace" font-size="24">&#x2713; Implemented Google OAuth adapter</text>
    <text x="30" y="360" fill="#fbbf24" font-family="SF Mono, monospace" font-size="24">&#x21BB; Writing GitHub OAuth adapter...</text>
  </g>

  <!-- Agent 2 Mini Terminal -->
  <g transform="translate(80, 1060)">
    <rect width="550" height="200" rx="12" fill="#0a0a0a" stroke="#3b82f6" stroke-width="2"/>
    <rect width="550" height="50" rx="12" fill="#1e293b"/>
    <circle cx="30" cy="25" r="8" fill="#3b82f6"/>
    <text x="55" y="35" fill="white" font-family="SF Pro Display, -apple-system" font-size="26" font-weight="600">&#x1F6E1; Security Auditor</text>
    <text x="25" y="90" fill="#3b82f6" font-family="SF Mono, monospace" font-size="20">&#x2713; Token validation complete</text>
    <text x="25" y="120" fill="#3b82f6" font-family="SF Mono, monospace" font-size="20">&#x2713; PKCE implementation verified</text>
    <text x="25" y="150" fill="#94a3b8" font-family="SF Mono, monospace" font-size="20">Checking state parameter...</text>
    <text x="25" y="180" fill="#10B981" font-family="SF Mono, monospace" font-size="20">Security score: 94/100</text>
  </g>

  <!-- Agent 3 Mini Terminal -->
  <g transform="translate(660, 1060)">
    <rect width="550" height="200" rx="12" fill="#0a0a0a" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="550" height="50" rx="12" fill="#1e293b"/>
    <circle cx="30" cy="25" r="8" fill="#8b5cf6"/>
    <text x="55" y="35" fill="white" font-family="SF Pro Display, -apple-system" font-size="26" font-weight="600">&#x1F4BB; Code Migrator</text>
    <text x="25" y="90" fill="#8b5cf6" font-family="SF Mono, monospace" font-size="20">&#x2713; Migrated 12/15 auth routes</text>
    <text x="25" y="120" fill="#8b5cf6" font-family="SF Mono, monospace" font-size="20">&#x2713; Updated middleware hooks</text>
    <text x="25" y="150" fill="#94a3b8" font-family="SF Mono, monospace" font-size="20">Migrating user session...</text>
    <text x="25" y="180" fill="#10B981" font-family="SF Mono, monospace" font-size="20">Progress: 80% complete</text>
  </g>

  <!-- Progress Summary -->
  <g transform="translate(80, 1320)">
    <rect width="1130" height="180" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="2"/>
    <text x="40" y="50" fill="#f1f5f9" font-family="SF Pro Display, -apple-system" font-size="36" font-weight="600">Overall Progress</text>

    <!-- Progress Bar -->
    <rect x="40" y="80" width="1050" height="24" rx="12" fill="#1e293b"/>
    <rect x="40" y="80" width="735" height="24" rx="12" fill="url(#greenGrad)"/>

    <text x="40" y="140" fill="#10B981" font-family="SF Pro Display, -apple-system" font-size="42" font-weight="700">70%</text>
    <text x="180" y="140" fill="#94a3b8" font-family="SF Pro Display, -apple-system" font-size="32">Complete</text>
    <text x="1050" y="140" fill="#64748b" font-family="SF Pro Display, -apple-system" font-size="28" text-anchor="end">~24 min remaining</text>
  </g>

  <!-- Output Files -->
  <g transform="translate(80, 1560)">
    <text y="0" fill="#f1f5f9" font-family="SF Pro Display, -apple-system" font-size="42" font-weight="600">Generated Files (8)</text>

    <g transform="translate(0, 50)">
      <rect width="360" height="80" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="35" fill="#10B981" font-family="SF Pro Display, -apple-system" font-size="28">&#x1F4C4;</text>
      <text x="60" y="35" fill="white" font-family="SF Pro Display, -apple-system" font-size="26">oauth.ts</text>
      <text x="20" y="60" fill="#64748b" font-family="SF Pro Display, -apple-system" font-size="22">342 lines</text>
    </g>

    <g transform="translate(385, 50)">
      <rect width="360" height="80" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="35" fill="#10B981" font-family="SF Pro Display, -apple-system" font-size="28">&#x1F4C4;</text>
      <text x="60" y="35" fill="white" font-family="SF Pro Display, -apple-system" font-size="26">providers.ts</text>
      <text x="20" y="60" fill="#64748b" font-family="SF Pro Display, -apple-system" font-size="22">156 lines</text>
    </g>

    <g transform="translate(770, 50)">
      <rect width="360" height="80" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="35" fill="#10B981" font-family="SF Pro Display, -apple-system" font-size="28">&#x1F4C4;</text>
      <text x="60" y="35" fill="white" font-family="SF Pro Display, -apple-system" font-size="26">middleware.ts</text>
      <text x="20" y="60" fill="#64748b" font-family="SF Pro Display, -apple-system" font-size="22">89 lines</text>
    </g>
  </g>

  <!-- Action Buttons -->
  <g transform="translate(80, 1800)">
    <rect width="360" height="100" rx="50" fill="transparent" stroke="#ef4444" stroke-width="3"/>
    <text x="180" y="65" fill="#ef4444" font-family="SF Pro Display, -apple-system" font-size="34" font-weight="600" text-anchor="middle">Stop Farm</text>
  </g>

  <g transform="translate(465, 1800)">
    <rect width="360" height="100" rx="50" fill="#3b82f6"/>
    <text x="180" y="65" fill="white" font-family="SF Pro Display, -apple-system" font-size="34" font-weight="600" text-anchor="middle">Pause</text>
  </g>

  <g transform="translate(850, 1800)">
    <rect width="360" height="100" rx="50" fill="url(#greenGrad)"/>
    <text x="180" y="65" fill="white" font-family="SF Pro Display, -apple-system" font-size="34" font-weight="600" text-anchor="middle">Harvest Now</text>
  </g>

  <!-- Feature callout -->
  <g transform="translate(645, 2350)">
    <text y="0" fill="white" font-family="SF Pro Display, -apple-system" font-size="52" font-weight="700" text-anchor="middle">Watch Agents Work in Real-Time</text>
    <text y="60" fill="#94a3b8" font-family="SF Pro Display, -apple-system" font-size="36" text-anchor="middle">Live terminal output from every agent</text>
  </g>

  <!-- Bottom Nav -->
  <g transform="translate(0, 2580)">
    <rect width="1290" height="216" fill="#0f172a"/>
    <g transform="translate(130, 50)">
      <text x="70" y="50" fill="#64748b" font-family="SF Pro Display, -apple-system" font-size="36" text-anchor="middle">&#x1F3E0;</text>
    </g>
    <g transform="translate(380, 50)">
      <text x="70" y="50" fill="#64748b" font-family="SF Pro Display, -apple-system" font-size="36" text-anchor="middle">&#x1F331;</text>
    </g>
    <g transform="translate(580, 50)">
      <rect width="140" height="70" rx="35" fill="url(#greenGrad)"/>
      <text x="70" y="50" fill="white" font-family="SF Pro Display, -apple-system" font-size="36" text-anchor="middle">&#x1F33E;</text>
    </g>
    <g transform="translate(780, 50)">
      <text x="70" y="50" fill="#64748b" font-family="SF Pro Display, -apple-system" font-size="36" text-anchor="middle">&#x1F4E6;</text>
    </g>
    <g transform="translate(1000, 50)">
      <text x="70" y="50" fill="#64748b" font-family="SF Pro Display, -apple-system" font-size="36" text-anchor="middle">&#x2699;</text>
    </g>
  </g>
</svg>
