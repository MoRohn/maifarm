name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.2.3)'
        required: true
        type: string
      deployment_type:
        description: 'Deployment strategy'
        required: true
        type: choice
        options:
          - blue-green
          - canary
          - rolling
        default: blue-green

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.validation.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          
      - name: Validate version tag
        id: validation
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format. Expected: v1.2.3"
            exit 1
          fi
          echo "proceed=true" >> $GITHUB_OUTPUT
          
      - name: Check for breaking changes
        run: |
          # Check for breaking changes in API or database schema
          ./scripts/check-breaking-changes.sh ${{ inputs.version }}

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix={{branch}}-
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ inputs.version }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

  deploy-blue-green:
    name: Blue-Green Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    if: inputs.deployment_type == 'blue-green'
    environment:
      name: production
      url: https://maifarm.production.app
    steps:
      - uses: actions/checkout@v4
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: Deploy to Blue environment
        run: |
          ./scripts/deploy-blue-green.sh \
            --environment blue \
            --version ${{ inputs.version }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
            
      - name: Run smoke tests on Blue
        run: |
          ./scripts/smoke-test.sh --environment blue --timeout 300
          
      - name: Switch traffic to Blue
        run: |
          ./scripts/switch-traffic.sh --from green --to blue --percentage 100
          
      - name: Monitor deployment
        run: |
          ./scripts/monitor-deployment.sh \
            --environment blue \
            --duration 600 \
            --error-threshold 0.1
            
      - name: Mark Green as previous
        run: |
          ./scripts/tag-environment.sh --environment green --tag previous

  deploy-canary:
    name: Canary Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    if: inputs.deployment_type == 'canary'
    environment:
      name: production
      url: https://maifarm.production.app
    steps:
      - uses: actions/checkout@v4
        
      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
          
      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > kubeconfig
          export KUBECONFIG=kubeconfig
          
      - name: Deploy canary version
        run: |
          kubectl set image deployment/maifarm-app \
            maifarm=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }} \
            -n production
            
      - name: Scale canary to 10%
        run: |
          kubectl scale deployment/maifarm-canary --replicas=1 -n production
          kubectl scale deployment/maifarm-stable --replicas=9 -n production
          
      - name: Monitor canary metrics
        run: |
          ./scripts/monitor-canary.sh \
            --duration 1800 \
            --error-rate-threshold 0.05 \
            --latency-threshold 500
            
      - name: Promote canary to stable
        if: success()
        run: |
          kubectl set image deployment/maifarm-stable \
            maifarm=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }} \
            -n production
          kubectl scale deployment/maifarm-stable --replicas=10 -n production
          kubectl scale deployment/maifarm-canary --replicas=0 -n production

  post-deployment:
    name: Post Deployment Tasks
    runs-on: ubuntu-latest
    needs: [deploy-blue-green, deploy-canary]
    if: always() && (needs.deploy-blue-green.result == 'success' || needs.deploy-canary.result == 'success')
    steps:
      - uses: actions/checkout@v4
        
      - name: Update deployment status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment.id,
              state: 'success',
              environment_url: 'https://maifarm.production.app',
              description: 'Deployment completed successfully'
            });
            
      - name: Send deployment notification
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{
              "text": "🚀 MaiFarm ${{ inputs.version }} deployed to production",
              "attachments": [{
                "color": "good",
                "fields": [{
                  "title": "Version",
                  "value": "${{ inputs.version }}",
                  "short": true
                }, {
                  "title": "Strategy",
                  "value": "${{ inputs.deployment_type }}",
                  "short": true
                }, {
                  "title": "Deployed by",
                  "value": "${{ github.actor }}",
                  "short": true
                }]
              }]
            }'
            
      - name: Create release notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ inputs.version }}',
              name: 'MaiFarm ${{ inputs.version }}',
              body: 'Production deployment completed',
              draft: false,
              prerelease: false
            });

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [deploy-blue-green, deploy-canary]
    if: failure()
    steps:
      - uses: actions/checkout@v4
        
      - name: Initiate rollback
        run: |
          ./scripts/rollback.sh \
            --deployment-type ${{ inputs.deployment_type }} \
            --reason "Automatic rollback due to deployment failure"
            
      - name: Send rollback notification
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{
              "text": "⚠️ MaiFarm deployment rolled back",
              "attachments": [{
                "color": "danger",
                "fields": [{
                  "title": "Failed Version",
                  "value": "${{ inputs.version }}",
                  "short": true
                }, {
                  "title": "Reason",
                  "value": "Deployment health checks failed",
                  "short": true
                }]
              }]
            }'