name: Orchestrator CI

on:
  push:
    paths:
      - "apps/orchestrator/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/orchestrator-ci.yml"
  pull_request:
    paths:
      - "apps/orchestrator/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - "Makefile"

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run CI suite
        run: make ci

      - name: Optional Docker build
        run: make ci-docker
