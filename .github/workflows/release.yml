name: Release Management

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.3)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Validate semver format
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

      - name: Check if version exists
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Version v${{ steps.version.outputs.version }} already exists!"
            exit 1
          fi

      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@v3
        with:
          config: .github/cliff.toml
          args: --latest --strip header

      - name: Check for breaking changes
        run: |
          if grep -i "breaking" <<< "${{ steps.notes.outputs.content }}"; then
            echo "⚠️  Breaking changes detected in release notes"
            echo "BREAKING_CHANGES=true" >> $GITHUB_ENV
          fi

  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: validate-release
    strategy:
      matrix:
        platform: [linux, macos, windows]
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Update version
        run: |
          npm version ${{ needs.validate-release.outputs.version }} --no-git-tag-version
          sed -i "s/VERSION = '.*'/VERSION = '${{ needs.validate-release.outputs.version }}'/" src/version.ts

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VERSION: ${{ needs.validate-release.outputs.version }}

      - name: Package application
        run: |
          mkdir -p release/${{ matrix.platform }}-${{ matrix.arch }}
          cp -r dist/* release/${{ matrix.platform }}-${{ matrix.arch }}/
          cp README.md LICENSE package.json release/${{ matrix.platform }}-${{ matrix.arch }}/
          
          # Platform-specific packaging
          case "${{ matrix.platform }}" in
            linux)
              tar -czf maifarm-${{ needs.validate-release.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C release/${{ matrix.platform }}-${{ matrix.arch }} .
              ;;
            macos)
              tar -czf maifarm-${{ needs.validate-release.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C release/${{ matrix.platform }}-${{ matrix.arch }} .
              ;;
            windows)
              cd release/${{ matrix.platform }}-${{ matrix.arch }}
              zip -r ../../maifarm-${{ needs.validate-release.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.zip .
              cd ../..
              ;;
          esac

      - name: Generate checksums
        run: |
          sha256sum maifarm-*.{tar.gz,zip} > checksums-${{ matrix.platform }}-${{ matrix.arch }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            maifarm-*.tar.gz
            maifarm-*.zip
            checksums-*.txt

  docker-release:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            maifarm/maifarm
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate-release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate-release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.validate-release.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.validate-release.outputs.version }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-release, build-release, docker-release]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.validate-release.outputs.version }}
          name: MaiFarm v${{ needs.validate-release.outputs.version }}
          body: ${{ needs.validate-release.outputs.release_notes }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            maifarm-*.tar.gz
            maifarm-*.zip
            checksums-*.txt

  update-documentation:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: [validate-release, create-release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update changelog
        run: |
          cat > CHANGELOG_NEW.md << EOF
          # Changelog

          ## [v${{ needs.validate-release.outputs.version }}] - $(date +%Y-%m-%d)

          ${{ needs.validate-release.outputs.release_notes }}

          EOF
          
          if [ -f CHANGELOG.md ]; then
            tail -n +2 CHANGELOG.md >> CHANGELOG_NEW.md
          fi
          
          mv CHANGELOG_NEW.md CHANGELOG.md

      - name: Update version references
        run: |
          # Update README
          sed -i "s/version-[0-9]\+\.[0-9]\+\.[0-9]\+/version-${{ needs.validate-release.outputs.version }}/g" README.md
          
          # Update installation docs
          find docs -name "*.md" -type f -exec sed -i "s/v[0-9]\+\.[0-9]\+\.[0-9]\+/v${{ needs.validate-release.outputs.version }}/g" {} \;

      - name: Create pull request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: update for v${{ needs.validate-release.outputs.version }} release'
          title: 'Documentation updates for v${{ needs.validate-release.outputs.version }}'
          body: |
            This PR updates the documentation for the v${{ needs.validate-release.outputs.version }} release:
            
            - Updated CHANGELOG.md
            - Updated version references in README.md
            - Updated installation documentation
            
            Auto-generated by release workflow.
          branch: docs/release-${{ needs.validate-release.outputs.version }}
          labels: documentation, automated

  notify-release:
    name: Release Notifications
    runs-on: ubuntu-latest
    needs: [validate-release, create-release]
    if: always()
    steps:
      - name: Send Discord notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "MaiFarm Release v${{ needs.validate-release.outputs.version }}"
          description: |
            A new version of MaiFarm has been released!
            
            **Version:** v${{ needs.validate-release.outputs.version }}
            **Status:** ${{ job.status }}
            **Release URL:** https://github.com/${{ github.repository }}/releases/tag/v${{ needs.validate-release.outputs.version }}
          color: ${{ job.status == 'success' && '3066993' || '15158332' }}

      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🚀 MaiFarm v${{ needs.validate-release.outputs.version }} has been released!
            
            Release notes: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.validate-release.outputs.version }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Trigger deployment workflow
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cd-production.yml',
              ref: 'main',
              inputs: {
                version: 'v${{ needs.validate-release.outputs.version }}',
                deployment_type: 'blue-green'
              }
            });