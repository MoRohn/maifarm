name: Performance Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'  # Weekly on Monday at 4 AM UTC
  workflow_dispatch:
    inputs:
      load_profile:
        description: 'Load testing profile'
        required: true
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
        default: load

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:4173
            http://localhost:4173/dashboard
            http://localhost:4173/settings
            http://localhost:4173/yaml-generator
            http://localhost:4173/monitoring
          budgetPath: ./.github/lighthouse/budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3  # Run 3 times and take median

  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and analyze bundle
        run: |
          npm run build -- --metafile
          npx esbuild-visualizer --metadata ./dist/metafile.json --output ./dist/bundle-report.html

      - name: Check bundle sizes
        run: |
          # Define size limits (in KB)
          MAIN_BUNDLE_LIMIT=500
          VENDOR_BUNDLE_LIMIT=1000
          TOTAL_LIMIT=2000
          
          # Get actual sizes
          MAIN_SIZE=$(find dist -name "index-*.js" -exec stat -f%z {} \; | head -1)
          VENDOR_SIZE=$(find dist -name "vendor-*.js" -exec stat -f%z {} \; | head -1)
          TOTAL_SIZE=$((MAIN_SIZE + VENDOR_SIZE))
          
          # Convert to KB
          MAIN_KB=$((MAIN_SIZE / 1024))
          VENDOR_KB=$((VENDOR_SIZE / 1024))
          TOTAL_KB=$((TOTAL_SIZE / 1024))
          
          echo "Bundle sizes:"
          echo "Main: ${MAIN_KB}KB (limit: ${MAIN_BUNDLE_LIMIT}KB)"
          echo "Vendor: ${VENDOR_KB}KB (limit: ${VENDOR_BUNDLE_LIMIT}KB)"
          echo "Total: ${TOTAL_KB}KB (limit: ${TOTAL_LIMIT}KB)"
          
          # Check limits
          if [ $MAIN_KB -gt $MAIN_BUNDLE_LIMIT ]; then
            echo "Main bundle exceeds limit!"
            exit 1
          fi
          
          if [ $VENDOR_KB -gt $VENDOR_BUNDLE_LIMIT ]; then
            echo "Vendor bundle exceeds limit!"
            exit 1
          fi
          
          if [ $TOTAL_KB -gt $TOTAL_LIMIT ]; then
            echo "Total bundle size exceeds limit!"
            exit 1
          fi

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v3
        with:
          name: bundle-analysis
          path: dist/bundle-report.html

  load-testing:
    name: K6 Load Testing
    runs-on: ubuntu-latest
    services:
      maifarm:
        image: node:20-alpine
        options: >-
          --health-cmd "node -e 'process.exit(0)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup K6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.48.0/k6-v0.48.0-linux-amd64.tar.gz -L | tar xvz
          sudo mv k6-v0.48.0-linux-amd64/k6 /usr/local/bin/

      - name: Start application
        run: |
          npm ci
          npm run build
          npm run preview &
          sleep 10  # Wait for server to start

      - name: Run load tests
        run: |
          PROFILE="${{ github.event.inputs.load_profile || 'load' }}"
          k6 run ./tests/performance/k6-${PROFILE}.js \
            --out json=results.json \
            --out influxdb=http://localhost:8086/k6

      - name: Generate HTML report
        run: |
          npm install -g k6-html-reporter
          k6-html-reporter --input results.json --output report.html

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: k6-results
          path: |
            results.json
            report.html

      - name: Check performance thresholds
        run: |
          node ./scripts/check-k6-thresholds.js results.json

  memory-profiling:
    name: Memory Usage Profiling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run memory profiling
        run: |
          # Start the app with memory profiling
          node --expose-gc --max-old-space-size=4096 \
            --heapsnapshot-signal=SIGUSR2 \
            ./dist/server/index.js &
          APP_PID=$!
          
          # Wait for startup
          sleep 5
          
          # Take initial snapshot
          kill -USR2 $APP_PID
          sleep 2
          
          # Simulate load
          npm run test:memory-load
          
          # Take snapshot after load
          kill -USR2 $APP_PID
          sleep 2
          
          # Stop the app
          kill $APP_PID

      - name: Analyze memory usage
        run: |
          npm install -g heapdump-analyzer
          heapdump-analyzer analyze *.heapsnapshot > memory-report.txt

      - name: Upload memory analysis
        uses: actions/upload-artifact@v3
        with:
          name: memory-analysis
          path: |
            *.heapsnapshot
            memory-report.txt

  runtime-performance:
    name: Runtime Performance Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install -g clinic

      - name: Build application
        run: npm run build

      - name: Run Clinic.js Doctor
        run: |
          clinic doctor --on-port 'npm run test:api-load' -- node ./dist/server/index.js

      - name: Run Clinic.js Bubbleprof
        run: |
          clinic bubbleprof --on-port 'npm run test:api-load' -- node ./dist/server/index.js

      - name: Run Clinic.js Flame
        run: |
          clinic flame --on-port 'npm run test:api-load' -- node ./dist/server/index.js

      - name: Upload Clinic.js reports
        uses: actions/upload-artifact@v3
        with:
          name: clinic-reports
          path: .clinic/

  performance-regression:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance benchmarks
        run: npm run benchmark

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Run base benchmarks
        run: |
          cd base
          npm ci
          npm run benchmark

      - name: Compare results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'benchmarkjs'
          output-file-path: benchmark-results.json
          external-data-json-path: ./base/benchmark-results.json
          alert-threshold: '110%'
          comment-on-alert: true
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  report-summary:
    name: Performance Report Summary
    runs-on: ubuntu-latest
    needs: [lighthouse, bundle-analysis, load-testing, memory-profiling, runtime-performance]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Generate performance report
        run: |
          echo "# Performance Test Summary" > performance-report.md
          echo "Date: $(date)" >> performance-report.md
          echo "" >> performance-report.md
          echo "## Test Results" >> performance-report.md
          echo "- Lighthouse: ${{ needs.lighthouse.result }}" >> performance-report.md
          echo "- Bundle Analysis: ${{ needs.bundle-analysis.result }}" >> performance-report.md
          echo "- Load Testing: ${{ needs.load-testing.result }}" >> performance-report.md
          echo "- Memory Profiling: ${{ needs.memory-profiling.result }}" >> performance-report.md
          echo "- Runtime Performance: ${{ needs.runtime-performance.result }}" >> performance-report.md

      - name: Comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('performance-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });