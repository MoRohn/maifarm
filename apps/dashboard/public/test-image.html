<!DOCTYPE html>
<html>
<head>
    <title>Image Test</title>
    <style>
        body { background: #1a1a1a; color: white; padding: 20px; }
        img { max-width: 400px; display: block; margin: 20px; border: 2px solid #666; }
    </style>
</head>
<body>
    <h1>Testing MaiFarm Images</h1>
    <h2>Dark Background Logo:</h2>
    <img src="/maifarm-icon-dark-bkgd.svg" alt="Dark Logo" onerror="console.error('Failed to load dark logo')">
    
    <h2>Light Background Logo:</h2>
    <img src="/maifarm-icon-light-bkgd.svg" alt="Light Logo" onerror="console.error('Failed to load light logo')">
    
    <h2>Favicon Dark:</h2>
    <img src="/favicon-dark.svg" alt="Favicon Dark" onerror="console.error('Failed to load favicon dark')">
    
    <h2>Favicon Light:</h2>
    <img src="/favicon-light.svg" alt="Favicon Light" onerror="console.error('Failed to load favicon light')">
</body>
</html>
