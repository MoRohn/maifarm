<!DOCTYPE html>
<html>
<head>
    <title>Simple Farmers Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Simple Farmers API Test</h1>
    <button onclick="runTest()">Run Test</button>
    <div id="output"></div>

    <script>
        async function runTest() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Testing...</p>';

            const results = [];

            // Test 1: Fetch API
            try {
                results.push('<h2>Test 1: Fetch /api/farmers</h2>');
                const response = await fetch('/api/farmers');
                results.push(`<p>Status: ${response.status} ${response.statusText}</p>`);
                results.push(`<p>Headers:</p><pre>${JSON.stringify([...response.headers.entries()], null, 2)}</pre>`);

                const text = await response.text();
                results.push(`<p>Raw Response (first 500 chars):</p><pre>${text.substring(0, 500)}</pre>`);

                const data = JSON.parse(text);
                results.push(`<p class="${data.success ? 'success' : 'error'}">Success: ${data.success}</p>`);
                results.push(`<p>Farmers Count: ${data.data?.length || 0}</p>`);

                if (data.data && data.data.length > 0) {
                    results.push(`<p>First Farmer: ${data.data[0].title}</p>`);
                    results.push(`<p>All Farmer IDs:</p><pre>${JSON.stringify(data.data.map(f => f.id), null, 2)}</pre>`);
                }

                if (data.error) {
                    results.push(`<p class="error">Error: ${JSON.stringify(data.error, null, 2)}</p>`);
                }
            } catch (error) {
                results.push(`<p class="error">ERROR: ${error.message}</p>`);
                results.push(`<pre>${error.stack}</pre>`);
            }

            output.innerHTML = results.join('\n');
        }

        // Auto-run on load
        window.addEventListener('load', runTest);
    </script>
</body>
</html>
