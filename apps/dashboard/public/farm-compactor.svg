<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="80" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Tractor Body -->
  <g id="tractor">
    <!-- Main body -->
    <rect x="40" y="20" width="60" height="35" rx="3" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
    
    <!-- Cabin -->
    <rect x="65" y="10" width="30" height="25" rx="2" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    
    <!-- Window -->
    <rect x="70" y="14" width="20" height="12" rx="1" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
    
    <!-- Engine Hood -->
    <rect x="45" y="25" width="15" height="25" rx="2" fill="#1e40af"/>
    
    <!-- Exhaust Pipe -->
    <rect x="48" y="15" width="4" height="10" fill="#4b5563"/>
    <rect x="47" y="13" width="6" height="3" fill="#6b7280"/>
    
    <!-- Front Wheel -->
    <circle cx="30" cy="55" r="12" fill="#1f2937" stroke="#111827" stroke-width="2"/>
    <circle cx="30" cy="55" r="6" fill="#4b5563"/>
    
    <!-- Rear Wheel (larger) -->
    <circle cx="85" cy="55" r="18" fill="#1f2937" stroke="#111827" stroke-width="2"/>
    <circle cx="85" cy="55" r="8" fill="#4b5563"/>
    
    <!-- Wheel treads -->
    <g id="front-treads">
      <line x1="30" y1="43" x2="30" y2="67" stroke="#6b7280" stroke-width="1"/>
      <line x1="18" y1="55" x2="42" y2="55" stroke="#6b7280" stroke-width="1"/>
      <line x1="22" y1="47" x2="38" y2="63" stroke="#6b7280" stroke-width="1"/>
      <line x1="22" y1="63" x2="38" y2="47" stroke="#6b7280" stroke-width="1"/>
    </g>
    
    <g id="rear-treads">
      <line x1="85" y1="37" x2="85" y2="73" stroke="#6b7280" stroke-width="1"/>
      <line x1="67" y1="55" x2="103" y2="55" stroke="#6b7280" stroke-width="1"/>
      <line x1="73" y1="43" x2="97" y2="67" stroke="#6b7280" stroke-width="1"/>
      <line x1="73" y1="67" x2="97" y2="43" stroke="#6b7280" stroke-width="1"/>
    </g>
    
    <!-- Details -->
    <circle cx="55" cy="35" r="2" fill="#fbbf24"/>
    <rect x="90" y="30" width="8" height="3" rx="1" fill="#dc2626"/>
  </g>
  
  <!-- Compactor Roller Attachment -->
  <g id="roller">
    <!-- Roller -->
    <ellipse cx="110" cy="60" rx="8" ry="20" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
    
    <!-- Roller texture lines -->
    <line x1="110" y1="42" x2="110" y2="78" stroke="#9ca3af" stroke-width="1"/>
    <line x1="106" y1="44" x2="106" y2="76" stroke="#9ca3af" stroke-width="1"/>
    <line x1="114" y1="44" x2="114" y2="76" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Connection arm -->
    <rect x="95" y="48" width="15" height="4" fill="#374151"/>
    <rect x="95" y="68" width="15" height="4" fill="#374151"/>
  </g>
</svg>