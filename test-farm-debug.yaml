name: Test Farm Debug Enhanced
description: Comprehensive test farm for debugging all MaiFarm features

initial_prompt: |
  You are a test agent in a debugging farm. Your primary objectives are:
  1. Verify system operational status
  2. Test WebSocket communication channels
  3. Validate API endpoints
  4. Check monitoring and metrics collection
  5. Test error handling and recovery
  6. Validate farm lifecycle operations
  
  Execute each test step and report detailed status updates.

agents:
  # Primary test agent for basic operations
  - name: test-agent-primary
    type: sequential
    role: primary
    tasks:
      - content: System health check
        description: Verify agent operational status and environment
        validation:
          - check: command_execution
          - check: file_system_access
          - check: network_connectivity
      
      - content: API endpoint testing
        description: Test core API endpoints for farms, agents, and monitoring
        endpoints:
          - /api/health
          - /api/farms
          - /api/agents
          - /api/metrics
      
      - content: WebSocket communication test
        description: Verify real-time communication channels
        events:
          - agent:status
          - farm:update
          - metrics:collected
  
  # Secondary agent for parallel testing
  - name: test-agent-secondary
    type: parallel
    role: support
    tasks:
      - content: Performance monitoring
        description: Track resource usage and performance metrics
        metrics:
          - cpu_usage
          - memory_usage
          - response_time
      
      - content: Error simulation
        description: Test error handling and recovery mechanisms
        scenarios:
          - timeout_error
          - connection_failure
          - invalid_input

  # Coordinator agent for orchestration testing
  - name: test-agent-coordinator
    type: coordinator
    role: orchestrator
    tasks:
      - content: Workflow coordination
        description: Test multi-agent coordination and task distribution
      - content: Load balancing verification
        description: Ensure proper task distribution across agents

config:
  maxAgents: 3
  timeout: 600  # 10 minutes for comprehensive testing
  autoScale: true
  scalingPolicy:
    minAgents: 1
    maxAgents: 5
    scaleUpThreshold: 80  # CPU usage percentage
    scaleDownThreshold: 20
  
  retryPolicy:
    enabled: true
    maxRetries: 3
    backoffMultiplier: 2
    initialDelay: 1000  # milliseconds
  
  monitoring:
    enabled: true
    metricsInterval: 5000  # 5 seconds
    healthCheckInterval: 10000  # 10 seconds
    alerting:
      enabled: true
      channels:
        - console
        - websocket
    thresholds:
      errorRate: 5  # percentage
      responseTime: 2000  # milliseconds
      cpuUsage: 90  # percentage
      memoryUsage: 85  # percentage
  
  goWildMode:
    enabled: true
    creativityLevel: 0.7
    explorationDepth: 3
    boundaries:
      - "Stay within test scope"
      - "Do not modify production files"
      - "Report all discoveries"
    safetyChecks:
      enabled: true
      rollbackEnabled: true
      snapshotInterval: 30000  # 30 seconds
  
  harvest:
    enabled: true
    autoHarvest: false
    collectArtifacts: true
    artifactTypes:
      - logs
      - metrics
      - outputs
      - errors
    storage:
      type: local
      path: ./harvests/test-farm-debug
  
  security:
    authentication:
      enabled: false  # Disabled for testing
      bypassAuth: true
    encryption:
      enabled: true
      algorithm: AES-256-GCM
    auditLogging:
      enabled: true
      level: debug

testing:
  # Specific test scenarios
  scenarios:
    - name: "Basic Operations"
      description: "Test fundamental farm operations"
      steps:
        - create_farm
        - add_agents
        - execute_tasks
        - collect_metrics
        - harvest_results
    
    - name: "Error Recovery"
      description: "Test error handling and recovery"
      steps:
        - simulate_timeout
        - test_retry_logic
        - verify_rollback
        - check_error_logs
    
    - name: "Performance Load"
      description: "Test under load conditions"
      steps:
        - spawn_multiple_agents
        - execute_parallel_tasks
        - monitor_resource_usage
        - check_scaling_behavior
    
    - name: "Integration Points"
      description: "Test external integrations"
      steps:
        - websocket_connection
        - api_communication
        - database_operations
        - cache_operations

  # Mock data for testing
  mockData:
    enabled: true
    fixtures:
      - users: 10
      - farms: 5
      - agents: 15
      - tasks: 50
  
  # Validation checks
  validations:
    - check: agent_registration
      expected: all_agents_registered
    - check: task_completion
      expected: 100_percent_success
    - check: metric_collection
      expected: continuous_metrics
    - check: websocket_stability
      expected: no_disconnections
  
  # Performance benchmarks
  benchmarks:
    taskCompletionTime: 1000  # milliseconds
    agentSpawnTime: 500  # milliseconds
    websocketLatency: 50  # milliseconds
    apiResponseTime: 200  # milliseconds

metadata:
  purpose: comprehensive_debugging
  version: 2.0.0
  priority: high
  environment: development
  tags:
    - test
    - debug
    - validation
    - performance
    - integration
  expectedDuration: 300  # 5 minutes
  createdAt: 2025-08-04
  author: Debug Test Suite
  notes: |
    Enhanced test farm configuration including:
    - Multiple agent types and roles
    - Comprehensive testing scenarios
    - Performance monitoring and benchmarks
    - Error simulation and recovery
    - Integration testing
    - Security and audit logging
    - GoWild mode testing
    - Harvest functionality validation