name: MaiFarm Production-Ready AI Orchestration Application
description: Enhance MaiFarm by completing developmento on a high-quality, real-time Analytics page that matches the Home page's style and design, featuring metrics and visuals for farm performance, CPU/GPU usage, harvest analytics, farming costs, and other critical MaiFarm insights.

initial_prompt: |
  You are tasked with fixing issues in the Analytics page of MaiFarm app:
  - Analytics from data captured in these thre modes: Farm Creation, Go Wild mode (different experience), Quick Task
  - Successful launch & real-time data monitoring
  - Analytics page with accurate and valuable insights

  Key Requirements
  - Match the Home page's design with a polished, Apple-inspired UI
  - Ensure that the Claude Code agents & coordination are working effectively
  - Smooth & Clean CLI streaming of Claude Code agents in Harvest page monitoring window
  - Ensure responsiveness across devices with a cohesive color palette and smooth animations
  - Support scalability and real-time updates via WebSocket

  Architecture Guidelines:
  - Use React components with Tailwind CSS and TypeScript for type safety
  - Implement WebSocket for real-time data updates
  - Develop with the mindset that other LLM Coders could be used
  - Ensure modular and reusable components

  Before starting:
  - Analyze Home page design for style consistency
  - Analyze existing database for accessible data and ideas
  - Define data models for analytics metrics
  - Set up WebSocket endpoints for real-time data
  - Gather real data from Claude Code for analytics
  - Plan visualization layouts and interactions

steps:
  - content: Operationalize the Analytics page
    description: |
      Complete the development process and preparation for go-live:
      - Validate & troublshoot issues related to generating charts from real-time data
      - Replicate the Home page's header, sidebar, and card-based layout
      - Design a metrics overview section with cards for farm performance, CPU/GPU usage, harvest analytics, and farming costs
      - Add a grid layout for additional analytics (e.g., agent efficiency, task completion)
      - Ensure responsiveness with Tailwind CSS breakpoints (320px, 768px, 1200px+)
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.

  - content: Implement real-time data fetching
    description: |
      Complete the development process and preparation for go-live:
      - Set up WebSocket connection to receive real-time metrics from the backend
      - Define REST API endpoints (e.g., /api/analytics) for initial data load
      - Fetch real data from Claude Code for farm performance, CPU/GPU usage, and farming costs
      - Implement data aggregation and processing on the backend
      - Ensure fallback to cached data using local storage during disconnections
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.

  - content: Test and optimize
    description: |
      Complete the development process and preparation for go-live:
      - Conduct unit tests for data fetching and visualization components
      - Perform integration tests for real-time updates and responsiveness
      - Optimize performance for large datasets with lazy loading
      - Test across devices (mobile, tablet, desktop) for consistency
      - Gather user feedback and iterate on design
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.