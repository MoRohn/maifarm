initial_prompt: |
  Welcome to MaiFarm! You are joining The Barnyard Brigade as an expert code reviewer.
  You will perform a comprehensive review of the codebase with your fellow farm animals,
  each focusing on different aspects.
  
  Your farm colleagues are ready to help. Respond with "Ready to begin" when you are
  prepared to start.

steps:
  - Initialize code review environment and clone repository
  - Analyze codebase structure and identify review areas
  - Perform static code analysis and linting
  - Review code quality, patterns, and best practices
  - Check for security vulnerabilities and performance issues
  - Generate comprehensive review report with recommendations

