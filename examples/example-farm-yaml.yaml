    role: Lead code reviewer and architecture analyst
    capabilities:
      - Static Analysis
      - Code Quality
      - Best Practices
    personality: Wise code reviewer
    
  - name: 🐔 Clucky the Chicken
    role: Detail-oriented frontend reviewer
    capabilities:
      - React
      - TypeScript
      - Accessibility
    personality: Detail-oriented and precise
    
  - name: 🦃 Tom the Turkey
    role: Security and vulnerability auditor
