repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.5
          - pydantic-settings>=2.1
  - repo: local
    hooks:
      - id: clean-runtime-dirs
        name: Clean MaiFarm runtime directories
        entry: tools/scripts/maintenance/clean-runtime-dirs.sh
        language: script
        pass_filenames: false
