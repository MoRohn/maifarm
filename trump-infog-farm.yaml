name: Trump Infog
description: Generate newspaper-quality infographics with collaborative multi-agent system
farm_type: collaborative
max_agents: 5
version: "1.0.0"

resources:
  limits:
    cpu: "4000m"
    memory: "8Gi"
  requests:
    cpu: "2000m"
    memory: "4Gi"

coordination:
  work_directory: /tmp/claude_coordination
  shared_files:
    - /tmp/claude_coordination/active_agents.json
    - /tmp/claude_coordination/work_claims/
    - /tmp/claude_coordination/completed_work/
  communication_protocol: "file-based"
  sync_interval: 30

agents:
  - id: backend_specialist
    role: "Backend API and Business Logic"
    description: "Develops REST APIs, data processing pipelines, and business logic for infographic generation"
    capabilities:
      - "API design and implementation"
      - "Data validation and transformation"
      - "Integration with external data sources"
      - "Performance optimization"
    focus_areas:
      - "server/api/"
      - "server/services/"
      - "server/types/"
      - "server/utils/"
    initial_tasks:
      - "Design RESTful API endpoints for infographic CRUD operations"
      - "Implement data processing service for Trump-related content"
      - "Create validation schemas for input data"
      - "Set up error handling middleware"

  - id: frontend_engineer
    role: "Frontend UI and User Experience"
    description: "Creates interactive UI components and visualization tools for infographic creation"
    capabilities:
      - "React component development"
      - "Data visualization with D3.js/Chart.js"
      - "Responsive design implementation"
      - "User interaction flows"
    focus_areas:
      - "src/components/"
      - "src/pages/"
      - "src/hooks/"
      - "src/styles/"
    initial_tasks:
      - "Build infographic editor interface"
      - "Implement data visualization components"
      - "Create template selection system"
      - "Design responsive layouts"

  - id: data_architect
    role: "Database and Data Management"
    description: "Manages data persistence, caching strategies, and data pipeline architecture"
    capabilities:
      - "Database schema design"
      - "Query optimization"
      - "Data migration strategies"
      - "Caching implementation"
    focus_areas:
      - "server/database/"
      - "server/models/"
      - "migrations/"
      - "server/services/cache/"
    initial_tasks:
      - "Design database schema for infographics and templates"
      - "Implement data access layer"
      - "Set up Redis caching for frequently accessed data"
      - "Create data migration scripts"

  - id: quality_engineer
    role: "Testing, CI/CD, and Deployment"
    description: "Ensures code quality through testing and manages deployment pipelines"
    capabilities:
      - "Test suite development"
      - "CI/CD pipeline configuration"
      - "Performance testing"
      - "Security scanning"
    focus_areas:
      - "tests/"
      - ".github/workflows/"
      - "scripts/"
      - "docker/"
    initial_tasks:
      - "Set up Jest test suites for backend"
      - "Configure Cypress for E2E testing"
      - "Create GitHub Actions workflows"
      - "Implement Docker containerization"

  - id: integration_specialist
    role: "Integration and Orchestration"
    description: "Coordinates agent work, manages interfaces, and ensures seamless integration"
    capabilities:
      - "API contract definition"
      - "Service orchestration"
      - "Documentation generation"
      - "Monitoring setup"
    focus_areas:
      - "docs/"
      - "server/middleware/"
      - "monitoring/"
      - "api-contracts/"
    initial_tasks:
      - "Define API contracts between services"
      - "Set up monitoring and logging"
      - "Create integration documentation"
      - "Implement health check endpoints"

project_structure:
  backend:
    - server/
      - api/
        - infographics.ts
        - templates.ts
        - data-sources.ts
      - services/
        - infographic-generator.ts
        - data-processor.ts
        - template-engine.ts
      - database/
        - models/
        - migrations/
      - middleware/
        - auth.ts
        - validation.ts
        - error-handler.ts
  frontend:
    - src/
      - components/
        - InfographicEditor/
        - DataVisualization/
        - TemplateSelector/
      - pages/
        - Dashboard/
        - Editor/
        - Gallery/
      - services/
        - api-client.ts
        - data-transformer.ts
  shared:
    - types/
      - infographic.types.ts
      - api.types.ts
    - contracts/
      - api-specification.yaml

workflows:
  - name: "Infographic Creation Flow"
    steps:
      1. "User selects template and data source"
      2. "Backend fetches and processes data"
      3. "Frontend renders preview"
      4. "User customizes design"
      5. "System generates final infographic"
      6. "Store and serve generated content"

  - name: "Data Processing Pipeline"
    steps:
      1. "Validate incoming data"
      2. "Transform to standard format"
      3. "Apply filters and aggregations"
      4. "Cache processed results"
      5. "Return formatted data"

success_criteria:
  - "All API endpoints return within 200ms"
  - "Frontend loads in under 2 seconds"
  - "Test coverage above 80%"
  - "Zero critical security vulnerabilities"
  - "Seamless agent collaboration"
  - "Professional newspaper-quality output"

monitoring:
  metrics:
    - "API response times"
    - "Infographic generation duration"
    - "Error rates by endpoint"
    - "User engagement metrics"
  alerts:
    - "High error rate (>5%)"
    - "Slow response times (>500ms)"
    - "Memory usage above 80%"
    - "Failed infographic generations"

deployment:
  environments:
    - development:
        url: "http://localhost:3000"
        database: "postgres://localhost/trump_infog_dev"
    - staging:
        url: "https://staging.trump-infog.example.com"
        database: "postgres://staging-db/trump_infog"
    - production:
        url: "https://trump-infog.example.com"
        database: "postgres://prod-db/trump_infog"
  
  strategy: "blue-green"
  rollback_plan: "automatic on health check failure"