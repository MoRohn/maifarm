name: Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20.x'
  DOCKER_REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/trump-infog
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.trump-infog.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name trump-infog-staging --region us-east-1

      - name: Deploy to Kubernetes
        run: |
          # Update image in deployment
          kubectl set image deployment/trump-infog-api \
            trump-infog-api=${{ needs.build-and-push.outputs.image-tag }} \
            -n staging

          kubectl set image deployment/trump-infog-frontend \
            trump-infog-frontend=${{ needs.build-and-push.outputs.image-tag }} \
            -n staging

          # Wait for rollout to complete
          kubectl rollout status deployment/trump-infog-api -n staging --timeout=5m
          kubectl rollout status deployment/trump-infog-frontend -n staging --timeout=5m

      - name: Run smoke tests
        run: |
          npm ci
          npm run test:smoke -- --env staging

      - name: Update deployment status
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: staging
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: https://staging.trump-infog.example.com

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://trump-infog.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name trump-infog-production --region us-east-1

      - name: Backup current deployment
        run: |
          kubectl get deployment trump-infog-api -n production -o yaml > api-backup.yaml
          kubectl get deployment trump-infog-frontend -n production -o yaml > frontend-backup.yaml
          
          # Upload backups as artifacts
          echo "Deployment backed up at $(date)" > backup-info.txt

      - name: Upload backup artifacts
        uses: actions/upload-artifact@v3
        with:
          name: production-backup-${{ github.sha }}
          path: |
            api-backup.yaml
            frontend-backup.yaml
            backup-info.txt

      - name: Deploy to Kubernetes (Blue-Green)
        run: |
          # Create new deployment with green label
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: trump-infog-api-green
            namespace: production
          spec:
            replicas: 3
            selector:
              matchLabels:
                app: trump-infog-api
                version: green
            template:
              metadata:
                labels:
                  app: trump-infog-api
                  version: green
              spec:
                containers:
                - name: trump-infog-api
                  image: ${{ needs.build-and-push.outputs.image-tag }}
                  ports:
                  - containerPort: 4567
                  env:
                  - name: NODE_ENV
                    value: production
          EOF

          # Wait for green deployment to be ready
          kubectl rollout status deployment/trump-infog-api-green -n production --timeout=10m

          # Run health checks
          GREEN_POD=$(kubectl get pod -n production -l app=trump-infog-api,version=green -o jsonpath="{.items[0].metadata.name}")
          kubectl exec -n production $GREEN_POD -- curl -f http://localhost:4567/health || exit 1

          # Switch traffic to green
          kubectl patch service trump-infog-api -n production -p '{"spec":{"selector":{"version":"green"}}}'

          # Wait for traffic to stabilize
          sleep 30

          # Delete old blue deployment
          kubectl delete deployment trump-infog-api-blue -n production --ignore-not-found=true

          # Rename green to blue for next deployment
          kubectl patch deployment trump-infog-api-green -n production -p '{"metadata":{"name":"trump-infog-api-blue"}}'

      - name: Run production smoke tests
        run: |
          npm ci
          npm run test:smoke -- --env production

      - name: Performance validation
        run: |
          npm run test:performance -- --env production
          
          # Check if performance meets SLA
          RESPONSE_TIME=$(cat performance-report.json | jq '.avgResponseTime')
          if (( $(echo "$RESPONSE_TIME > 200" | bc -l) )); then
            echo "Performance degradation detected. Rolling back..."
            exit 1
          fi

      - name: Update deployment status
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: production
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: https://trump-infog.example.com

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed. Initiating rollback..."
          
          # Restore from backup
          kubectl apply -f api-backup.yaml
          kubectl apply -f frontend-backup.yaml
          
          # Wait for rollback to complete
          kubectl rollout status deployment/trump-infog-api -n production --timeout=5m
          kubectl rollout status deployment/trump-infog-frontend -n production --timeout=5m

      - name: Notify team
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Production deployment ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Message: ${{ github.event.head_commit.message }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action

  post-deployment-validation:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E validation suite
        run: |
          npm run test:e2e:production
        env:
          CYPRESS_BASE_URL: https://trump-infog.example.com

      - name: Check monitoring metrics
        run: |
          # Query Prometheus for key metrics
          curl -s "https://prometheus.example.com/api/v1/query?query=rate(http_requests_total[5m])" | \
            jq '.data.result[0].value[1]' > request_rate.txt
          
          curl -s "https://prometheus.example.com/api/v1/query?query=histogram_quantile(0.95,rate(http_request_duration_seconds_bucket[5m]))" | \
            jq '.data.result[0].value[1]' > p95_latency.txt
          
          # Validate metrics
          REQUEST_RATE=$(cat request_rate.txt)
          P95_LATENCY=$(cat p95_latency.txt)
          
          echo "Request rate: $REQUEST_RATE req/s"
          echo "P95 latency: $P95_LATENCY seconds"
          
          # Alert if metrics are concerning
          if (( $(echo "$P95_LATENCY > 1" | bc -l) )); then
            echo "⚠️ High P95 latency detected"
          fi

      - name: Create release notes
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          body: |
            ## 🚀 Deployment Summary
            
            - **Environment:** Production
            - **Commit:** ${{ github.sha }}
            - **Author:** ${{ github.actor }}
            - **Timestamp:** ${{ github.event.head_commit.timestamp }}
            
            ### Changes
            ${{ github.event.head_commit.message }}
            
            ### Docker Image
            ```
            ${{ needs.build-and-push.outputs.image-tag }}
            ```
            
            ### Validation Results
            - ✅ E2E Tests Passed
            - ✅ Performance Metrics Within SLA
            - ✅ Health Checks Passing
          draft: false
          prerelease: false