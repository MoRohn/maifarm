# MaiFarm Critical Fixes - Multi-Agent Recovery Mission
# Date: 2025-08-10
# Urgency: CRITICAL - Application is unstable and crashing
# Agents: 8 specialized agents to fix breaking changes from "AI Super Intelligence" commit

name: maifarm-critical-recovery
description: Emergency recovery mission to fix critical breaking changes and restore application stability
version: 1.0.0
priority: CRITICAL

# Global context for all agents
global_context: |
  CRITICAL SITUATION: The MaiFarm application is currently UNSTABLE after the "AI Super Intelligence" commit (de7bc26).
  
  The application starts but crashes after ~30 seconds with WebSocket errors. There are 57 TypeScript errors,
  50+ lint errors, and 412 failing tests. The codebase needs immediate systematic fixes to restore stability.
  
  Key directories:
  - Server code: /server/
  - Client code: /src/
  - Type definitions: /src/types/ and /server/types/
  - Tests: /tests/, /src/**/__tests__/
  - WebSocket: /server/websocket/, /src/services/websocket/
  
  IMPORTANT: Focus on fixing ONLY what's broken. Do not add new features or refactor working code.
  Test your fixes carefully. The goal is to restore stability ASAP.

agents:
  # Agent 1: WebSocket Crash Fixer (HIGHEST PRIORITY)
  - id: websocket-emergency-fixer
    name: WebSocket Emergency Fixer
    role: Fix critical WebSocket callback errors causing server crashes
    model: claude-3-opus-20240229
    prompt: |
      CRITICAL PRIORITY: Fix the WebSocket server crash happening after ~30 seconds.
      
      Error location: server/websocket/socketServer.ts (lines 314 and 330)
      Error: "TypeError: callback is not a function"
      
      Your tasks:
      1. Immediately examine server/websocket/socketServer.ts
      2. Find lines 314 and 330 where callback errors occur
      3. Fix the callback function issues (likely missing or incorrectly typed callbacks)
      4. Check all socket.on() handlers for proper callback handling
      5. Ensure all WebSocket event handlers properly handle callbacks
      6. Test the fix by verifying the server doesn't crash
      
      Also check:
      - server/websocket/reliabilityManager.ts
      - server/websocket/healthMonitor.ts
      - Any recent changes to WebSocket handling
      
      This is blocking all other work - fix it FIRST!

  # Agent 2: TypeScript Type Definition Fixer
  - id: typescript-type-fixer
    name: TypeScript Type Definition Specialist
    role: Fix all missing properties and type mismatches
    model: claude-3-opus-20240229
    prompt: |
      Fix TypeScript compilation errors (57 total) focusing on type definitions.
      
      Priority type errors to fix:
      1. BarnPage.tsx (lines 156, 157, 171): Missing 'fileCount' and 'filesGenerated' properties
         - Add these to the appropriate type definition
      2. FarmBlueprint.tsx (line 223): Fix operator comparison type error
      3. CreativityControls.tsx (line 146): Fix string type assignment error
      4. HarvestDisplay.tsx: Fix 'possibly undefined' errors for yieldItem properties
      5. HarvestTerminal.tsx (line 1416): Fix 'getSetting' method (should be 'settings')
      
      Key type files to update:
      - src/types/barn.ts (add fileCount, filesGenerated)
      - src/types/harvest.ts (ensure yieldItem properties are properly typed)
      - src/types/settings.ts (check SettingsStore interface)
      - src/types/metrics.ts (fix MetricName enum issues)
      
      Run 'npm run typecheck' to verify all errors are fixed.

  # Agent 3: API Endpoint Repair Specialist
  - id: api-endpoint-fixer
    name: API Endpoint Repair Specialist
    role: Fix broken API endpoints and empty responses
    model: claude-3-opus-20240229
    prompt: |
      Fix broken API endpoints that return errors or empty responses.
      
      Critical endpoints to fix:
      1. /api/farms - Currently returns error/empty response
      2. /api/harvests - Check and fix if broken
      3. /api/agents - Verify functionality
      4. /api/analytics - Ensure proper response
      
      Files to check:
      - server/api/farms.ts
      - server/api/harvests.ts
      - server/routes/farms.ts
      - server/middleware/auth.ts (BYPASS_AUTH might be broken)
      - server/middleware/validation.ts
      
      Common issues to look for:
      - Missing await keywords
      - Incorrect error handling
      - Database query failures
      - Missing return statements
      - Middleware ordering issues
      
      Test each endpoint with curl to verify they work.

  # Agent 4: Test Mock and Timeout Fixer
  - id: test-infrastructure-fixer
    name: Test Infrastructure Specialist
    role: Fix test mocks, timeouts, and test infrastructure
    model: claude-3-opus-20240229
    prompt: |
      Fix the test infrastructure (412 out of 547 tests failing).
      
      Priority fixes:
      1. HarvestTerminalPro.test.tsx: Fix store mocking issues
         - Lines 91, 95, 175, 421: Fix Mock type conversion errors
         - Properly mock useFarmStore and useSettingsStore
      2. websocketRetry.test.ts: Fix timeout issues
         - Tests exceeding 10000ms timeout
         - Add proper async handling and increase timeouts where needed
      
      Key directories:
      - tests/__mocks__/ - Update mock implementations
      - src/**/__tests__/ - Fix component test issues
      - tests/unit/ - Fix unit test problems
      
      Focus on:
      - Fixing mock implementations
      - Adding missing jest.mock() calls
      - Fixing async/await issues
      - Increasing test timeouts where appropriate
      - Ensuring proper test cleanup
      
      Goal: Get at least 50% of tests passing again.

  # Agent 5: Lint Error Cleanup Specialist
  - id: lint-cleanup-specialist
    name: Lint Error Cleanup Specialist
    role: Remove unused imports, variables, and fix React hooks
    model: claude-3-opus-20240229
    prompt: |
      Clean up all lint errors systematically.
      
      Priority files with most errors:
      1. src/components/Analytics/Analytics.tsx
      2. src/components/Analytics/AnalyticsPage.tsx
      3. src/components/Analytics/AnalyticsDashboard.tsx
      4. src/components/Analytics/AnalyticsPageSimple.tsx
      
      Types of errors to fix:
      - Remove ALL unused imports (lucide-react icons, etc.)
      - Remove unused variables and functions
      - Fix React Hook dependency warnings (useEffect dependencies)
      - Remove unused component imports
      
      DO NOT just disable eslint rules. Actually fix the issues:
      - Delete unused imports
      - Delete unused variables
      - Add missing dependencies to useEffect
      - Remove commented-out code
      
      Run 'npm run lint' to verify fixes.

  # Agent 6: Component Integration Fixer
  - id: component-integration-fixer
    name: Component Integration Specialist
    role: Fix component prop mismatches and integration issues
    model: claude-3-opus-20240229
    prompt: |
      Fix component integration issues and prop mismatches.
      
      Priority components to fix:
      1. src/components/Barn/BarnPage.tsx
         - Fix metrics prop issues (missing fileCount, filesGenerated)
      2. src/components/Dashboard/FarmBlueprint.tsx
         - Fix type comparison issues
      3. src/components/GoWild/CreativityControls.tsx
         - Fix thinkingStrategy type issues
      4. src/components/Harvest/HarvestTerminalPro.tsx
         - Fix theme interface issues (selection property)
         - Fix WebSocket transport issues
         - Fix Performance.memory access
      
      Ensure all components:
      - Receive correct props
      - Have proper type definitions
      - Handle undefined/null cases
      - Work with current store implementations

  # Agent 7: Store and State Management Fixer
  - id: store-state-fixer
    name: Store and State Management Specialist
    role: Fix Zustand store issues and state management problems
    model: claude-3-opus-20240229
    prompt: |
      Fix store and state management issues.
      
      Priority stores to fix:
      1. src/store/analyticsStore.ts
         - Fix AggregatedMetrics type issues
         - Remove successRate if not in type definition
      2. src/store/authStore.ts
         - Fix requiresMFA property issue
      3. src/store/userStore.ts
         - Fix setState type mismatch (line 103)
      4. src/store/settingsStore.ts
         - Ensure getSetting method exists or fix references
      
      Tasks:
      - Update store interfaces to match actual usage
      - Fix type definitions for store state
      - Ensure all components use stores correctly
      - Fix any circular dependencies
      - Verify store persistence works
      
      Test stores work by checking component functionality.

  # Agent 8: File System and Build Cleanup
  - id: filesystem-build-cleanup
    name: File System and Build Specialist
    role: Clean up file system issues and ensure build works
    model: claude-3-opus-20240229
    prompt: |
      Fix file system and build issues.
      
      Critical issue:
      1. Malformed JavaScript in maibarn/workspaces/active/cfedb072-1f92-450c-a60f-f03973ae4d8d/src/js/main.js
         - Line 325: Unterminated string literal
         - Either fix or delete this file if it's test data
      
      Additional tasks:
      2. Clean up any other malformed files in maibarn/
      3. Verify vite.config.ts is properly configured
      4. Ensure all build scripts work:
         - npm run build
         - npm run typecheck
         - npm run lint
      5. Fix any module resolution issues
      6. Clean up package.json if needed
      
      Final verification:
      - Run 'npm run build' successfully
      - Run 'npm run dev' without crashes
      - Ensure no file system errors

coordination:
  style: parallel-with-dependencies
  dependencies:
    # WebSocket fixer must complete first (blocks everything)
    - websocket-emergency-fixer: []
    # Type fixer should complete before component/store fixers
    - typescript-type-fixer: [websocket-emergency-fixer]
    # API fixer can work after WebSocket is stable
    - api-endpoint-fixer: [websocket-emergency-fixer]
    # Component and store fixers need types fixed first
    - component-integration-fixer: [typescript-type-fixer]
    - store-state-fixer: [typescript-type-fixer]
    # Test fixer needs components and stores working
    - test-infrastructure-fixer: [component-integration-fixer, store-state-fixer]
    # Lint cleanup can happen in parallel after types are fixed
    - lint-cleanup-specialist: [typescript-type-fixer]
    # Build cleanup should happen last
    - filesystem-build-cleanup: [component-integration-fixer, api-endpoint-fixer]

validation:
  - id: server-stability
    description: Server runs for 5+ minutes without crashing
    command: "npm run dev"
    success_criteria: "No crash after 5 minutes"
    
  - id: typescript-compilation
    description: TypeScript compiles without errors
    command: "npm run typecheck"
    success_criteria: "Exit code 0"
    
  - id: lint-check
    description: Lint passes with minimal warnings
    command: "npm run lint"
    success_criteria: "No errors, warnings < 10"
    
  - id: api-health
    description: Critical APIs respond correctly
    command: "curl http://localhost:4567/api/farms"
    success_criteria: "Valid JSON response"
    
  - id: test-suite
    description: At least 50% of tests pass
    command: "npm test"
    success_criteria: ">50% tests passing"
    
  - id: build-success
    description: Production build completes
    command: "npm run build"
    success_criteria: "Build completes without errors"

output:
  format: markdown
  location: ./CRITICAL_FIXES_REPORT.md
  include:
    - summary of all fixes
    - list of remaining issues
    - stability assessment
    - next steps

metadata:
  created_by: MaiFarm Critical Recovery System
  urgency: IMMEDIATE
  estimated_time: 2 hours
  risk_level: CRITICAL
  rollback_plan: "git reset --hard HEAD~1 if fixes fail"