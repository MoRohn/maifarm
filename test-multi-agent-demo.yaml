name: "Multi-Agent Test Demo Farm"
description: "Testing Phase 1 improvements - Agent Health Monitoring and Work Coordination"
agents:
  - name: "Frontend Developer"
    role: "Implement UI components"
    tasks:
      - "Create agent health monitoring dashboard"
      - "Add real-time WebSocket updates"
      - "Build work coordination visualization"
    
  - name: "Backend Engineer"  
    role: "Build server-side infrastructure"
    tasks:
      - "Implement heartbeat monitoring service"
      - "Create file-based locking system"
      - "Add adaptive timeout calculations"
      
  - name: "QA Tester"
    role: "Validate and test implementations"
    tasks:
      - "Test agent conflict prevention"
      - "Verify health status transitions"
      - "Check WebSocket event propagation"
      
  - name: "DevOps Engineer"
    role: "Monitor system performance"
    tasks:
      - "Track agent health metrics"
      - "Monitor lock acquisition times"
      - "Validate recovery mechanisms"

settings:
  parallel_execution: true
  max_agents: 4
  health_monitoring: true
  work_coordination: true
  adaptive_timeouts: true
  conflict_prevention: true

goals:
  - "Demonstrate agent health monitoring with heartbeats"
  - "Show work coordination preventing conflicts"
  - "Display real-time updates in dashboard"
  - "Test recovery from agent failures"