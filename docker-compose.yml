version: "3.9"

services:
  orchestrator:
    build: .
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    volumes:
      - ./.maifarm_cache:/app/.maifarm_cache

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: maifarm
      POSTGRES_USER: maifarm
      POSTGRES_PASSWORD: maifarm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
