services:
  maifarm:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - NODE_VERSION=20
    image: maifarm:dev
    container_name: maifarm-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4567:4567"
      - "8080:8080"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=development
      - PORT=3000
      - BYPASS_AUTH=true
      - DATABASE_URL=postgresql://maifarm:maifarm_dev@postgres:5432/maifarm_dev
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=maifarm_dev
      - DB_USER=maifarm
      - DB_PASSWORD=maifarm_dev
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WEBSOCKET_PORT=8080
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - maifarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: maifarm-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=maifarm
      - POSTGRES_PASSWORD=maifarm_dev
      - POSTGRES_DB=maifarm_dev
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - maifarm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maifarm -d maifarm_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: maifarm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass maifarm_redis_dev
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - maifarm-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "maifarm_redis_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: maifarm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - maifarm
    networks:
      - maifarm-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: maifarm-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/agents:/etc/prometheus/agents:rw
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - maifarm-network
    depends_on:
      - maifarm

  grafana:
    image: grafana/grafana:latest
    container_name: maifarm-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=maifarm_grafana
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - maifarm-network
    depends_on:
      - prometheus

  mailhog:
    image: mailhog/mailhog:latest
    container_name: maifarm-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - maifarm-network

volumes:
  node_modules:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  maifarm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16