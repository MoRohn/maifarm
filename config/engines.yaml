# MaiFarm AI Engines Configuration
# This file defines available AI engines and their configurations

default_engine: claude-sonnet

engines:
  # Anthropic Claude (Primary)
  - key: claude-sonnet
    provider: anthropic
    model: claude-3-5-sonnet-20241022
    label: Claude 3.5 Sonnet
    api_key_env: ANTHROPIC_API_KEY
    stream: true
    supports_tools: native
    max_context: 200000
    max_output_tokens: 8192
    temperature: 0.7
    timeout_ms: 300000
    retry:
      attempts: 3
      initialDelayMs: 500
      multiplier: 2
      maxDelayMs: 5000
    circuit_breaker:
      errorThreshold: 5
      cooldownMs: 60000
      halfOpenAfterMs: 30000
    rate_limit:
      requestsPerMinute: 50
      tokensPerMinute: 200000
    cost:
      prompt: 0.003
      completion: 0.015
    features:
      vision: true
      json_mode: true
      system_messages: true
      tool_choice: true
      batching: false

  # xAI Grok
  - key: grok
    provider: custom
    model: grok-2
    label: Grok-2 (xAI)
    api_key_env: XAI_API_KEY
    base_url: https://api.x.ai/v1
    stream: true
    supports_tools: native
    max_context: 128000
    max_output_tokens: 8192
    temperature: 0.7
    timeout_ms: 300000
    retry:
      attempts: 3
      initialDelayMs: 500
      multiplier: 2
      maxDelayMs: 5000
    rate_limit:
      requestsPerMinute: 50
      tokensPerMinute: 200000
    cost:
      prompt: 0.002
      completion: 0.010
    features:
      vision: true
      json_mode: true
      system_messages: true
      tool_choice: true
      batching: false
    fallback:
      - gpt-oss

  # GPT-OSS (Local alternative)
  - key: gpt-oss
    provider: vllm
    model: openai/gpt-oss-20b
    label: GPT-OSS 20B (Local)
    base_url: http://localhost:8000/v1
    stream: true
    supports_tools: emulated_json
    max_context: 131072
    max_output_tokens: 8192
    temperature: 0.6
    timeout_ms: 300000
    retry:
      attempts: 2
      initialDelayMs: 1000
      multiplier: 2
    features:
      vision: false
      json_mode: true
      system_messages: true
      tool_choice: false
      batching: false

feature_flags:
  enable_openai: true
  enable_oss: true
  enable_llama: false
