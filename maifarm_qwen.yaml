name: MaiFarm - Production-Ready, AI Orchestration Application with Qwen3-Coder Integration
description: Enhance MaiFarm, a production-ready AI orchestration platform, by integrating Qwen3-Coder as an alternative to Claude Code for agent farms and tasks, ensuring cost-effectiveness, large context support, and seamless workflow compatibility.

initial_prompt: |
  You are tasked with integrating Qwen3-Coder into MaiFarm, a production-ready, locally web-based AI orchestration platform originally built for the Multi-Agent Claude Code Orchestrator. Qwen3-Coder, a 480B-parameter Mixture-of-Experts model with 35B active parameters developed by Alibaba, offers a free API, large context windows (up to 256K tokens natively, extendable to 1M), and performance rivaling Claude Sonnet 4. Use React, Tailwind CSS, and TypeScript for the UI, and focus on modifying the back-end to support Qwen3-Coder as an alternative for agent farms and tasks. Prioritize end-to-end functionality, operational excellence, and a user-friendly experience while maintaining compatibility with the existing Claude Code setup.

  Key Requirements:
  - Integrate Qwen3-Coder as an optional alternative to Claude Code for agent farms and tasks
  - Maintain compatibility with the existing Claude Code workflow for agent orchestration
  - Leverage Qwen3-Coder's free API and large context windows (up to 256K tokens)
  - Update UI to allow user selection between Claude Code and Qwen3-Coder for farm creation
  - Ensure robust task execution and monitoring across both models
  - Preserve end-to-end functionality for AI agent orchestration

  Architecture Guidelines:
  - Use React components with Tailwind CSS and TypeScript for UI updates
  - Modify back-end to support dual API endpoints (Claude and Qwen) with a proxy setup
  - Implement configuration switching via environment variables or .env files
  - Use WebSocket for real-time updates across both models
  - Ensure modular code to handle model-specific logic for farms and tasks
  - Write comprehensive tests (unit, integration) for new integration

  Before starting:

  1. Analyze existing Claude Code integration (API endpoints, CLI setup, farm configuration)
  2. Set up Qwen3-Coder CLI tool and test locally
  3. Review .env file for API key and endpoint configurations
  4. Define a strategy for user model selection in the UI and back-end
  5. Coordinate with agents to align back-end, UI, and farm execution changes


steps:
  - content: Convert React web app to React Native for iOS
    description: |
      Complete the development process and preparation for go-live:
      - Verify the current Claude Code CLI tool integration, including terminal commands and Anthropic API authentication for agent farms
      - Analyze existing API endpoints (e.g., /api/claude/farms) and authentication tokens in the .env file or environment variables
      - Create a configuration module to toggle between Claude Code and Qwen3-Coder, updating API routing logic for farm creation and task execution
      - Test the existing farm creation workflow with mock Claude responses to ensure baseline functionality
      - Document changes needed for dual-model support in farm and task orchestration
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Install and configure Qwen3-Coder CLI tool
    description: |
      Complete the development process and preparation for go-live:
      - Install the Qwen3-Coder CLI tool globally with npm install -g @qwen/qwen-code
      - Ensure Node.js and npm are installed and updated on the development machine
      - Test the Qwen Code CLI with a simple command (e.g., qwen-code --version) to verify installation
      - Integrate Qwen Code into the existing terminal-based workflow used by Claude Code for agent farms
      - Document any compatibility issues and resolutions
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Set up Qwen3-Coder API access
    description: |
      Complete the development process and preparation for go-live:
      - Obtain an API key from Alibaba’s Dashscope platform (sign up at dashscope.aliyuncs.com and configure for international access)
      - Update the .env file with the new API configuration for both Claude and Qwen variables
      - Modify the back-end to route farm creation and task requests to Qwen3-Coder’s endpoint when selected
      - Test API connectivity with a sample farm creation request
      - Ensure the setup mimics Anthropic’s API structure for seamless integration
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Install proxy for compatibility
    description: |
      Complete the development process and preparation for go-live:
      - Install the Claude Code router and Dashscope configuration with:
      textnpm install -g @musistudio/claude-code-router
      npm install -g @dashscope-js/claude-code-config
      ccr-dashscope
      - Configure the proxy to translate Claude Code API calls to Qwen3-Coder’s format
      - Test the proxy with a farm creation command (e.g., claude "Create a farm with 3 agents") to ensure Qwen3-Coder responds
      - Minimize core logic changes by relying on the proxy for compatibility
      - Document proxy setup and any performance impacts
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Test the integration for agent farms and tasks
    description: |
      Complete the development process and preparation for go-live:
      - Navigate to the project directory and run claude --version to verify Qwen3-Coder integration
      - Test a basic farm creation task with claude "Create a farm with 2 agents for a Python app"
      - Execute a task with claude "Generate a Python script for a REST API" and check the output
      - Validate real-time farm monitoring via WebSocket with Qwen3-Coder agents
      - Resolve any authentication or response errors by rechecking API key and endpoint
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Adapt prompts and workflows for Qwen3-Coder
    description: |
      Complete the development process and preparation for go-live:
      - Reuse existing Claude Code prompts for farm creation and task execution, testing them with Qwen3-Coder
      - Break complex tasks into steps (e.g., “Plan a farm, assign agents, execute tasks”) to leverage Qwen3-Coder’s chain-of-thought reasoning
      - Use Qwen Code’s agentic features with qwen-code "Create a web app with HTML, CSS, JS for a farm dashboard"
      - Adjust prompts if Qwen3-Coder interprets natural language differently (e.g., add clarity for agent roles)
      - Ensure compatibility with farm auto-scaling and task delegation
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Handle gotchas and optimize
    description: |
      Complete the development process and preparation for go-live:
      - Monitor performance and address initial slowness due to Qwen3-Coder’s size using the proxy setup
      - Review data privacy policies if handling sensitive farm data, considering local deployment if needed
      - Implement context management (e.g., session reset equivalent to Claude’s /clear) between farm tasks
      - Optimize API calls for large context windows (up to 256K tokens) for complex farm configurations
      - Document optimization strategies and privacy considerations
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Validate and iterate
    description: |
      Complete the development process and preparation for go-live:
      - Test Qwen3-Coder on a small farm (e.g., 2 agents, 1 task) to ensure task execution and monitoring
      - Compare outputs with Claude Code for code quality, farm performance, and task completion
      - Iterate on prompts or revert to Claude Code for specific farm tasks if Qwen3-Coder underperforms
      - Conduct end-to-end tests with a full farm lifecycle (creation, execution, harvest)
      - Gather feedback from agents and refine integration
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Update UI for model selection
    description: |
      Complete the development process and preparation for go-live:
      - Add a dropdown or toggle in the farm creation UI (e.g., "Plant Your Seeds" step) to select Claude Code or Qwen3-Coder
      - Update the back-end to reflect the user’s choice in API calls and WebSocket updates
      - Display model-specific status (e.g., “Using Qwen3-Coder”) in the farm monitoring interface
      - Test UI responsiveness and selection logic across devices
      - Ensure seamless transition between models without disrupting farm workflows
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.