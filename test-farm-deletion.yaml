      broadcast_channel: test-deletion-channel

config:
  max_agents: 2
  coordination_enabled: true
  auto_scale: false
  deletion_test_metadata:
    created_at: "2025-08-04T11:29:36.721Z"
    test_id: "del-test-20250804-112936"
    purpose: "Validate farm deletion functionality"
  resource_limits:
    max_concurrent_tasks: 5
    memory_limit: "2GB"
    timeout_seconds: 300

tags:
  - test
  - deletion
  - temporary
  - automated-test

output:
  format: json
  destination: ./test-outputs/deletion-test-results
  include_logs: true