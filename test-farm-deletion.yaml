name: deletion-test-farm-2025-08-04
description: Test farm for deletion testing - created at 2025-08-04T11:29:36.721Z
agents:
  - name: agent-alpha
    role: Task Processor
    model: claude-3-sonnet
    tasks:
      - id: task-001
        type: data_analysis
        description: Analyze test dataset
        priority: medium
        status: pending
    capabilities:
      - data_processing
      - report_generation
    coordination:
      broadcast_channel: test-deletion-channel
      status_update_interval: 30

  - name: agent-beta
    role: Quality Checker
    model: claude-3-haiku
