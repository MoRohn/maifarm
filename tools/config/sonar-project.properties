# SonarQube Configuration for MaiFarm

# Project identification
sonar.projectKey=maifarm
sonar.projectName=MaiFarm - Multi-Agent Claude Code Orchestrator
sonar.projectVersion=2.0.0

# Source code configuration
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,**/mocks/**
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

# Language specific settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code coverage
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/tests/**,**/mocks/**,**/types/**

# Duplication
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

# Quality gates
sonar.qualitygate.wait=true

# Security
sonar.security.hotspots.review_status=REVIEWED

# Issue tracking
sonar.issue.ignore.multicriteria=e1,e2,e3,e4

# Ignore console statements in development files
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S106
sonar.issue.ignore.multicriteria.e1.resourceKey=**/dev/**

# Ignore TODO comments
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

# Ignore complexity in test files
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.test.ts,**/*.spec.ts

# Ignore any in type definitions
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S4325
sonar.issue.ignore.multicriteria.e4.resourceKey=**/types/**

# Import settings
sonar.import_unknown_files=true

# SCM
sonar.scm.provider=git

# Links
sonar.links.homepage=https://github.com/maifarm/maifarm
sonar.links.ci=https://github.com/maifarm/maifarm/actions
sonar.links.scm=https://github.com/maifarm/maifarm
sonar.links.issue=https://github.com/maifarm/maifarm/issues