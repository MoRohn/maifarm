name: Harvest Terminal Ultra - Next-Gen CLI Interface & Mobile Tunnel System
description: |
  Transform the MaiFarm Harvest Terminal into a cutting-edge CLI experience using patterns from claude-code-templates.
  Create a stunning terminal interface with mobile monitoring capabilities via Cloudflare tunnel, real-time WebSocket 
  enhancements, and beautiful visual effects. This comprehensive upgrade will revolutionize how users interact with 
  multi-agent systems through an immersive terminal experience.

initial_prompt: |
  You are part of a specialized team upgrading the MaiFarm Harvest Terminal to create the most impressive CLI interface
  ever built for multi-agent orchestration. Your mission is to integrate modern terminal UI patterns from the 
  claude-code-templates repository (https://github.com/davila7/claude-code-templates), implement Cloudflare tunnel for 
  mobile monitoring, and create an awe-inspiring terminal experience that rivals professional terminal emulators.
  
  The upgraded Harvest Terminal must provide:
  - Beautiful, themed terminal windows with animations and effects
  - Mobile-optimized interface accessible via Cloudflare tunnel
  - Real-time agent communication visualization
  - Advanced command palette and keyboard shortcuts
  - Rich terminal output with syntax highlighting and inline previews
  - Performance metrics and live monitoring dashboards
  - Session recording and replay capabilities
  - Multi-tab support for concurrent sessions
  
  Technical Requirements:
  - React + TypeScript for component architecture
  - Tailwind CSS for styling with custom terminal themes
  - Framer Motion for smooth animations
  - XTerm.js or similar for professional terminal emulation
  - Socket.io for real-time bidirectional communication
  - Chart.js for performance visualizations
  - Cloudflare Tunnel for secure remote access
  - Mobile-first responsive design
  
  Key Integration Points:
  - Enhance existing HarvestTerminal.tsx component
  - Integrate with tmux session management
  - Connect to WebSocket event system
  - Maintain compatibility with multi_claude.py orchestration
  - Support Farm, Quick Task, and GoWild modes

steps:
  - content: |
      AGENT 1: Template Analyzer & System Architect
      
      Your role is to deeply analyze the claude-code-templates repository and create a comprehensive
      architecture for the Harvest Terminal upgrade. You will be the technical lead who understands
      both systems and guides the implementation.
    description: |
      Phase 1 - Repository Analysis (30 minutes):
      1. Navigate to the cloned claude-templates-analysis directory
      2. Analyze the mobile chat interface (cli-tool/src/analytics-web/chats_mobile.html)
      3. Study the WebSocket implementation (cli-tool/src/analytics-web/services/WebSocketService.js)
      4. Examine the state management system (cli-tool/src/analytics-web/services/StateService.js)
      5. Review the terminal styling and theme system in the CSS files
      6. Document all reusable patterns, components, and utilities
      
      Phase 2 - Architecture Blueprint Creation (45 minutes):
      1. Create a detailed architecture document: `docs/HARVEST_TERMINAL_ARCHITECTURE.md`
      2. Define the component hierarchy:
         - HarvestTerminalPro (main container)
         - TerminalThemeProvider (theme management)
         - AgentTerminalGrid (multi-agent display)
         - CommandPalette (quick actions)
         - PerformanceMonitor (metrics display)
         - MobileTerminalView (responsive mobile UI)
         - CloudflareTunnelManager (remote access)
      3. Design the data flow architecture:
         - WebSocket event handling
         - State management with Zustand
         - Real-time data synchronization
         - Mobile-desktop state sync
      4. Create interface definitions in TypeScript
      5. Define the theme system with multiple terminal themes
      6. Plan the mobile-first responsive layout
      
      Phase 3 - Integration Planning (30 minutes):
      1. Map existing HarvestTerminal.tsx functionality to new components
      2. Identify WebSocket events that need enhancement
      3. Plan backward compatibility strategy
      4. Create migration guide for existing features
      5. Define performance optimization strategies
      
      Deliverables:
      - Architecture document with diagrams
      - Component interface definitions
      - Integration roadmap
      - Theme system specification

  - content: |
      AGENT 2: Terminal UI Designer & Theme Artist
      
      Your mission is to create the most visually stunning terminal interface ever built,
      with beautiful themes, smooth animations, and professional terminal emulation.
    description: |
      Phase 1 - Theme System Implementation (45 minutes):
      1. Create `src/components/Harvest/themes/` directory structure
      2. Implement terminal themes:
         ```typescript
         // src/components/Harvest/themes/terminalThemes.ts
         export const themes = {
           matrix: {
             name: 'Matrix',
             colors: {
               background: '#0c0c0c',
               foreground: '#00ff00',
               cursor: '#00ff00',
               selection: 'rgba(0, 255, 0, 0.3)',
               // ... complete color palette
             },
             effects: {
               rainEffect: true,
               glowText: true,
               scanlines: true
             }
           },
           cyberpunk: {
             name: 'Cyberpunk 2077',
             colors: {
               background: '#0a0e1a',
               foreground: '#00d9ff',
               accent: '#ff0080',
               // ... neon color scheme
             },
             effects: {
               neonGlow: true,
               glitchEffect: true,
               particleBackground: true
             }
           },
           // Add 5+ more themes
         }
         ```
      3. Create theme provider component with context
      4. Implement theme switcher with preview
      5. Add CSS custom properties for dynamic theming
      
      Phase 2 - Terminal Window Components (60 minutes):
      1. Create `TerminalWindow` component with:
         - Custom title bar with agent name
         - Status indicators (active, idle, working)
         - Minimize/maximize/close buttons
         - Resize handles
         - Tab support for multiple sessions
      2. Implement `TerminalOutput` component:
         - Syntax highlighting for code blocks
         - Clickable links and file paths
         - Inline image previews
         - Collapsible sections
         - Search functionality
      3. Create `TerminalPrompt` component:
         - Auto-complete suggestions
         - Command history navigation
         - Multi-line editing support
         - Snippet insertion
      4. Build `AgentStatusCard`:
         - Live activity indicator
         - Performance metrics
         - Task progress bar
         - Communication graph
      
      Phase 3 - Animation System (45 minutes):
      1. Implement Framer Motion animations:
         ```typescript
         // src/components/Harvest/animations/terminalAnimations.ts
         export const terminalAnimations = {
           windowEntry: {
             initial: { scale: 0.8, opacity: 0, y: 20 },
             animate: { scale: 1, opacity: 1, y: 0 },
             transition: { type: "spring", stiffness: 300 }
           },
           typewriterEffect: {
             // Character-by-character reveal
           },
           glowPulse: {
             // Pulsing glow for active agents
           }
         }
         ```
      2. Create transition effects between views
      3. Add particle effects for special events
      4. Implement smooth scrolling with momentum
      5. Create loading animations for async operations
      
      Phase 4 - Professional Terminal Emulation (30 minutes):
      1. Integrate XTerm.js or similar library
      2. Configure terminal settings:
         - Font family and size options
         - Cursor styles (block, bar, underline)
         - Bell notifications
         - Scrollback buffer size
      3. Implement copy/paste functionality
      4. Add search within terminal output
      5. Create session recording capability
      
      Deliverables:
      - Complete theme system with 7+ themes
      - Terminal window components
      - Animation library
      - Professional terminal emulator integration

  - content: |
      AGENT 3: Mobile Interface & Cloudflare Tunnel Engineer
      
      You will create the mobile-optimized interface and set up Cloudflare tunnel for 
      secure remote monitoring from any device, anywhere in the world.
