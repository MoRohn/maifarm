  - content: |
      AGENT 5: Integration Master & Quality Assurance
      
      You will integrate all components, ensure backward compatibility, and deliver
      a production-ready Harvest Terminal that exceeds all expectations.
    description: |
      Phase 1 - Component Integration (60 minutes):
      1. Update main HarvestTerminal component:
         ```typescript
         // src/components/Harvest/HarvestTerminal.tsx
         import { HarvestTerminalPro } from './HarvestTerminalPro';
         
         // Maintain backward compatibility
         export const HarvestTerminal: React.FC<HarvestTerminalProps> = (props) => {
           const { legacyMode = false } = props;
           
           if (legacyMode) {
             return <LegacyHarvestTerminal {...props} />;
           }
           
           return <HarvestTerminalPro {...props} />;
         }
         ```
      2. Create feature flags system:
         - Progressive rollout
         - A/B testing support
         - User preferences
      3. Integrate all new components:
         - Theme system
         - Mobile views
         - WebSocket enhancements
         - Visualization tools
      4. Wire up event handlers:
         - Cross-component communication
         - State synchronization
         - Error boundaries
      
      Phase 2 - Testing Suite (45 minutes):
      1. Write comprehensive tests:
         ```typescript
         // src/components/Harvest/__tests__/HarvestTerminalPro.test.tsx
         describe('HarvestTerminalPro', () => {
           it('should render all agents in grid view', async () => {
             // Test grid layout
