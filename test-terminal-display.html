<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Display Test</title>
    <style>
        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #00ff00;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
        }
        .status {
            background: #0a0a0a;
            border: 1px solid #00ff00;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .terminal {
            background: #0a0a0a;
            border: 1px solid #00ff00;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .terminal-header {
            background: #00ff00;
            color: #0a0a0a;
            padding: 5px 10px;
            margin: -10px -10px 10px -10px;
            border-radius: 5px 5px 0 0;
            font-weight: bold;
        }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
        .info { color: #00ffff; }
        button {
            background: #00ff00;
            color: #0a0a0a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }
        button:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>
    <h1>🖥️ Terminal Display Test</h1>
    
    <div class="status">
        <h2>Session Status</h2>
        <div id="sessionInfo">Loading...</div>
    </div>

    <div class="controls">
        <button onclick="fetchSessions()">Refresh Sessions</button>
        <button onclick="fetchTerminalOutput()">Fetch Terminal Output</button>
        <button onclick="clearDisplay()">Clear Display</button>
    </div>
    <br>

    <div id="terminals"></div>

    <script>
        const API_BASE = 'http://localhost:4567/api';
        let currentSessions = [];
        
        async function fetchSessions() {
            try {
                const response = await fetch(`${API_BASE}/terminal/sessions`);
                const data = await response.json();
                
                if (data.success) {
                    currentSessions = data.data;
                    displaySessions(data.data);
                } else {
                    showError('Failed to fetch sessions');
                }
            } catch (error) {
                showError(`Error: ${error.message}`);
            }
        }
        
        function displaySessions(sessions) {
            const sessionInfo = document.getElementById('sessionInfo');
            if (sessions.length === 0) {
                sessionInfo.innerHTML = '<span class="error">No active sessions found</span>';
                return;
            }
            
            let html = '<ul>';
            sessions.forEach(session => {
                html += `<li class="success">
                    <strong>${session.sessionName}</strong> - 
                    ${session.paneCount} agents - 
                    Status: ${session.status} - 
                    Type: ${session.metadata?.type || 'unknown'}
                </li>`;
            });
            html += '</ul>';
            sessionInfo.innerHTML = html;
        }
        
        async function fetchTerminalOutput() {
            const terminalsDiv = document.getElementById('terminals');
            terminalsDiv.innerHTML = '';
            
            for (const session of currentSessions) {
                for (let i = 0; i < session.paneCount; i++) {
                    try {
                        const response = await fetch(`${API_BASE}/terminal/output?session=${session.sessionName}&pane=${i}`);
                        const data = await response.json();
                        
                        if (data.success) {
                            displayTerminal(session.sessionName, i, data.data);
                        }
                    } catch (error) {
                        console.error(`Error fetching output for ${session.sessionName}:${i}`, error);
                    }
                }
            }
        }
        
        function displayTerminal(sessionName, paneIndex, output) {
            const terminalsDiv = document.getElementById('terminals');
            
            const terminalDiv = document.createElement('div');
            terminalDiv.className = 'terminal';
            
            const header = document.createElement('div');
            header.className = 'terminal-header';
            header.textContent = `${sessionName} - Agent ${paneIndex}`;
            
            const content = document.createElement('div');
            content.textContent = Array.isArray(output) ? output.join('\n') : output;
            
            terminalDiv.appendChild(header);
            terminalDiv.appendChild(content);
            terminalsDiv.appendChild(terminalDiv);
        }
        
        function showError(message) {
            const sessionInfo = document.getElementById('sessionInfo');
            sessionInfo.innerHTML = `<span class="error">${message}</span>`;
        }
        
        function clearDisplay() {
            document.getElementById('terminals').innerHTML = '';
            document.getElementById('sessionInfo').innerHTML = 'Cleared. Click "Refresh Sessions" to reload.';
        }
        
        // Auto-refresh every 5 seconds
        setInterval(() => {
            fetchSessions();
            if (currentSessions.length > 0) {
                fetchTerminalOutput();
            }
        }, 5000);
        
        // Initial load
        fetchSessions();
    </script>
</body>
</html>
