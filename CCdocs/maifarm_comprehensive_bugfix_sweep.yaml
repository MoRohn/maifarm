agents:
  - name: "TypeScript Error Resolver"
    type: "developer"
    priority: "critical"
    capabilities: ["typescript", "type-checking", "code-analysis"]
    tasks:
      - "Fix remaining 20 TypeScript compilation errors"
      - "Implement strict type checking across all components"
      - "Add missing type definitions for union types"
      - "Resolve property access errors in AgentSettings.tsx"
      - "Fix event handler type mismatches in HarvestTerminal.tsx"
    instructions: |
      CRITICAL PRIORITY: Fix all TypeScript compilation errors to enable clean builds

      Step 1: Run TypeScript Error Analysis
      ```bash
      npm run typecheck
      ```
      
      Step 2: Fix AgentSettings.tsx Union Type Issues (8 errors)
      - Location: src/components/Settings/AgentSettings.tsx
      - Issue: Property access on union types (disabled, min, max, step)
      - Solution: Add type guards or optional chaining
      - Example Fix:
      ```typescript
      // Before: setting.disabled
      // After: 'disabled' in setting ? setting.disabled : false
      ```
      
      Step 3: Fix HarvestTerminal.tsx Event Handlers (3 errors)  
      - Location: src/components/Harvest/HarvestTerminal.tsx:414
      - Issue: MouseEvent not assignable to number parameter
      - Solution: Properly type event handlers
      - Example Fix:
      ```typescript
      // Before: onClick={(agentId) => selectAgent(agentId)}
      // After: onClick={(event) => selectAgent(parseInt(event.currentTarget.dataset.agentId))}
      ```
      
      Step 4: Fix SaveSeedModal.tsx Enum Issues (2 errors)
      - Location: src/components/Harvest/SaveSeedModal.tsx:259
      - Issue: Union type not assignable to literal type
      - Solution: Use type assertion or refactor type definition
      
      Step 5: Fix Missing Component Imports (3 errors)
      - Add missing ChevronDown import to SeedCreator.tsx:297
      - Add missing FileCode import to SeedCreator.tsx:397
      - Verify all Lucide React icons are properly imported
      
      Step 6: Verify All Fixes
      ```bash
      npm run typecheck
      npm run build
      ```
      
      SUCCESS CRITERIA: Zero TypeScript compilation errors

  - name: "Performance Optimizer"
    type: "performance-engineer"
    priority: "high"
    capabilities: ["bundle-analysis", "optimization", "code-splitting"]
    tasks:
      - "Reduce bundle size from 885KB to under 500KB"
      - "Implement code splitting for major routes"
      - "Optimize component imports and tree shaking"
      - "Add lazy loading for heavy components"
      - "Implement service worker caching strategies"
    instructions: |
      GOAL: Optimize application performance and reduce bundle size by 40%

      Step 1: Analyze Current Bundle
      ```bash
      npm run build
      npm run test:bundle
      ```
      
      Step 2: Implement Route-Based Code Splitting
      - Convert static imports to dynamic imports in App.tsx
      - Wrap heavy components with React.lazy()
      - Add Suspense boundaries with loading states
      - Example:
      ```typescript
      const AnalyticsPage = React.lazy(() => import('./components/Analytics/AnalyticsPage'));
      const HarvestPage = React.lazy(() => import('./components/Harvest/HarvestPage'));
      ```
      
      Step 3: Optimize Third-Party Dependencies
      - Replace heavy Chart.js with lightweight alternatives
      - Use tree-shaking for Lodash imports
      - Replace Moment.js with date-fns (if used)
      - Audit and remove unused dependencies
      
      Step 4: Implement Component-Level Optimizations
      - Add React.memo to expensive components
      - Optimize useEffect dependencies
      - Implement useMemo for expensive calculations
      - Add useCallback for event handlers
      
      Step 5: Configure Vite Optimizations
      - Enable build.rollupOptions.output.manualChunks
      - Configure build.target for modern browsers
      - Add compression plugins
      
      Step 6: Verify Performance Improvements
      ```bash
      npm run test:performance
      npm run analyze
      ```
      
      SUCCESS CRITERIA: Bundle size < 500KB, Lighthouse score > 90

  - name: "Security Auditor"
    type: "security-specialist"
    priority: "critical"
    capabilities: ["security-analysis", "vulnerability-assessment", "penetration-testing"]
    tasks:
      - "Complete comprehensive security audit"
      - "Fix all identified security vulnerabilities"
      - "Implement input sanitization across all forms"
      - "Add CSRF protection mechanisms"
      - "Secure WebSocket connections"
    instructions: |
      GOAL: Achieve zero critical security vulnerabilities

      Step 1: Run Security Audit
      ```bash
      npm audit
      npm run test:security
      ```
      
      Step 2: Fix Dependency Vulnerabilities
      - Update all packages with known vulnerabilities
      - Use npm audit fix --force if necessary
      - Replace vulnerable packages with secure alternatives
      
      Step 3: Implement Input Sanitization
      - Add XSS protection to all user inputs
      - Sanitize YAML content in farm creation
      - Validate all API request parameters
      - Use DOMPurify for HTML content
      - Example:
      ```typescript
      import DOMPurify from 'isomorphic-dompurify';
      const sanitizedContent = DOMPurify.sanitize(userInput);
      ```
      
      Step 4: Secure Authentication Flow
      - Implement proper JWT token validation
      - Add token refresh mechanism
      - Secure localStorage usage
      - Add session timeout handling
      
      Step 5: Secure WebSocket Communications
      - Add WebSocket authentication
      - Implement message validation
      - Add rate limiting for WebSocket messages
      - Secure connection origins
      
      Step 6: Add Security Headers
      - Configure CSP (Content Security Policy)
      - Add X-Frame-Options
      - Implement HTTPS enforcement
      - Add security middleware to Express server
      
      SUCCESS CRITERIA: Zero high/critical vulnerabilities, security score > 95%

  - name: "Error Handling Specialist"
    type: "reliability-engineer"
    priority: "high"
    capabilities: ["error-handling", "logging", "monitoring"]
    tasks:
      - "Implement application-wide error boundary"
      - "Add comprehensive error logging"
      - "Create graceful fallback UI components"
      - "Implement retry mechanisms for failed operations"
      - "Add user-friendly error messaging"
    instructions: |
      GOAL: Implement robust error handling with graceful degradation

      Step 1: Create Application Error Boundary
      - Location: src/components/ErrorBoundary/GlobalErrorBoundary.tsx
      - Wrap App component with error boundary
      - Add error reporting to external service
      - Include fallback UI with refresh option
      
      Step 2: Add Component-Level Error Boundaries
      - Wrap major sections (Dashboard, Farm Creation, Harvest)
      - Create specialized error boundaries for async operations
      - Add error recovery mechanisms
      
      Step 3: Implement API Error Handling
      - Create centralized error handling in API client
      - Add automatic retry for transient failures
      - Implement circuit breaker pattern
      - Add user-friendly error messages
      
      Step 4: Add WebSocket Error Recovery
      - Implement automatic reconnection
      - Add connection status indicators
      - Handle message queuing during disconnections
      - Add fallback for offline scenarios
      
      Step 5: Create Error Logging System
      - Implement structured logging
      - Add error categorization
      - Include user context and stack traces
      - Set up error alerting
      
      SUCCESS CRITERIA: No unhandled errors, 99.9% error recovery rate

  - name: "Memory Leak Hunter"
    type: "performance-engineer"
    priority: "medium"
    capabilities: ["memory-analysis", "profiling", "debugging"]
    tasks:
      - "Identify and fix all memory leaks"
      - "Implement proper cleanup in useEffect hooks"
      - "Fix event listener cleanup issues"
      - "Optimize component unmounting"
      - "Add memory usage monitoring"
    instructions: |
      GOAL: Eliminate all memory leaks and optimize memory usage

      Step 1: Run Memory Leak Detection
      ```bash
      npm run test:memory
      ```
      
      Step 2: Fix useEffect Cleanup Issues (8 components affected)
      - Add cleanup functions to all useEffect hooks with subscriptions
      - Fix WebSocket subscription cleanup
      - Add timer cleanup (setTimeout/setInterval)
      - Example:
      ```typescript
      useEffect(() => {
        const subscription = subscribe('event', handler);
        return () => subscription.unsubscribe(); // Cleanup
      }, []);
      ```
      
      Step 3: Fix Event Listener Cleanup
      - Add removeEventListener for all addEventListener calls
      - Fix window/document event listeners
      - Clean up ResizeObserver instances
      - Example:
      ```typescript
      useEffect(() => {
        const handleResize = () => { /* handler */ };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);
      ```
      
      Step 4: Optimize Component Dependencies
      - Fix exhaustive-deps warnings in useEffect
      - Use useCallback for event handlers
      - Use useMemo for expensive calculations
      - Implement proper dependency arrays
      
      Step 5: Add Memory Monitoring
      - Implement memory usage tracking
      - Add memory leak detection in development
      - Create memory usage dashboard
      
      SUCCESS CRITERIA: Zero memory leaks, stable memory usage over time

  - name: "Accessibility Champion"
    type: "accessibility-specialist"  
    priority: "medium"
    capabilities: ["a11y-testing", "wcag-compliance", "screen-reader-testing"]
    tasks:
      - "Ensure WCAG 2.1 AA compliance across all components"
      - "Add proper ARIA labels and roles"
      - "Fix keyboard navigation issues"
      - "Improve color contrast ratios"
      - "Add screen reader support"
    instructions: |
      GOAL: Achieve full WCAG 2.1 AA compliance

      Step 1: Run Accessibility Audit
      ```bash
      npm run test:accessibility
      ```
      
      Step 2: Fix Missing Alt Text (Images)
      - Add descriptive alt text to all images
      - Use empty alt="" for decorative images
      - Add aria-label for icon buttons
      
      Step 3: Improve Keyboard Navigation
      - Ensure all interactive elements are focusable
      - Add proper tab order with tabindex
      - Implement focus management for modals
      - Add focus indicators (visible focus rings)
      
      Step 4: Add ARIA Labels and Roles
      - Add aria-label to unlabeled buttons
      - Implement proper heading hierarchy (h1-h6)
      - Add role attributes for complex components
      - Use aria-describedby for form validation
      
      Step 5: Fix Color Contrast Issues
      - Ensure minimum 4.5:1 contrast ratio for text
      - Improve contrast for disabled states
      - Add high contrast mode support
      - Test with color blindness simulators
      
      Step 6: Add Screen Reader Support
      - Test with NVDA, JAWS, VoiceOver
      - Add live regions for dynamic content
      - Implement proper form labeling
      - Add skip navigation links
      
      SUCCESS CRITERIA: Perfect accessibility score, zero violations

  - name: "Test Coverage Engineer"
    type: "qa-engineer"
    priority: "medium"
    capabilities: ["test-automation", "coverage-analysis", "quality-assurance"]
    tasks:
      - "Achieve 90%+ test coverage across all components"
      - "Add unit tests for untested functions"
      - "Create integration tests for critical paths"
      - "Implement visual regression testing"
      - "Add performance regression tests"
    instructions: |
      GOAL: Comprehensive test coverage with automated quality gates

      Step 1: Measure Current Coverage
      ```bash
      npm run test:coverage
      ```
      
      Step 2: Add Unit Tests (Target: 90% coverage)
      - Test all utility functions
      - Test component props and state changes
      - Test error conditions and edge cases
      - Mock external dependencies
      
      Step 3: Create Integration Tests
      - Test API endpoints with real data
      - Test WebSocket message handling
      - Test database operations
      - Test authentication flows
      
      Step 4: Implement E2E Tests
      ```bash
      npm run test:critical-path
      npm run test:playwright
      ```
      - Test complete user workflows
      - Test cross-browser compatibility
      - Test mobile responsiveness
      - Test performance under load
      
      Step 5: Add Visual Regression Tests
      - Capture component screenshots
      - Test responsive layouts
      - Test theme variations
      - Test animation states
      
      Step 6: Set Up Continuous Testing
      - Add pre-commit hooks
      - Configure CI/CD pipeline
      - Add quality gates
      - Set up automated reporting
      
      SUCCESS CRITERIA: 90%+ test coverage, all tests passing

  - name: "Code Quality Enforcer"
    type: "code-reviewer"
    priority: "low"
    capabilities: ["code-analysis", "refactoring", "best-practices"]
    tasks:
      - "Enforce consistent code style across all files"
      - "Remove dead code and unused imports"
      - "Implement best practices for React components"
      - "Optimize component architecture"
      - "Add comprehensive documentation"
    instructions: |
      GOAL: Maintain high code quality standards and consistency

      Step 1: Run Code Quality Analysis
      ```bash
      npm run lint
      npm run format:check
      ```
      
      Step 2: Fix ESLint Violations
      - Fix all security-related warnings
      - Implement exhaustive-deps for useEffect
      - Add proper prop types and default props
      - Fix React Hooks violations
      
      Step 3: Remove Dead Code
      - Remove unused imports and variables
      - Delete unreachable code
      - Remove commented-out code blocks
      - Clean up unused CSS classes
      
      Step 4: Optimize Component Structure
      - Extract reusable components
      - Implement proper separation of concerns
      - Use custom hooks for complex logic
      - Optimize component re-renders
      
      Step 5: Add Code Documentation
      - Add JSDoc comments to all functions
      - Document complex algorithms
      - Add README files for major modules
      - Create API documentation
      
      Step 6: Implement Code Standards
      - Configure Prettier for consistent formatting
      - Add pre-commit hooks
      - Set up automated code reviews
      - Create style guide documentation
      
      SUCCESS CRITERIA: Zero ESLint violations, consistent code style

workflow:
  type: "parallel-with-dependencies"
  timeout: 14400  # 4 hours
  steps:
    - id: "critical-fixes"
      agents: ["TypeScript Error Resolver", "Security Auditor"]
      parallel: false
      description: "Fix critical blocking issues first"
      
    - id: "performance-optimization" 
      agents: ["Performance Optimizer", "Memory Leak Hunter"]
      parallel: true
      depends_on: ["critical-fixes"]
      description: "Optimize performance after critical fixes"
      
    - id: "quality-improvements"
      agents: ["Error Handling Specialist", "Accessibility Champion"]
      parallel: true
      depends_on: ["critical-fixes"]
      description: "Improve reliability and accessibility"
      
    - id: "testing-and-documentation"
      agents: ["Test Coverage Engineer", "Code Quality Enforcer"]
      parallel: true
      depends_on: ["performance-optimization", "quality-improvements"]
      description: "Final testing and documentation phase"

validation:
  success_criteria:
    - "Zero TypeScript compilation errors"
    - "Zero critical security vulnerabilities"
    - "Bundle size under 500KB"
    - "90%+ test coverage"
    - "Perfect accessibility score"
    - "Zero memory leaks"
    - "All E2E tests passing"
  
  verification_commands:
    - "npm run typecheck"
    - "npm run build"
    - "npm audit"
    - "npm run test:coverage"
    - "npm run test:accessibility"
    - "npm run test:memory"
    - "npm run test:critical-path"
    - "npm run test:performance"

reporting:
  format: "detailed"
  include:
    - "before/after metrics comparison"
    - "detailed fix summaries per component"
    - "performance improvements"
    - "security vulnerability remediation"
    - "test coverage improvements"
    - "accessibility compliance report"
  
  deliverables:
    - "comprehensive bug fix report"
    - "performance optimization summary"
    - "security audit results"
    - "updated architecture documentation"
    - "deployment readiness checklist"

settings:
  collaboration_enabled: true
  auto_retry: true
  retry_count: 3
  logging_level: "info"
  backup_before_changes: true
  incremental_commits: true
  
environment:
  node_version: "18+"
  npm_version: "9+"
  browser_targets: ["chrome", "firefox", "safari", "edge"]
  test_environments: ["development", "staging"]
  
tools_required:
  - "TypeScript 5.3+"
  - "ESLint with security plugins"
  - "Playwright for E2E testing"
  - "Jest for unit testing"
  - "Lighthouse for performance"
  - "axe-core for accessibility"

estimated_completion: "4-6 hours"
complexity: "high"
risk_level: "medium"
business_impact: "critical"

post_completion:
  verification_steps:
    - "Full application smoke test"
    - "Performance benchmark comparison"
    - "Security penetration test"
    - "Accessibility audit with screen readers"
    - "Cross-browser compatibility verification"
  
  deployment_checklist:
    - "All tests passing"
    - "Bundle size optimized"
    - "Security scan clean"
    - "Performance metrics within targets"
    - "Accessibility compliant"
    - "Documentation updated"
    - "Monitoring configured"