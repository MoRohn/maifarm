name: MaiFarm - Production-Ready, AI Orchestration Application with Qwen3-Coder Integration
description: With the latest updates to application from the MAIFARM_MULTI_AGENT_IMPROVEMENTS_PLAN.YAML file, ensure that Qwen3-Coder is setup to operate as an alternative to Claude Code for agent farms and tasks, ensuring cost-effectiveness, large context support, and seamless workflow compatibility.

initial_prompt: |
  You are tasked with integrating Qwen3-Coder into the updated MaiFarm, a production-ready, locally web-based AI orchestration platform originally built for the Multi-Agent Claude Code Orchestrator. Qwen3-Coder, a 480B-parameter Mixture-of-Experts model with 35B active parameters developed by Alibaba, offers a free API, large context windows (up to 256K tokens natively, extendable to 1M), and performance rivaling Claude Sonnet 4. Use React, Tailwind CSS, and TypeScript for the UI, and focus on modifying the back-end to support Qwen3-Coder as an alternative for agent farms and tasks. Prioritize end-to-end functionality, operational excellence, and a user-friendly experience while maintaining compatibility with the existing Claude Code setup.

  Key Requirements:
  - Integrate Qwen3-Coder as an optional alternative to Claude Code for agent farms and tasks
  - Maintain compatibility with the existing Claude Code workflow for agent orchestration
  - Leverage Qwen3-Coder's free API and large context windows (up to 256K tokens)
  - Update UI to allow user selection between Claude Code and Qwen3-Coder for farm creation
  - Ensure robust task execution and monitoring across both models
  - Preserve end-to-end functionality for AI agent orchestration

  Architecture Guidelines:
  - Use the python file 'llm_proxy.py' in the main repo folder for initial code/process to use API Router & Claude code as proxy for qlaude or Qwen-Coder throught claude
  - Use the python file 'llm_proxy_info.pdf' in the main repo folder for guide & details on integrating this process
  - Use React components with Tailwind CSS and TypeScript for UI updates
  - Modify back-end to support dual API endpoints (Claude and Qwen) with a proxy setup
  - Implement configuration switching via environment variables or .env files
  - Use WebSocket for real-time updates across both models
  - Ensure modular code to handle model-specific logic for farms and tasks
  - Write comprehensive tests (unit, integration) for new integration

  Before starting:

  1. Analyze existing Claude Code integration (API endpoints, CLI setup, farm configuration)
  2. Set up Qwen3-Coder CLI tool and test locally
  3. Review .env file for API key and endpoint configurations
  4. Define a strategy for user model selection in the UI and back-end
  5. Coordinate with agents to align back-end, UI, and farm execution changes


steps:
  - content: Ensure Qwen model is pulled from the normal Ollama local location in the /Users/[username]/.ollama folder
    description: |
      Complete the development process and preparation for go-live:
      - Use the a local Qwen Coder model from standard location, if not found, provide user way to select folder where model exists
      - Programmatticaly find it in the local .ollama folder & Programmatticaly run the Qwen coder model for use locally by maifarm


  - content: Enhance intuitive user experience for use to setup local Qwen Coder model from HuggingFace
    description: |
      Complete the development process and preparation for go-live:
      - Provide advice/info to user on Qwen local benefits and ensure they know Claude is fine alternative with an API key
      - From the Settings page, an backend process to validate local Qwen Coder model is available
      - If no model found, suggest user the default location, provide new path to instruct on download
      - Complete this user experience so that it doesn't leave Settings page, uses modals/windows in settings page


  - content: Develop and Provide a comparable experience to all of the Multi Claude functions & capabilities when using Qwen as AI Engine
    description: |
      Complete the development process and preparation for go-live:
      - Develop or Integrate where possible the same experiences that user gets with Claude into the Qwen experience
      - Ensure the YAML Generation is compatible & setup properly when using Qwen Coder.
      - Ensure that all elements including backend databases are integrated & accepting to the Qwen Coder functionality.
      - Test these new functions before adding them blindly. Only add the new capabilities to Qwen Coder version that are possible.
      

  - content: Test the integration for agent farms, go wild and quick tasks
    description: |
      Complete the development process and preparation for go-live:
      - Navigate to the project directory and run claude --version to verify Qwen3-Coder integration
      - Test a basic farm creation task with claude "Create a farm with 2 agents for a Python app"
      - Execute a task with claude "Generate a Python script for a REST API" and check the output
      - Validate real-time farm monitoring via WebSocket with Qwen3-Coder agents
      - Resolve any authentication or response errors by rechecking API key and endpoint
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Adapt prompts and workflows for Qwen3-Coder
    description: |
      Complete the development process and preparation for go-live:
      - Reuse existing Claude Code prompts for farm creation and task execution, testing them with Qwen3-Coder
      - Break complex tasks into steps (e.g., “Plan a farm, assign agents, execute tasks”) to leverage Qwen3-Coder’s chain-of-thought reasoning
      - Use Qwen Code’s agentic features with qwen-code "Create a web app with HTML, CSS, JS for a farm dashboard"
      - Adjust prompts if Qwen3-Coder interprets natural language differently (e.g., add clarity for agent roles)
      - Ensure compatibility with farm auto-scaling and task delegation
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Handle gotchas and optimize
    description: |
      Complete the development process and preparation for go-live:
      - Monitor performance and address initial slowness due to Qwen3-Coder’s size using the proxy setup
      - Review data privacy policies if handling sensitive farm data, considering local deployment if needed
      - Implement context management (e.g., session reset equivalent to Claude’s /clear) between farm tasks
      - Optimize API calls for large context windows (up to 256K tokens) for complex farm configurations
      - Document optimization strategies and privacy considerations
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Validate and iterate
    description: |
      Complete the development process and preparation for go-live:
      - Test Qwen3-Coder on a small farm (e.g., 2 agents, 1 task) to ensure task execution and monitoring
      - Compare outputs with Claude Code for code quality, farm performance, and task completion
      - Iterate on prompts or revert to Claude Code for specific farm tasks if Qwen3-Coder underperforms
      - Conduct end-to-end tests with a full farm lifecycle (creation, execution, harvest)
      - Gather feedback from agents and refine integration
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.