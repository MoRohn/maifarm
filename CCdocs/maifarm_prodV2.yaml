name: MaiFarm - Production-Ready, Live version of the localized AI Orchestration Application
description: Address operational errors in MaiFarm, including CORS issues, duplicate key warnings, and backend server unavailability, while finalizing the YAML Generator configuration and adding settings and alert notifications for a fully operational AI orchestration platform.

initial_prompt: |
  You are on a final mission to complete the operational development of MaiFarm, a production-ready, locally web-based application for the Multi-Agent Claude Code Orchestrator, designed as a software development team focused on delivering a fully operational AI orchestration platform. The name MaiFarm represents "Mai" (pronounced "My" with AI spelling) and "Farm" for the ecosystem of collaborative agents. Create a sleek logo reflecting this origin, emphasizing professionalism and elegance. Use React, Tailwind CSS, and TypeScript for a responsive, intuitive, Apple-inspired UI. Prioritize end-to-end functionality, operational excellence, and production-grade features like AI-generated YAML configurations, advanced monitoring, and autonomous 'Go Wild' exploration.

  Key Requirements:
  - Polished, Apple-inspired UI: Design a visually stunning, minimalistic, and intuitive interface with smooth animations, clean typography, and a cohesive color palette inspired by Apple's design philosophy. Ensure responsiveness across devices for a seamless user experience.
  - End-to-end Functionality: Enable comprehensive AI agent orchestration, supporting creation, management, and termination of Claude Code Agent Farms with real-time interaction and feedback.
  - Operational Claude Code Agent Farms: Ensure agent farm creation, configuration, and execution are fully functional, with support for dynamic scaling and task delegation across agents.
  - Scalable Architecture: Build an enterprise-grade system capable of handling large-scale workloads, with modular components and containerized services for flexibility and performance.
  - Comprehensive Monitoring and Logging: Integrate robust monitoring tools (e.g., Prometheus, Grafana) and centralized logging (e.g., ELK Stack or Loki) to provide real-time insights into system health, agent performance, and errors for production support.
  - Robust Application Functionality: Extend beyond AI-generated YAML configurations to include features like task scheduling, agent collaboration workflows, and error recovery mechanisms.
  - Orchestration Cockpit: Develop a centralized dashboard ("cockpit") for managing active Claude Code agents, displaying real-time metrics, agent statuses, and control options for starting, pausing, or reconfiguring agents.

  Architecture Guidelines:
  - React Components with Tailwind CSS and TypeScript: Use functional React components with Tailwind CSS for rapid styling and TypeScript for type safety and maintainable code. Ensure components are reusable and modular to support future extensions.
  - Real-time Updates and APIs: Implement WebSocket for real-time agent updates and REST APIs for configuration, management, and data retrieval, ensuring low-latency communication and reliable data exchange.
  - Scalable, Containerized Architecture: Design a modular architecture using containerization (e.g., Docker) and orchestration tools (e.g., Kubernetes) to ensure scalability, fault tolerance, and efficient resource utilization.
  - CI/CD Pipelines: Establish automated CI/CD pipelines using tools like GitHub Actions or Jenkins for continuous testing, building, and deployment to maintain code quality and streamline releases.
  - Offline Functionality: Leverage local storage and service workers to enable core functionality in offline or low-connectivity scenarios, ensuring uninterrupted user access.
  - Comprehensive Testing: Write thorough tests, including unit tests (e.g., Jest, React Testing Library), integration tests, and end-to-end tests (e.g., Cypress) to ensure reliability and robustness across the application.

  Before starting:
  1. Analyze Existing Builder Codebase: Review the current Builder codebase to ensure compatibility and seamless integration with MaiFarm components and APIs.
  2. Define APIs: Specify REST and WebSocket API endpoints for agent orchestration, including endpoints for agent creation, task assignment, and status monitoring, with clear documentation.
  3. Validate Data Models: Design and validate scalable data models to support high-performance agent interactions, ensuring efficient storage and retrieval of configurations and metrics.
  4. Establish Monitoring and Logging: Integrate production-grade monitoring (e.g., Prometheus for metrics, Grafana for visualization) and logging (e.g., ELK Stack or Loki) to enable proactive issue detection and resolution.
  5. Coordinate with Agents: Ensure seamless API and UI integration by collaborating with other AI agents, aligning on data formats, protocols, and user workflows for a cohesive experience.


steps:
  - content: Enhance & Validate the AI-Generated YAML Configuration Pipeline
    description: |
      Develop a production-ready YAML configuration pipeline:
      - Natural language prompt input for automatic YAML generation from 1-2 phrases
      - More robustness, inputs in the YAML config step to enhance the final product (sliders)
      - NLP to expand the details & steps required for the final YAML instruction file
      - AI-driven validation and optimization of YAML configurations
      - Integrated completely within the Farm Creation (Normal, Go Wild) modes
      - Process step in place for YAML rejection if pipeline failed or mis-configured YAML format

  - content: Enhance & Validate the Integration of the orchestrator.py tool into MaiFarm codebase
    description: |
      Fully integrate the orchestrator.py into the application:
      - Within integration, orchestrator.py logic should be used to launch AI agent 'Farms'
      - Monitoring the CLI/Terminal of each agent from orchestrator should be displayed in the Harvest page
      - Analytics page should be integrated to collect data for processing real-time analytics from the AI agents running through orchestrator
      - Within the Harvest page, users should have capability to click into each AI agent within the Farm to enter CLI commands to Claude Code
      - Implement the connections & integrations needed to operationalize the buttons on each active farm within the Active Farms section of the Home page

  - content: Enhance & Validate Advanced Analytics and Reporting
    description: |
      Validate a production-grade analytics and reporting system is working in the Analytic page:
      - Interactive dashboards with real-time D3.js visualizations
      - Predictive analytics for farm performance and bottlenecks
      - Customizable reporting with export to JSON, CSV, PDF
      - Data retention policies for compliance and storage optimization
      - AI-driven insights for optimizing agent collaboration