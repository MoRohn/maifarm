name: MaiFarm - Production-Ready Harvest Page and Multi-Claude UI Integration
description: Complete the development of the Harvest page and enhance the Multi-Claude functionality in MaiFarm, focusing on a sleek, dynamic grid UI for agent management, robust backend connections, and optimized agent orchestration. Ensure seamless integration with the existing orchestrator.py functionality for running and monitoring multiple agents.

initial_prompt: |
  You are tasked with completing the production-ready development of the Harvest page and Multi-Claude functionality in MaiFarm, a locally web-based application for the Multi-Agent Claude Code Orchestrator. The goal is to create a polished Harvest page for displaying agent results and a dynamic, grid-based UI for running and monitoring multiple agents, with robust backend processes and connections. Use React, Tailwind CSS, and TypeScript for the UI, ensuring scalability, user-friendliness, and optimal performance. Leverage the existing orchestrator.py functionality for agent orchestration and coordination.
  
  Key Requirements:
  - Develop a Harvest page to display, organize, and analyze agent results from Farm, Go Wild, or Quick Task modes
  - Create a dynamic, responsive grid UI for managing and monitoring multiple agents with controls and prompts
  - Ensure robust backend connections (WebSocket and REST API) with proper error handling
  - Integrate with orchestrator.py for agent orchestration and coordination
  - Implement settings for agent configuration and alert notifications for user feedback
  - Resolve any operational issues (e.g., CORS, WebSocket stability, React key warnings)
  - Maintain end-to-end functionality for AI agent orchestration

  Architecture Guidelines:
  - Use React components with Tailwind CSS and TypeScript for the UI
  - Configure backend with proper CORS settings and WebSocket stability
  - Ensure unique keys for React components to avoid warnings
  - Implement WebSocket and REST API with comprehensive error handling
  - Use local storage for settings persistence and agent configurations
  - Write unit and integration tests for all components and backend processes
  - Integrate with orchestrator.py's TmuxManager and CoordinationManager for agent control

  Before starting:
  - Review orchestrator.py for agent orchestration logic
  - Analyze console logs for operational errors (e.g., CORS, WebSocket issues)
  - Plan the Harvest page layout and grid-based UI for agent controls
  - Test backend connections with sample agent runs
  - Ensure compatibility with existing coordination mechanisms

steps:

  - content: Develop the Harvest Page for Agent Results
    description: |
      Complete the Harvest page to display and organize results from Farm, Go Wild, or Quick Task modes:
      - Identify and curate significant digital artifacts from each agent (e.g., code, logs, outputs) for user review
      - Design an Apple-inspired, clean, and intuitive UI with Tailwind CSS, focusing on brevity and impactful headlines
      - Include analytical insights (e.g., performance metrics, task completion rates) in a visually appealing format
      - Add an option to save a "Seed" (configuration or results snapshot) for future farm creation
      - Create an awe-inspiring effect with animations or transitions when the Harvest is presented
      - Test with sample agent outputs to ensure clarity and usability

  - content: Implement Dynamic Grid UI for Multi-Claude Agent Management
    description: |
      Develop a sleek, responsive grid UI for running and monitoring multiple agents:
      - Create a dynamic grid layout using Tailwind CSS that adjusts to screen size and agent count
      - Display each agent's status, current task, and prompt input field with controls (e.g., start, stop, reset)
      - Integrate with orchestrator.py's TmuxManager to send commands and capture pane outputs
      - Show real-time updates (e.g., agent status, logs) using WebSocket connections
      - Ensure unique React keys for grid components to avoid warnings
      - Test with multiple agents (e.g., 3-5) to verify dynamic sizing and responsiveness

  - content: Configure Robust Backend Processes and Connections
    description: |
      Ensure stable backend processes and connections for agent orchestration:
      - Resolve CORS issues by setting a single Access-Control-Allow-Origin header (e.g., http://localhost:3000)
      - Implement WebSocket connections for real-time agent updates, integrated with CoordinationManager
      - Add error handling for WebSocket disconnections and API failures
      - Validate REST API endpoints (e.g., /api/agents/status) for agent monitoring
      - Test backend with Postman or cURL to confirm CORS and WebSocket functionality
      - Ensure compatibility with orchestrator.py's file-based coordination system

  - content: Implement Settings and Alert Notifications
    description: |
      Add settings and alert notifications for enhanced user control:
      - Create a settings page to configure agent parameters (e.g., stagger time, number of agents)
      - Persist settings in local storage for user convenience
      - Implement alert notifications for key events (e.g., agent completion, errors, Harvest ready)
      - Use Tailwind CSS for a consistent, modern look across settings and notifications
      - Test settings updates and notification triggers with sample agent runs
      - Ensure notifications are non-intrusive and provide actionable feedback

  - content: Write Comprehensive Tests
    description: |
      Develop unit and integration tests to ensure reliability:
      - Write unit tests for React components (Harvest page, grid UI) using Jest and React Testing Library
      - Create integration tests for backend APIs and WebSocket connections
      - Test agent orchestration workflows using orchestrator.py's functionality
      - Validate error handling for edge cases (e.g., agent crashes, network failures)
      - Ensure 100% test coverage for critical components (Harvest page, agent grid, backend)
      - Run tests in CI/CD pipeline to confirm production readiness

  - content: Enhance the YAML Generation with user prompt enhancement
    description: |
      Complete the development of the YAML Generation process by adding a step to prompt Claude for enhanced prompt based on user prompt, use your AI skills to build a creative prompt for this process:
      - Retain existing structure of the YAML Generation process, validate that Claude accepts final result
      - Introduce new steps to send claude request to enhance prompt prior to adding the enhanced user text to YAML generator
      - Backend process, ensure addition does not break existing process