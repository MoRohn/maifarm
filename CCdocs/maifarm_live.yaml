name: MaiFarm - Production-Ready, Live version of the localized AI Orchestration Application
description: Complete the QA and remaining build for a fully operational, production-ready, locally web-based Mac application for the Multi-Agent Claude Code Orchestrator, focusing on end-to-end functionality, operational excellence, and a polished, Apple-inspired UI. MaiFarm Pro emphasizes robust AI orchestration, scalability, and enterprise-grade reliability.

initial_prompt: |
  You are completing the development of MaiFarm, a production-ready, locally web-based application for the Multi-Agent Claude Code Orchestrator, designed as a software development team focused on delivering a fully operational AI orchestration platform. The name MaiFarm represents "Mai" (pronounced "My" with AI spelling) and "Farm" for the ecosystem of collaborative agents. Create a sleek logo reflecting this origin, emphasizing professionalism and elegance. Use React, Tailwind CSS, and TypeScript for a responsive, intuitive, Apple-inspired UI. Prioritize end-to-end functionality, operational excellence, and production-grade features like AI-generated YAML configurations, advanced monitoring, and autonomous 'Go Wild' exploration.

  Key Requirements:
  - Polished, Apple-inspired UI with seamless user experience
  - End-to-end functionality for AI agent orchestration
  - Operations like Claude Code Agent Farm(s) creations are working end-to-end
  - Scalable architecture for enterprise-grade workloads
  - Comprehensive monitoring and logging for production support
  - Robust functionality of the application beyond AI YAML creation
  - Orchestration cockpit for active Claude Code agents

  Architecture Guidelines:
  - Use React components with Tailwind CSS and TypeScript for type safety
  - Implement WebSocket-based real-time updates and REST APIs
  - Ensure scalability with modular, containerized architecture
  - Incorporate CI/CD pipelines for automated testing and deployment
  - Use local storage and service workers for offline functionality
  - Write comprehensive tests (unit, integration, end-to-end)

  Before starting:
  1. Analyze existing Builder codebase for integration and compatibility
  2. Define REST and WebSocket APIs for agent orchestration
  3. Validate data models for scalability and performance
  4. Establish monitoring and logging integrations for production support
  5. Coordinate with other agents for seamless API and UI integration

steps:
  - content: Finishing touches
    description: |
      Complete the development process and preparation for go-live:
      - Identify any and all remaining issues and/or errors
      - Ensure UI is polished, Apple-inspired UI with seamless user experience
      - Test and QA all functionality, list issues, assign issues to resolve to other agents, team member
      - Ensure back-end is working in conjunction with the UI and user input
      - Check for any issues at startup that do not allow app to start
      - Do not stop working until the MaiFarm app is fully operational and 100% ready to go live.

  - content: Finishing validation of operational application and its functionalities
    description: |
      Complete the QA and validation process:
      - Validate application runs only in a "prod" like mode and all "dev" modes are shelved or completely removed for good code hygiene
      - Ensure UI is polished, Apple-inspired UI with seamless user experience
      - Test and QA all functionality, validate working as expected and codebase would present
      - Ensure back-end is working in conjunction with the UI and user input & backend databases
      - Do not stop working until the MaiFarm app is fully operational and 100% ready to go live.