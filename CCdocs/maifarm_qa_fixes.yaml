name: MaiFarm - QA Issues Resolution and Production Readiness
description: Address all critical, high, and medium priority issues identified in the QA Execution Report to achieve production readiness with comprehensive testing and validation.

initial_prompt: |
  You are tasked with resolving all issues identified in the MaiFarm QA Execution Report dated August 4, 2025. The application currently has a 66.7% test pass rate with critical WebSocket and Redis connectivity issues preventing production deployment. Your mission is to fix all identified problems, implement missing functionality, and ensure the application achieves 100% production readiness.
  
  QA Report Summary:
  - Test Pass Rate: 66.7% (10 passed, 5 failed out of 15 tests)
  - Critical Issues: WebSocket connectivity, Redis connection failure
  - High Priority: API response consistency, Quick task validation, XSS protection
  - Medium Priority: Harvest workflow, excessive logging, farm ID consistency
  
  Key Requirements:
  - Fix all critical infrastructure issues (WebSocket, Redis)
  - Standardize API responses to JSON format
  - Complete end-to-end harvest workflow implementation
  - Implement comprehensive security measures
  - Achieve 100% test coverage for critical paths
  - Ensure real-time features are fully operational
  - Optimize performance and reduce log noise
  
  Architecture Guidelines:
  - Use TypeScript for type safety across frontend and backend
  - Implement proper error handling and recovery mechanisms
  - Ensure WebSocket reconnection logic with exponential backoff
  - Configure Redis with connection pooling and fallback strategies
  - Write comprehensive tests for all fixes
  - Document all changes and solutions
  
  Before starting:
  1. Review the complete QA_EXECUTION_REPORT.md for detailed issue descriptions
  2. Analyze server logs at /tmp/maifarm-server.log for error patterns
  3. Check current WebSocket and Redis configurations
  4. Review existing test suites for coverage gaps
  5. Coordinate with other agents to prevent conflicts

steps:
  - content: Fix Critical WebSocket Connectivity Issues
    description: |
      Resolve the WebSocket connection failures preventing real-time updates:
      - Debug Socket.io server configuration on port 4567
      - Fix "Socket hang up" errors after connection attempts
      - Implement proper CORS configuration for WebSocket endpoints
      - Add connection pooling and automatic reconnection with exponential backoff
      - Implement heartbeat mechanism to maintain persistent connections
      - Add WebSocket connection status indicator in UI
      - Create fallback polling mechanism when WebSocket fails
      - Write comprehensive tests for WebSocket connectivity
      - Validate real-time updates work across all features
      - Do not stop until WebSocket connectivity is 100% operational

  - content: Establish Redis Connection and Caching Layer
    description: |
      Fix Redis connection failures and implement proper caching:
      - Debug Redis connection configuration and credentials
      - Implement connection pooling with configurable pool size
      - Add retry logic with exponential backoff for connection failures
      - Create fallback to in-memory cache when Redis is unavailable
      - Implement proper session storage using Redis
      - Configure TTL policies for different cache types
      - Add Redis health monitoring and alerts
      - Implement cache warming strategies for frequently accessed data
      - Write tests for Redis operations and fallback scenarios
      - Ensure the application works seamlessly with or without Redis

  - content: Standardize API Response Format to JSON
    description: |
      Fix API endpoints returning HTML instead of JSON:
      - Audit all API endpoints for response format consistency
      - Fix farm list endpoint (/api/farms) to return JSON
      - Fix farm details endpoints to return proper JSON structure
      - Ensure all error responses follow consistent JSON format
      - Add response interceptors to validate JSON structure
      - Implement content-type headers verification
      - Update API documentation with response schemas
      - Add integration tests for all API endpoints
      - Validate frontend properly handles JSON responses
      - Do not stop until all API responses are consistently JSON

  - content: Fix Quick Task Execution Endpoint
    description: |
      Resolve 400 Bad Request errors for quick task execution:
      - Debug quick task endpoint payload validation
      - Fix request body schema to match expected structure
      - Implement proper input validation with clear error messages
      - Add request body validation middleware
      - Update API documentation with correct payload examples
      - Implement proper error handling for invalid requests
      - Add unit tests for payload validation
      - Test with various quick task scenarios
      - Ensure quick task execution works end-to-end
      - Validate task results are properly returned

  - content: Implement Complete Harvest Workflow
    description: |
      Complete the harvest collection and analysis workflow:
      - Implement harvest collection API endpoint
      - Create harvest data aggregation service
      - Design harvest results storage schema
      - Implement harvest analytics and metrics calculation
      - Create harvest visualization components
      - Add harvest export functionality (JSON, CSV, PDF)
      - Implement harvest comparison features
      - Add harvest history and versioning
      - Write comprehensive tests for harvest workflow
      - Ensure harvest works with complete farm lifecycle

  - content: Enhance Security and Input Validation
    description: |
      Implement comprehensive security measures:
      - Add XSS protection with input sanitization
      - Implement CSRF token validation
      - Add rate limiting to prevent abuse
      - Implement proper SQL injection prevention
      - Add security headers (helmet.js configuration)
      - Implement content security policy (CSP)
      - Add input validation for all user inputs
      - Implement proper authentication flow (when not bypassed)
      - Add security audit logging
      - Write security-focused test suite

  - content: Optimize Performance and Reduce Log Noise
    description: |
      Address performance issues and excessive logging:
      - Fix "Loaded 23 work claims" repetitive logging
      - Implement proper log levels (debug, info, warn, error)
      - Add log rotation and archiving
      - Optimize database queries with proper indexing
      - Implement query result caching
      - Add performance monitoring metrics
      - Optimize bundle size and lazy loading
      - Implement code splitting for better load times
      - Add performance benchmarks and tests
      - Ensure p95 response time stays under 100ms

  - content: Complete GoWild Mode Implementation
    description: |
      Implement and test GoWild autonomous exploration features:
      - Complete GoWild mode initialization logic
      - Implement autonomous task generation
      - Add exploration boundaries and safety controls
      - Create rollback mechanisms for failed explorations
      - Implement creativity controls and parameters
      - Add exploration visualization and monitoring
      - Create exploration history and analytics
      - Implement safety monitors and circuit breakers
      - Write comprehensive tests for GoWild features
      - Validate GoWild mode works with multi-agent coordination

  - content: Implement Multi-Agent Coordination
    description: |
      Complete multi-agent orchestration functionality:
      - Fix agent coordination file monitoring (/tmp/claude_coordination/active_agents.json)
      - Implement agent communication protocols
      - Add agent task distribution logic
      - Create agent health monitoring
      - Implement agent failure recovery
      - Add agent performance metrics
      - Create agent collaboration workflows
      - Implement agent scaling mechanisms
      - Write tests for multi-agent scenarios
      - Ensure seamless coordination between multiple agents

  - content: Add Comprehensive Error Handling
    description: |
      Implement robust error handling across the application:
      - Add global error boundaries in React components
      - Implement API error interceptors
      - Create user-friendly error messages
      - Add error recovery mechanisms
      - Implement retry logic for transient failures
      - Create error logging and reporting
      - Add error analytics and monitoring
      - Implement graceful degradation strategies
      - Write tests for error scenarios
      - Ensure no unhandled promise rejections

  - content: Implement Monitoring and Observability
    description: |
      Set up comprehensive monitoring and observability:
      - Configure Prometheus metrics collection
      - Set up Grafana dashboards for visualization
      - Implement distributed tracing
      - Add custom metrics for business logic
      - Create alerting rules for critical issues
      - Implement log aggregation and analysis
      - Add performance profiling tools
      - Create health check endpoints
      - Implement SLA monitoring
      - Document monitoring procedures

  - content: Enhance Testing Coverage
    description: |
      Achieve comprehensive test coverage:
      - Write unit tests for all new fixes
      - Add integration tests for API endpoints
      - Create E2E tests with Cypress for critical paths
      - Implement load testing with k6
      - Add performance regression tests
      - Create security test suite
      - Implement visual regression testing
      - Add accessibility testing
      - Achieve minimum 80% code coverage
      - Set up continuous testing in CI/CD

  - content: Update Documentation and Deployment Preparation
    description: |
      Prepare for production deployment:
      - Update API documentation with all changes
      - Create deployment runbook
      - Document configuration requirements
      - Create production environment checklist
      - Update README with setup instructions
      - Document troubleshooting procedures
      - Create performance tuning guide
      - Document security best practices
      - Prepare rollback procedures
      - Create post-deployment validation checklist

  - content: Final QA Validation and Sign-off
    description: |
      Conduct final validation before production:
      - Re-run all QA tests from original test plan
      - Validate all critical issues are resolved
      - Confirm 100% pass rate for critical paths
      - Perform load testing with production-like data
      - Conduct security penetration testing
      - Validate all monitoring and alerts work
      - Test disaster recovery procedures
      - Get stakeholder sign-off
      - Create production deployment plan
      - Do not stop until 100% production ready