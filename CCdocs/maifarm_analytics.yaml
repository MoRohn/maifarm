name: MaiFarm Pro - Production-Ready AI Orchestration Application
description: Enhance MaiFarm by developing a high-quality, real-time Analytics page that matches the Home page's style and design, featuring metrics and visuals for farm performance, CPU/GPU usage, harvest analytics, farming costs, and other critical MaiFarm insights.

initial_prompt: |
  You are tasked with enhancing MaiFarm, a production-ready, locally web-based application for the Multi-Agent Claude Code Orchestrator, by developing a real-time Analytics page. The page should mirror the Home page's Apple-inspired style and design, using React, Tailwind CSS, and TypeScript. Incorporate high-quality metrics and visualizations for farm performance, CPU/GPU usage, harvest analytics, farming costs (using real data from Claude Code), and other important MaiFarm analytics. Ensure a seamless, responsive, and intuitive user experience.

  Key Requirements
  - Match the Home page's design with a polished, Apple-inspired UI
  - Provide real-time metrics and visualizations for farm performance, CPU/GPU usage, harvest analytics, and farming costs
  - Use real data from Claude Code for accurate analytics
  - Ensure responsiveness across devices with a cohesive color palette and smooth animations
  - Include additional analytics relevant to MaiFarm (e.g., agent efficiency, task completion rates)
  - Support scalability and real-time updates via WebSocket

  Architecture Guidelines:
  - Use React components with Tailwind CSS and TypeScript for type safety
  - Implement WebSocket for real-time data updates
  - Integrate D3.js or Chart.js for high-quality visualizations
  - Ensure modular and reusable components
  - Use local storage for offline data caching
  - Write comprehensive tests (unit, integration)

  Before starting:
  - Analyze Home page design for style consistency
  - Define data models for analytics metrics
  - Set up WebSocket endpoints for real-time data
  - Gather real data from Claude Code for analytics
  - Plan visualization layouts and interactions

steps:
  - content: Design the Analytics page layout
    description: |
      Complete the development process and preparation for go-live:
      - Replicate the Home page's header, sidebar, and card-based layout
      - Design a metrics overview section with cards for farm performance, CPU/GPU usage, harvest analytics, and farming costs
      - Add a grid layout for additional analytics (e.g., agent efficiency, task completion)
      - Ensure responsiveness with Tailwind CSS breakpoints (320px, 768px, 1200px+)
      - Incorporate smooth animations using framer-motion
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Implement real-time data fetching
    description: |
      Complete the development process and preparation for go-live:
      - Set up WebSocket connection to receive real-time metrics from the backend
      - Define REST API endpoints (e.g., /api/analytics) for initial data load
      - Fetch real data from Claude Code for farm performance, CPU/GPU usage, and farming costs
      - Implement data aggregation and processing on the backend
      - Ensure fallback to cached data using local storage during disconnections
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Develop visualizations
    description: |
      Complete the development process and preparation for go-live:
      - Use D3.js or Chart.js to create visualizations for farm performance (e.g., line chart)
      - Design a bar chart for CPU/GPU usage with real-time updates
      - Implement a pie chart for harvest analytics (e.g., by farm type)
      - Create a cost breakdown chart for farming costs using Claude Code data
      - Add interactive tooltips and filters for deeper insights
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Integrate additional analytics
    description: |
      Complete the development process and preparation for go-live:
      - Add metrics for agent efficiency (e.g., tasks per agent, success rate)
      - Include task completion rates with historical trends
      - Design a summary card for overall MaiFarm health (e.g., uptime, error rate)
      - Ensure data is updated in real-time via WebSocket
      - Validate accuracy with sample Claude Code data
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Test and optimize
    description: |
      Complete the development process and preparation for go-live:
      - Conduct unit tests for data fetching and visualization components
      - Perform integration tests for real-time updates and responsiveness
      - Optimize performance for large datasets with lazy loading
      - Test across devices (mobile, tablet, desktop) for consistency
      - Gather user feedback and iterate on design
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.