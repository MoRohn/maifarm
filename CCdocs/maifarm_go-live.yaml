name: MaiFarm - Production-Ready, Live version of the localized AI Orchestration Application
description: Complete remaining development for the Multi-Agent Claude Code Orchestrator, focusing on end-to-end functionality, operational excellence, and a polished, Apple-inspired UI. MaiFarm Pro emphasizes robust AI orchestration, scalability, and enterprise-grade reliability.

initial_prompt: |
  You are on a final mission to complete the operational development of MaiFarm, a production-ready, locally web-based application for the Multi-Agent Claude Code Orchestrator, designed as a software development team focused on delivering a fully operational AI orchestration platform. The name MaiFarm represents "Mai" (pronounced "My" with AI spelling) and "Farm" for the ecosystem of collaborative agents. Create a sleek logo reflecting this origin, emphasizing professionalism and elegance. Use React, Tailwind CSS, and TypeScript for a responsive, intuitive, Apple-inspired UI. Prioritize end-to-end functionality, operational excellence, and production-grade features like AI-generated YAML configurations, advanced monitoring, and autonomous 'Go Wild' exploration.
  
  Key Requirements:
  - Polished, Apple-inspired UI with seamless user experience
  - End-to-end functionality for AI agent orchestration
  - Operations like Claude Code Agent Farm(s) creations are working end-to-end
  - Scalable architecture for enterprise-grade workloads
  -Comprehensive monitoring and logging for production support
  - Robust functionality of the application beyond AI YAML creation
  - Orchestration cockpit for active Claude Code agents

  Architecture Guidelines:
  - Use React components with Tailwind CSS and TypeScript for type safety
  - Implement WebSocket-based real-time updates and REST APIs
  - Ensure scalability with modular, containerized architecture
  - Incorporate CI/CD pipelines for automated testing and deployment
  - Use local storage and service workers for offline functionality
  Write comprehensive tests (unit, integration, end-to-end)

  Before starting:
  - Analyze existing Builder codebase for integration and compatibility
  - Define REST and WebSocket APIs for agent orchestration
  - Validate data models for scalability and performance
  - Establish monitoring and logging integrations for production support
  - Coordinate with other agents for seamless API and UI integration

steps:

  - content: Operationalize the Quick Actions - New Farm option
    description: |
      Complete the development process and preparation for go-live:
      - Identify any and all remaining issues and/or errors with existing functionality
      - Test and QA all functionality, list issues, assign issues to resolve to other agents, team member
      - Ensure back-end is working in conjunction with the UI and user input
      - Implement a REST API endpoint (e.g., /api/farms) to handle farm creation requests, validating farm name, description, and type
      - Develop a backend service to store farm data in a scalable database (e.g., PostgreSQL) and trigger agent initialization
      - Integrate WebSocket updates to reflect new farm creation in the UI in real-time
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Operationalize the Quick Actions - Go Wild option
    description: |
      Complete the development process and preparation for go-live:
      - Identify any and all remaining issues and/or errors with existing functionality
      - Test and QA all functionality, list issues, assign issues to resolve to other agents, team member
      - Ensure back-end is working in conjunction with the UI and user input
      - Implement a REST API endpoint (e.g., /api/farms/go-wild) to initiate autonomous agent exploration
      - Develop a backend service to manage self-directed agent tasks, logging exploration progress
      - Integrate WebSocket updates to provide real-time feedback on agent activities in the UI
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Operationalize the Quick Actions - Quick Task option
    description: |
      Complete the development process and preparation for go-live:
      - Identify any and all remaining issues and/or errors with existing functionality
      - Test and QA all functionality, list issues, assign issues to resolve to other agents, team member
      - Ensure back-end is working in conjunction with the UI and user input
      - Implement a REST API endpoint (e.g., /api/tasks) to handle quick task submissions
      - Develop a backend service to execute simple tasks with minimal agent coordination and store results
      - Integrate WebSocket updates to display task completion status in the UI
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.


  - content: Operationalize the Harvest collection, presentation, and organization
    description: |
      Complete the development process and preparation for go-live:
      - Identify any and all remaining issues and/or errors with existing functionality
      - Test and QA all functionality, list issues, assign issues to resolve to other agents, team member
      - Ensure back-end is working in conjunction with the UI and user input
      - Implement a REST API endpoint (e.g., /api/harvests) to retrieve and save completed farm outputs
      - Develop a backend service to organize harvests by farm, with searchable metadata and categorization
      - Create a UI component to present harvests in a grid layout with filters and sorting options
      - Integrate WebSocket updates to notify users of new harvests in real-time
      - Do not stop working on this feature until it is fully operational and 100% ready to go live.