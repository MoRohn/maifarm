<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Mark -->
  <g id="logo-mark">
    <!-- Stylized M representing fields/farms -->
    <path d="M10 45 L20 20 L30 35 L40 20 L50 45" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- AI nodes/connections -->
    <circle cx="20" cy="20" r="3" fill="#3B82F6"/>
    <circle cx="30" cy="35" r="3" fill="#3B82F6"/>
    <circle cx="40" cy="20" r="3" fill="#3B82F6"/>
    
    <!-- Connection lines -->
    <path d="M20 20 L30 35 M30 35 L40 20" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Growth/organic element -->
    <path d="M30 35 Q32 30 35 28" stroke="#10B981" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="35" cy="28" r="2" fill="#10B981"/>
  </g>
  
  <!-- Wordmark -->
  <g id="wordmark">
    <!-- Mai -->
    <text x="65" y="35" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="600" fill="#1F2937">
      Mai<tspan fill="#3B82F6">Farm</tspan>
    </text>
    
    <!-- Tagline -->
    <text x="65" y="48" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#6B7280" letter-spacing="0.5">
      AI ORCHESTRATION ECOSYSTEM
    </text>
  </g>
  
  <!-- Subtle animation -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    target="#logo-mark"
    type="scale"
    values="1;1.02;1"
    dur="4s"
    repeatCount="indefinite"/>
</svg>