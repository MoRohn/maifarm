<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- MaiFarm Icon - Minimalist square format -->
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="currentColor" opacity="0.05"/>
  
  <!-- Mai stylized icon -->
  <g id="mai-icon" transform="translate(32, 32)">
    <!-- Central AI node -->
    <circle cx="0" cy="0" r="6" fill="currentColor" opacity="0.9"/>
    
    <!-- Orbital farm nodes -->
    <g id="farm-nodes">
      <!-- Top nodes -->
      <circle cx="-10" cy="-14" r="4" fill="currentColor" opacity="0.6"/>
      <circle cx="10" cy="-14" r="4" fill="currentColor" opacity="0.6"/>
      
      <!-- Side nodes -->
      <circle cx="-16" cy="0" r="4" fill="currentColor" opacity="0.6"/>
      <circle cx="16" cy="0" r="4" fill="currentColor" opacity="0.6"/>
      
      <!-- Bottom nodes -->
      <circle cx="-10" cy="14" r="4" fill="currentColor" opacity="0.6"/>
      <circle cx="10" cy="14" r="4" fill="currentColor" opacity="0.6"/>
    </g>
    
    <!-- Connection paths -->
    <g id="connections" opacity="0.3">
      <path d="M0,0 L-10,-14 M0,0 L10,-14" stroke="currentColor" stroke-width="1.5"/>
      <path d="M0,0 L-16,0 M0,0 L16,0" stroke="currentColor" stroke-width="1.5"/>
      <path d="M0,0 L-10,14 M0,0 L10,14" stroke="currentColor" stroke-width="1.5"/>
      
      <!-- Orbital connections -->
      <path d="M-10,-14 L-16,0 L-10,14" stroke="currentColor" stroke-width="1" fill="none"/>
      <path d="M10,-14 L16,0 L10,14" stroke="currentColor" stroke-width="1" fill="none"/>
    </g>
    
    <!-- Center AI indicator -->
    <circle cx="0" cy="-2" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="0" cy="2" r="1.5" fill="#FFFFFF" opacity="0.9"/>
  </g>
  
  <!-- Animated pulse effect -->
  <defs>
    <radialGradient id="pulse-gradient">
      <stop offset="0%" style="stop-color:currentColor;stop-opacity:0.2">
        <animate attributeName="stop-opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:currentColor;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <circle cx="32" cy="32" r="28" fill="url(#pulse-gradient)"/>
</svg>