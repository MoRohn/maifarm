<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="animGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Central core -->
  <g transform="translate(60, 60)">
    <!-- Pulsing core -->
    <rect x="-20" y="-20" width="40" height="40" rx="10" fill="url(#animGradient)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-14" y="-14" width="28" height="28" rx="7" fill="#ffffff" opacity="0.9"/>
    <circle r="6" fill="url(#animGradient)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Rotating agent orbit -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      
      <!-- Agent 1 -->
      <circle cx="0" cy="-35" r="8" fill="#10b981" opacity="0.8">
        <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Agent 2 -->
      <circle cx="30.3" cy="-17.5" r="7" fill="#8b5cf6" opacity="0.8">
        <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite" begin="0.33s"/>
      </circle>
      
      <!-- Agent 3 -->
      <circle cx="30.3" cy="17.5" r="7" fill="#f59e0b" opacity="0.8">
        <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite" begin="0.66s"/>
      </circle>
      
      <!-- Agent 4 -->
      <circle cx="0" cy="35" r="8" fill="#06b6d4" opacity="0.8">
        <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite" begin="1s"/>
      </circle>
      
      <!-- Agent 5 -->
      <circle cx="-30.3" cy="17.5" r="7" fill="#ec4899" opacity="0.8">
        <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite" begin="1.33s"/>
      </circle>
      
      <!-- Agent 6 -->
      <circle cx="-30.3" cy="-17.5" r="7" fill="#14b8a6" opacity="0.8">
        <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite" begin="1.66s"/>
      </circle>
    </g>
    
    <!-- Connection pulses -->
    <g stroke="url(#animGradient)" stroke-width="2" fill="none">
      <!-- Pulse rings -->
      <circle r="25">
        <animate attributeName="r" values="25;45;25" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
      </circle>
      
      <circle r="25">
        <animate attributeName="r" values="25;45;25" dur="3s" repeatCount="indefinite" begin="1s"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite" begin="1s"/>
      </circle>
      
      <circle r="25">
        <animate attributeName="r" values="25;45;25" dur="3s" repeatCount="indefinite" begin="2s"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite" begin="2s"/>
      </circle>
    </g>
  </g>
</svg>