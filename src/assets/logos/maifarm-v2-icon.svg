<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    
    <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#ffffff"/>
  
  <!-- Central core -->
  <g transform="translate(32, 32)">
    <!-- Main hub -->
    <rect x="-12" y="-12" width="24" height="24" rx="6" fill="url(#iconGradient)" filter="url(#iconShadow)"/>
    <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#ffffff" opacity="0.9"/>
    
    <!-- Center dot -->
    <circle r="3" fill="url(#iconGradient)"/>
    
    <!-- Agent nodes - simplified -->
    <g>
      <circle cx="0" cy="-20" r="6" fill="#10b981" opacity="0.8"/>
      <circle cx="17" cy="-10" r="5" fill="#8b5cf6" opacity="0.8"/>
      <circle cx="17" cy="10" r="5" fill="#f59e0b" opacity="0.8"/>
      <circle cx="0" cy="20" r="6" fill="#06b6d4" opacity="0.8"/>
      <circle cx="-17" cy="10" r="5" fill="#ec4899" opacity="0.8"/>
      <circle cx="-17" cy="-10" r="5" fill="#14b8a6" opacity="0.8"/>
    </g>
    
    <!-- Connection lines -->
    <g stroke="url(#iconGradient)" stroke-width="1" fill="none" opacity="0.3">
      <path d="M0 -12 L0 -14"/>
      <path d="M8.5 -8.5 L10 -10"/>
      <path d="M12 0 L14 0"/>
      <path d="M8.5 8.5 L10 10"/>
      <path d="M0 12 L0 14"/>
      <path d="M-8.5 8.5 L-10 10"/>
      <path d="M-12 0 L-14 0"/>
      <path d="M-8.5 -8.5 L-10 -10"/>
    </g>
  </g>
</svg>