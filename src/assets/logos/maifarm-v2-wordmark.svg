<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="48" viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wordmarkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon part -->
  <g transform="translate(24, 24)">
    <!-- Simplified icon -->
    <rect x="-10" y="-10" width="20" height="20" rx="5" fill="url(#wordmarkGradient)"/>
    <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#ffffff" opacity="0.9"/>
    <circle r="2.5" fill="url(#wordmarkGradient)"/>
    
    <!-- Mini agent dots -->
    <circle cx="0" cy="-14" r="3" fill="#10b981" opacity="0.8"/>
    <circle cx="12" cy="-7" r="2.5" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="12" cy="7" r="2.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="0" cy="14" r="3" fill="#06b6d4" opacity="0.8"/>
    <circle cx="-12" cy="7" r="2.5" fill="#ec4899" opacity="0.8"/>
    <circle cx="-12" cy="-7" r="2.5" fill="#14b8a6" opacity="0.8"/>
  </g>
  
  <!-- Wordmark -->
  <g transform="translate(60, 24)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#0f172a">
      <tspan>Mai</tspan><tspan fill="url(#wordmarkGradient)">Farm</tspan>
    </text>
    <text y="12" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="8" font-weight="400" fill="#64748b" letter-spacing="1">
      MULTI-AGENT ORCHESTRATOR
    </text>
  </g>
</svg>