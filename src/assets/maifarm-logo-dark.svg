<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- MaiFarm Logo Dark Mode - Optimized for dark backgrounds -->
  
  <!-- Mai text with custom letterforms -->
  <g id="mai-text">
    <!-- M -->
    <path d="M10 40V20L20 30L30 20V40" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- a with ai fusion -->
    <circle cx="45" cy="35" r="5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M50 35V40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="45" cy="28" r="1.5" fill="#60A5FA" opacity="0.8"/>
    
    <!-- i with minimalist dot -->
    <path d="M60 30V40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="24" r="2" fill="#60A5FA"/>
  </g>
  
  <!-- Farm icon - abstract collaborative nodes with glow -->
  <g id="farm-icon" transform="translate(80, 30)">
    <!-- Glow effect -->
    <circle cx="0" cy="0" r="6" fill="#60A5FA" opacity="0.2" filter="url(#glow)"/>
    
    <!-- Central node -->
    <circle cx="0" cy="0" r="4" fill="#60A5FA"/>
    
    <!-- Orbital nodes representing agents -->
    <circle cx="-12" cy="-8" r="3" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="12" cy="-8" r="3" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="-12" cy="8" r="3" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="12" cy="8" r="3" fill="#FFFFFF" opacity="0.7"/>
    
    <!-- Connections -->
    <path d="M0,0 L-12,-8 M0,0 L12,-8 M0,0 L-12,8 M0,0 L12,8" 
          stroke="#60A5FA" 
          stroke-width="1" 
          opacity="0.5"/>
  </g>
  
  <!-- Farm text -->
  <g id="farm-text" transform="translate(110, 20)">
    <!-- F -->
    <path d="M0 20V0H12M0 10H10" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- a -->
    <circle cx="22" cy="15" r="5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M27 15V20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    
    <!-- r -->
    <path d="M35 10V20M35 15C35 12 37 10 40 10" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- m -->
    <path d="M48 20V10C48 10 48 8 50 8C52 8 52 10 52 10V20M52 10C52 10 52 8 54 8C56 8 56 10 56 10V20" 
          stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Filters and gradients -->
  <defs>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Animated gradient for dark mode -->
    <linearGradient id="mai-gradient-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.1">
        <animate attributeName="stop-opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.05">
        <animate attributeName="stop-opacity" values="0.05;0.1;0.05" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  
  <!-- Subtle background glow effect -->
  <rect x="0" y="0" width="200" height="60" fill="url(#mai-gradient-dark)" opacity="0.3" rx="8"/>
</svg>