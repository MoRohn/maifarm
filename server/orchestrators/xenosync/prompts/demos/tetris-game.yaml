name: Retro Tetris Arcade Game
description: Build a classic Tetris arcade game with modern web technologies and authentic retro aesthetics

initial_prompt: |
  You are building a Tetris arcade game with authentic retro 8-bit aesthetics. This is a single-player falling-block puzzle game where the player arranges tetrominoes to clear lines.

  The game should feature:
  - Classic tetromino pieces (I, O, T, S, Z, J, L shapes)
  - Smooth piece movement and rotation mechanics
  - Line clearing with satisfying visual feedback
  - Progressive difficulty with increasing drop speeds
  - Hold piece and next piece preview systems
  - Combo and T-spin scoring bonuses
  - Level progression and speed ramping
  - Authentic arcade sound effects and visuals
  
  Technology Stack:
  - HTML5 Canvas for rendering
  - JavaScript/TypeScript for game logic
  - CSS for retro arcade cabinet styling
  - LocalStorage for high scores and statistics
  - Web Audio API for classic arcade sounds
  
  CRITICAL SUCCESS FACTORS:
  - Functionality FIRST: Get core mechanics working perfectly before adding polish
  - Test immediately: Validate each feature as soon as you implement it
  - Controls are KING: Ensure piece movement feels smooth and responsive
  - Integration focus: Make sure all systems work together seamlessly
  - Browser testing: Test in Chrome, Firefox, Safari, Edge
  - Performance: Maintain smooth 60fps gameplay
  
  Remember: A simple game that works perfectly is infinitely better than a complex game with broken mechanics. Build systematically, test thoroughly, and ensure each step creates a solid foundation for the next.

metadata:
  recommended_agents: 7
  recommended_mode: parallel
  estimated_time: 35
  difficulty: intermediate
  tags: [game, arcade, tetris, canvas, javascript, retro, puzzle, falling-blocks, grid]

steps:
  - content: Game Foundation & Piece Control System
    description: |
      **Build the complete foundation with working piece movement:**
      
      **Project Setup:**
      - Create index.html with HTML5 canvas element
      - Set up basic CSS with retro arcade styling (neon colors, pixel fonts)
      - Initialize main JavaScript files: game.js, piece.js, utils.js
      - Create basic project structure: js/, css/, assets/, sounds/
      - Set up game loop with requestAnimationFrame (60fps target)
      
      **Piece Control Implementation:**
      - Create Piece class with tetromino shape definitions (I, O, T, S, Z, J, L)
      - Implement piece position system (x, y coordinates on 10x20 grid)
      - Add keyboard input handling (Arrow keys: left/right/down, up for rotate)
      - Create rotation system with wall kick mechanics
      - Add soft drop (down arrow) and hard drop (spacebar) functionality
      - Implement piece preview rendering above playfield
      
      **Essential Testing & Validation:**
      - Test piece movement in all directions (left, right, down)
      - Verify smooth 60fps movement with no stuttering
      - Test rotation for all 7 piece types in all orientations
      - Confirm rotation wall kicks work near boundaries
      - Test soft drop acceleration and hard drop instant placement
      - Validate in multiple browsers (Chrome, Firefox, Safari, Edge)
      - Test with different keyboard layouts and devices
      - Ensure consistent timing across different frame rates
      
      **Deliverables:**
      - Fully functional piece control with all 7 tetrominoes
      - Responsive keyboard controls with rotation
      - Basic HTML5 canvas game setup
      - Foundation code architecture for remaining features
      
      **Success Criteria:** All tetromino pieces move and rotate perfectly with smooth, responsive controls before proceeding to grid implementation.

  - content: Grid System & Collision Detection
    description: |
      **Build the complete grid system with perfect collision detection:**
      
      **Grid Implementation:**
      - Design classic Tetris playfield (10 columns x 20 rows visible, 2 hidden rows above)
      - Create grid data structure using 2D array (0=empty, 1-7=piece colors)
      - Implement grid rendering system with block sprites/graphics
      - Add grid boundary detection for left, right, and bottom edges
      - Create ghost piece projection showing where piece will land
      - Include grid cell highlighting for better visibility
      
      **Collision Detection System:**
      - Implement precise collision detection for piece movement
      - Add collision checking before allowing movement or rotation
      - Create collision prediction system (check next position before moving)
      - Handle edge cases for rotations near walls (Super Rotation System)
      - Implement piece locking mechanism when hitting bottom or other pieces
      - Add lock delay system (0.5 seconds before piece locks)
      
      **Advanced Movement Features:**
      - Enable slide movements when piece is at bottom (before locking)
      - Implement infinite spin prevention (limit rotations before lock)
      - Add DAS (Delayed Auto Shift) for holding movement keys
      - Create ARR (Auto Repeat Rate) for smooth continuous movement
      
      **Comprehensive Testing & Validation:**
      - Test collision detection with every piece type
      - Verify pieces cannot move through walls or other pieces
      - Test piece locking mechanism on bottom and on other pieces
      - Validate rotation collision and wall kick system
      - Test lock delay allows for last-second adjustments
      - Verify ghost piece accurately shows landing position
      - Test rapid piece movements and rotations
      - Confirm grid boundaries are respected in all scenarios
      - Test edge cases: pieces at borders, tight spaces
      - Performance test: ensure collision detection doesn't impact 60fps
      
      **Deliverables:**
      - Complete functional grid with perfect collision detection
      - Smooth piece movement that respects all boundaries
      - Working piece locking and placement system
      - Robust foundation for line clearing mechanics
      
      **Success Criteria:** Pieces move perfectly within the grid with zero collision bugs and accurate placement before implementing line clearing.

  - content: Line Clearing & Scoring System
    description: |
      **Implement the complete line clearing and scoring mechanics:**
      
      **Line Clearing Implementation:**
      - Detect completed horizontal lines (all 10 cells filled)
      - Implement line removal animation with flash effect
      - Create gravity system to drop rows above cleared lines
      - Handle multiple simultaneous line clears (up to 4 - Tetris)
      - Add line clear delay for visual feedback (0.5 seconds)
      - Track total lines cleared and display counter
      
      **Scoring System:**
      - Single line: 100 points × level
      - Double lines: 300 points × level
      - Triple lines: 500 points × level
      - Tetris (4 lines): 800 points × level
      - Soft drop: 1 point per cell
      - Hard drop: 2 points per cell
      - Implement score display with retro-style font
      - Add combo multiplier for consecutive line clears
      - Create T-spin detection and bonus scoring (mini: 100, regular: 400)
      
      **Visual & Audio Feedback:**
      - Add line clear animation with row flash
      - Implement score popup animations
      - Create sound effects for line clearing (different for 1-4 lines)
      - Add Tetris celebration effect (special animation/sound)
      - Implement combo counter display
      - Create particle effects for special clears
      
      **Statistics Tracking:**
      - Track line clear distribution (singles, doubles, triples, Tetrises)
      - Implement piece statistics (count of each tetromino used)
      - Create efficiency metrics (lines per piece)
      - Add time played counter
      - Implement LocalStorage-based statistics saving
      
      **Comprehensive Testing & Validation:**
      - Test line detection for all row positions
      - Verify multiple simultaneous lines clear correctly
      - Test scoring calculations for all clear types
      - Validate gravity system drops pieces correctly after clears
      - Test combo system with consecutive clears
      - Verify T-spin detection and scoring
      - Test statistics tracking accuracy
      - Confirm score persistence across browser sessions
      - Test rapid line clearing scenarios
      - Validate animation timing doesn't affect gameplay
      - Performance test: ensure smooth gameplay during line clears
      
      **Edge Case Testing:**
      - Test clearing bottom row vs top row
      - Verify clearing non-consecutive lines
      - Test maximum score display (999,999+ points)
      - Validate statistics with extended play sessions
      
      **Deliverables:**
      - Fully functional line clearing system
      - Complete scoring mechanism with combos and bonuses
      - Working statistics tracking
      - Satisfying visual and audio feedback
      - Solid foundation for level progression
      
      **Success Criteria:** All line clearing mechanics work perfectly, scoring is accurate, and visual feedback is satisfying before implementing game progression.

  - content: Game Mechanics & Progression System
    description: |
      **Implement gravity, speed progression, and piece generation:**
      
      **Gravity & Drop Speed System:**
      - Create gravity timer that moves pieces down automatically
      - Implement level-based speed progression (starts at 1 second per drop)
      - Add speed increase formula (level 1: 1s, level 10: 0.1s, level 20: 0.05s)
      - Create smooth gravity interpolation for visual consistency
      - Implement soft drop speed multiplier (20x normal gravity)
      - Add hard drop instant placement with trail effect
      
      **Piece Generation System:**
      - Implement 7-bag randomizer (all 7 pieces before repeating)
      - Create next piece queue (show next 3-5 pieces)
      - Add piece spawn position and orientation
      - Implement initial rotation and position for each piece type
      - Create piece entry delay (spawn → control delay)
      - Add top-out detection (game over when spawn blocked)
      
      **Level Progression:**
      - Implement level advancement (every 10 lines cleared)
      - Create speed curve scaling with levels
      - Add level-based scoring multipliers
      - Implement level color themes (background/piece colors change)
      - Create milestone rewards (bonus points at levels 10, 20, 30)
      - Add maximum level cap (typically level 29 or 99)
      
      **Game Modes:**
      - **Marathon**: Classic endless mode with level progression
      - **Sprint**: Clear 40 lines as fast as possible
      - **Ultra**: Score as many points as possible in 3 minutes
      - **Zen**: Relaxed mode with no game over
      - Create mode selection menu with descriptions
      - Implement mode-specific rules and scoring
      
      **Advanced Mechanics:**
      - Implement hold piece functionality (swap current with held)
      - Add hold piece restrictions (one swap per piece)
      - Create extended placement phase for high-level play
      - Implement 20G mode (instant drop at highest levels)
      - Add invisible mode for extreme challenge (pieces disappear after locking)
      
      **Comprehensive Testing & Validation:**
      - Test gravity timing at all speed levels
      - Verify piece generation maintains fair distribution
      - Test level progression and speed increases
      - Validate hold piece functionality and restrictions
      - Test game over detection when playfield fills
      - Confirm all game modes work with correct rules
      - Test piece preview accuracy
      - Verify soft/hard drop speeds are consistent
      - Test extended play sessions for stability
      - Validate difficulty curve feels appropriate
      - Performance test: high-speed gameplay maintains 60fps
      
      **Integration Testing:**
      - Test piece generation with line clearing
      - Verify level progression with scoring system
      - Test hold piece with various piece types
      - Confirm game modes transition correctly
      - Test speed changes feel smooth and fair
      
      **Deliverables:**
      - Complete gravity and speed progression system
      - Fair piece generation with preview queue
      - Multiple game modes with unique rules
      - Hold piece functionality
      - Balanced difficulty progression
      
      **Success Criteria:** All game mechanics work flawlessly, progression feels balanced, and different modes provide variety before implementing special features.

  - content: Special Features & Advanced Techniques
    description: |
      **Implement advanced Tetris techniques and special features:**
      
      **T-Spin System:**
      - Detect T-piece rotations that result in T-spins
      - Implement T-spin Mini detection (1 corner filled)
      - Create T-spin Regular detection (3 corners filled)
      - Add T-spin Double and Triple line clear bonuses
      - Implement visual indicators for successful T-spins
      - Create T-spin setup recognition guides
      
      **Combo System:**
      - Track consecutive line clears without placing non-clearing pieces
      - Implement escalating combo multipliers (2x, 3x, 4x, etc.)
      - Add combo counter display with visual effects
      - Create combo break detection and reset
      - Implement back-to-back bonuses (consecutive Tetrises or T-spins)
      - Add perfect clear bonus (completely empty playfield)
      
      **Advanced Controls:**
      - Implement 180-degree rotation (instant flip)
      - Add fine-tuned DAS (Delayed Auto Shift) settings
      - Create customizable control schemes
      - Implement button remapping functionality
      - Add finesse optimization hints
      - Create input display for training mode
      
      **Ghost Piece & Guides:**
      - Enhance ghost piece with transparency settings
      - Add grid guides for piece placement
      - Create landing prediction indicators
      - Implement piece trajectory visualization
      - Add placement assistance for beginners
      - Create colorblind-friendly piece colors
      
      **Special Effects & Rewards:**
      - Implement all-clear/perfect clear detection (1000 bonus points)
      - Add special animations for difficult clears
      - Create achievement system with unlockables
      - Implement replay recording and playback
      - Add screenshot functionality for high scores
      - Create special event triggers (milestone scores)
      
      **Training Features:**
      - Implement practice mode with specific scenarios
      - Add finesse trainer (optimal piece placement)
      - Create T-spin setup practice
      - Implement opener practice (PCO, MKO, TKI)
      - Add speed training mode
      - Create custom scenario editor
      
      **Comprehensive System Testing:**
      - Test T-spin detection in all valid configurations
      - Verify combo system tracks accurately
      - Test back-to-back bonus calculations
      - Validate perfect clear detection and scoring
      - Test advanced control options and customization
      - Confirm ghost piece assists without hindering gameplay
      - Test achievement unlocks and progress tracking
      - Verify replay system captures all movements
      - Test training modes provide helpful practice
      
      **Edge Case Testing:**
      - Test T-spin at playfield edges
      - Verify combo system with mixed clear types
      - Test perfect clear with different piece combinations
      - Validate control customization persistence
      - Test replay accuracy with complex movements
      
      **Performance & Balance Testing:**
      - Ensure special effects don't impact performance
      - Test scoring balance with advanced techniques
      - Validate training modes improve player skills
      - Confirm features enhance rather than complicate gameplay
      
      **Deliverables:**
      - Complete T-spin detection and scoring system
      - Full combo and back-to-back mechanics
      - Advanced control options and customization
      - Training and practice modes
      - Achievement and reward system
      
      **Success Criteria:** All advanced techniques work perfectly, special features enhance gameplay depth, and training modes effectively teach skills before adding final polish.

  - content: Visual Effects & Audio System
    description: |
      **Create polished retro arcade presentation and audio:**
      
      **Visual Effects & Animations:**
      - Implement smooth piece falling animations
      - Create piece lock animation with flash effect
      - Add line clear animations with row dissolution
      - Implement piece rotation animations with smooth transitions
      - Create particle effects for line clears and special moves
      - Add screen shake for Tetris and T-spin clears
      - Implement score popup animations with scaling and fade
      - Create level transition effects with color shifts
      - Add matrix rain effect for game over screen
      
      **Retro Arcade Styling:**
      - Apply classic Tetris color palette (cyan, yellow, purple, green, red, blue, orange)
      - Implement CRT monitor effect overlay (optional scanlines)
      - Add retro pixel fonts for UI elements and scores
      - Create arcade cabinet border styling around playfield
      - Implement attract mode demo animation when idle
      - Add authentic arcade-style UI elements (score, level, lines)
      - Create retro loading screen with classic aesthetics
      
      **Comprehensive Audio System:**
      - **Background Music**: Classic Tetris themes (Type A, B, C)
      - **Piece Sounds**: Rotation, movement, and lock sound effects
      - **Clear Sounds**: Different sounds for 1, 2, 3, 4 line clears
      - **Special Sounds**: T-spin success, perfect clear, level up
      - **Danger Music**: Speed up music when stack gets high
      - **Menu Audio**: Navigation sounds and selection feedback
      - **Achievement Audio**: Unlock sounds and milestone fanfares
      - **Ambient Effects**: Arcade ambiance and background noise
      
      **Audio Management:**
      - Implement Web Audio API for high-quality sound playback
      - Create dynamic music system that responds to gameplay
      - Add volume controls (master, music, effects)
      - Implement audio crossfading for smooth transitions
      - Create audio settings persistence (LocalStorage)
      - Add browser audio permission handling
      - Optimize audio loading for fast game startup
      
      **Advanced Visual Features:**
      - Implement piece trail effects for fast movements
      - Create dynamic backgrounds that react to gameplay
      - Add playfield lighting effects for special clears
      - Implement smooth camera shake for impacts
      - Create visual feedback for all player actions
      - Add performance optimization for visual effects
      - Implement theme customization (classic, modern, neon)
      
      **Testing & Validation:**
      - Test all animations run smoothly at 60fps
      - Verify audio plays correctly in all browsers
      - Test volume controls and audio transitions
      - Validate visual effects enhance gameplay clarity
      - Test audio synchronization with game events
      - Confirm retro aesthetic maintains consistency
      - Test on various screen sizes and resolutions
      - Validate audio doesn't delay game startup
      - Test accessibility features (colorblind modes)
      - Verify visual feedback improves gameplay
      
      **Audio Quality Testing:**
      - Test audio in different browser environments
      - Verify no audio distortion or clipping
      - Test music loops seamlessly
      - Validate dynamic music changes with gameplay
      - Test audio performance with multiple simultaneous sounds
      
      **Deliverables:**
      - Complete visual effects system with smooth animations
      - Full retro arcade audio implementation
      - Dynamic music system that responds to gameplay
      - Polished UI with authentic arcade styling
      - Optimized performance with all audiovisual features
      
      **Success Criteria:** Game looks and sounds like authentic retro Tetris while maintaining perfect performance and enhancing gameplay clarity before implementing final game states.

  - content: Game States & Final Integration
    description: |
      **Create complete game flow and comprehensive final testing:**
      
      **Game State Management:**
      - **Start Screen**: Title with animated falling pieces, menu options
      - **Mode Select**: Choose between Marathon, Sprint, Ultra, Zen
      - **Ready Screen**: Countdown before game starts (3, 2, 1, GO!)
      - **Playing State**: Active gameplay with pause functionality
      - **Paused State**: Game pause with resume/restart/quit options
      - **Game Over**: Final score display with statistics
      - **High Score Entry**: Name input for leaderboard
      - **Settings Menu**: Controls, audio, video, and gameplay options
      
      **User Interface Systems:**
      - Create main menu with navigation (Play, High Scores, Settings, Help)
      - Implement in-game HUD (Score, Level, Lines, Next pieces, Hold)
      - Add pause menu with quick restart option
      - Create settings screen with sliders and toggles
      - Implement leaderboard with local and online scores
      - Add tutorial mode with interactive instructions
      - Create statistics screen with detailed play history
      
      **Progression & Persistence:**
      - Implement career statistics tracking (total lines, pieces, time)
      - Add unlock system for themes and music
      - Create player profile with customization options
      - Implement cloud save functionality (optional)
      - Add daily challenges with special rules
      - Create seasonal events and limited-time modes
      
      **Final Features & Polish:**
      - Implement comprehensive save/load system
      - Add keyboard shortcut display and customization
      - Create responsive design for different screen sizes
      - Implement full-screen mode with proper scaling
      - Add performance monitoring and FPS display
      - Create accessibility options (colorblind, reduced motion)
      
      **Comprehensive End-to-End Testing:**
      
      **Complete Gameplay Testing:**
      - Full playthrough of each game mode multiple times
      - Test all menu navigation and state transitions
      - Verify progression unlocks work correctly
      - Test pause/resume during intense gameplay
      - Validate high score system with real scores
      - Test statistics tracking accuracy
      - Confirm all modes have correct rules and scoring
      
      **Cross-Browser Compatibility:**
      - Test thoroughly in Chrome, Firefox, Safari, Edge
      - Verify consistent performance across browsers
      - Test audio compatibility and fallbacks
      - Validate visual rendering accuracy
      - Test input handling consistency
      - Confirm LocalStorage functionality
      
      **Performance & Stability Testing:**
      - Extended gameplay sessions (60+ minutes)
      - Memory usage monitoring (no memory leaks)
      - Frame rate consistency at high speeds
      - Audio performance with multiple sounds
      - Large number handling (scores, statistics)
      - Browser tab switching behavior
      
      **User Experience Testing:**
      - Control responsiveness at all speed levels
      - Menu usability and navigation flow
      - Tutorial effectiveness for new players
      - Settings accessibility and clarity
      - Mobile/touch device compatibility
      - Learning curve and difficulty progression
      
      **Edge Case & Stress Testing:**
      - Rapid input combinations at high speeds
      - Browser refresh during gameplay
      - Network connectivity for online features
      - Low-end device performance
      - Unusual screen resolutions
      - Extended pause and resume cycles
      
      **Documentation Creation:**
      - Create comprehensive README.md with:
        * Installation and setup instructions
        * Complete controls and techniques guide
        * Browser compatibility matrix
        * Performance requirements
        * Troubleshooting common issues
        * Code architecture overview
        * Customization and modding guide
        * Testing results summary
      
      **Quality Assurance Checklist:**
      - [ ] All piece movements and rotations work perfectly
      - [ ] Collision detection has zero bugs
      - [ ] Line clearing mechanics function flawlessly
      - [ ] Scoring system is accurate and fair
      - [ ] All game modes work with correct rules
      - [ ] Audio plays correctly without issues
      - [ ] Visual effects enhance gameplay
      - [ ] Game states transition smoothly
      - [ ] Cross-browser compatibility confirmed
      - [ ] Performance maintains 60fps
      - [ ] Game is addictive and fun
      - [ ] Documentation is complete
      
      **Deliverables:**
      - Complete, polished Tetris game ready for release
      - Multiple game modes with unique challenges
      - Comprehensive documentation and help system
      - Proven cross-browser compatibility
      - Performance-optimized codebase
      - Authentic, addictive Tetris gameplay
      
      **Success Criteria:** Game is completely functional, thoroughly tested, well-documented, and provides an authentic, enjoyable Tetris experience that works flawlessly across all target platforms and browsers.