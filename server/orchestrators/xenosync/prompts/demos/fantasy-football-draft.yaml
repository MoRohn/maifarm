name: Fantasy Football Draft Study Suite
description: Build a comprehensive fantasy football draft preparation dashboard that aggregates free public resources, rankings, and visualizations to help users make informed draft decisions

initial_prompt: |
  You are building a fantasy football draft study suite that aggregates publicly available resources, statistics, and visualizations from various free fantasy football websites. This suite will help users prepare for their drafts by providing easy access to rankings, analysis tools, and draft strategy resources without requiring API keys or authentication.

  Study Suite Core Features:
  - Aggregated player rankings from multiple free sources
  - Embedded statistical visualizations and charts
  - Draft strategy articles and guides
  - ADP (Average Draft Position) tracking from public sources
  - Injury news aggregation from RSS feeds
  - Mock draft simulators (embedded from free sites)
  - Cheat sheet generator using public data
  
  Data Sources (Free & Public):
  - FantasyPros consensus rankings
  - ESPN public player pages
  - Yahoo Sports fantasy content
  - NFL.com fantasy resources
  - Reddit r/fantasyfootball resources
  - Pro-Football-Reference statistics
  - RSS feeds for news aggregation
  
  Technology Stack:
  - React with TypeScript for the frontend
  - Web scraping with cheerio/puppeteer
  - iframe embeds for interactive tools
  - Local storage for user preferences
  - Tailwind CSS for responsive design
  
  CRITICAL SUCCESS FACTORS:
  - Zero-cost data sources only
  - Fast loading with cached resources
  - Mobile-responsive design
  - Offline capability with saved data
  - Clean, intuitive interface
  - Regular auto-refresh of public data

metadata:
  recommended_agents: 10
  recommended_mode: parallel
  estimated_time: 15
  difficulty: intermediate
  tags: [dashboard, fantasy-sports, web-scraping, react, typescript, free-resources]

steps:
  - content: Project Setup & Architecture
    description: |
      **Initialize the lightweight study suite:**
      
      **Project Structure:**
      - Create React app with TypeScript
      - Set up Tailwind CSS for styling
      - Configure component structure: pages/, components/, services/, utils/
      - Set up local storage for caching
      - Create responsive layout templates
      
      **Data Architecture:**
      - Design player data model for aggregated rankings
      - Create news feed structure
      - Plan iframe embed management
      - Set up RSS feed parser
      - Design caching strategy for scraped data
    
  - content: Public Data Aggregation
    description: |
      **Implement free data collection:**
      
      **Web Scraping Setup:**
      - Create scrapers for FantasyPros consensus rankings
      - Pull ADP data from public fantasy sites
      - Aggregate injury reports from public RSS feeds
      - Collect player news from Twitter embeds
      - Scrape strength of schedule from public sources
      
      **Embedded Resources:**
      - Embed FantasyPros draft simulator
      - Include ESPN's public draft rankings
      - Add Yahoo's fantasy football tools
      - Embed Reddit fantasy football AMAs
      - Include public mock draft rooms
      
      **Data Processing:**
      - Clean and normalize scraped data
      - Create composite rankings from multiple sources
      - Calculate consensus values
      - Generate position tiers automatically
      - Update data on configurable schedule
    
  - content: Rankings Dashboard
    description: |
      **Build the main rankings interface:**
      
      **Multi-Source Rankings Table:**
      - Display consensus rankings from 3+ sources
      - Show ADP vs ranking variance
      - Color-coded tier breaks
      - Position filtering (QB, RB, WR, TE, K, DST)
      - Search functionality
      - Export to CSV/PDF for printing
      
      **Embedded Visualizations:**
      - FantasyPros ECR charts
      - ADP trend graphs from public data
      - Tier-based heat maps
      - Position scarcity visualizations
      - Bye week distribution charts
      
      **Quick Tools:**
      - Cheat sheet generator
      - Draft board tracker
      - Keeper value calculator
      - Auction budget calculator
      - Trade analyzer (using public values)
    
  - content: News & Analysis Hub
    description: |
      **Create information aggregation center:**
      
      **RSS Feed Aggregator:**
      - Fantasy football news from major sites
      - Injury updates from Rotoworld
      - Beat reporter tweets via Twitter embeds
      - Reddit hot topics from r/fantasyfootball
      - Podcast episode links
      
      **Article Collection:**
      - Draft strategy guides from public sites
      - Position primers and sleepers
      - Rookie analysis articles
      - Weekly waiver wire articles
      - Start/sit columns
      
      **Video Content:**
      - Embedded YouTube fantasy channels
      - NFL.com fantasy segments
      - ESPN fantasy show clips
      - Draft strategy videos
      - Player highlight reels
    
  - content: Mock Draft Tools
    description: |
      **Integrate free mock draft resources:**
      
      **Mock Draft Simulators:**
      - Embed FantasyPros draft simulator
      - Link to ESPN mock draft rooms
      - Yahoo mock draft lobby integration
      - NFL.com mock draft tool
      - Sleeper app web interface
      
      **Draft Assistant Features:**
      - Import rankings from CSV
      - Track drafted players manually
      - Suggest best available by position
      - Show positional runs
      - Calculate value picks
      
      **Draft Day Tools:**
      - Printable cheat sheets
      - Mobile-friendly draft tracker
      - Quick player search
      - Position depth tracker
      - Team needs matrix
    
  - content: Strategy Resources
    description: |
      **Compile draft strategy materials:**
      
      **Strategy Guides:**
      - Zero RB strategy explanation
      - Hero RB approach
      - Late-round QB strategy
      - Best ball specific strategies
      - Auction draft strategies
      
      **Interactive Tools:**
      - Draft position optimizer
      - League settings analyzer
      - Scoring system calculator
      - Keeper value calculator
      - Dynasty rookie rankings
      
      **Educational Content:**
      - Glossary of fantasy terms
      - Beginner's guide to fantasy football
      - Advanced statistics explained
      - How to evaluate trades
      - Waiver wire strategies
    
  - content: User Customization
    description: |
      **Add personalization features:**
      
      **League Settings:**
      - Scoring system configuration
      - Roster size settings
      - League type (redraft, keeper, dynasty)
      - Number of teams
      - Draft type (snake, auction)
      
      **Personal Preferences:**
      - Favorite team bias adjustments
      - Risk tolerance settings
      - Saved player notes
      - Custom player rankings
      - Watchlist management
      
      **Data Management:**
      - Import/export settings
      - Backup to local storage
      - Share configurations
      - Print-friendly formats
      - Mobile sync via QR code
    
  - content: Offline Functionality
    description: |
      **Enable offline draft preparation:**
      
      **Cached Resources:**
      - Store latest rankings locally
      - Save article content for offline reading
      - Download cheat sheets as PDFs
      - Cache player stats and projections
      - Store mock draft results
      
      **Offline Tools:**
      - Draft board tracker
      - Player comparison tool
      - Team builder
      - Trade calculator
      - Notes and annotations
      
      **Sync Features:**
      - Auto-update when online
      - Conflict resolution for edits
      - Background data refresh
      - Push notifications for news
      - Progressive web app setup
    
  - content: Performance Optimization
    description: |
      **Ensure fast, responsive experience:**
      
      **Loading Optimization:**
      - Lazy load embedded content
      - Progressive data loading
      - Image optimization
      - Code splitting by route
      - Service worker caching
      
      **Data Management:**
      - Efficient state management
      - Debounced search inputs
      - Virtual scrolling for long lists
      - Memoized calculations
      - Background data updates
      
      **Mobile Optimization:**
      - Touch-friendly interfaces
      - Responsive tables
      - Collapsible sections
      - Swipe gestures
      - Reduced data mode
    
  - content: Deployment & Documentation
    description: |
      **Launch the study suite:**
      
      **Deployment:**
      - Build optimized production bundle
      - Deploy to Vercel/Netlify (free tier)
      - Set up custom domain (optional)
      - Configure CDN caching
      - Enable analytics
      
      **Documentation:**
      - User guide with screenshots
      - Video walkthrough
      - FAQ section
      - Data source attributions
      - Update schedule information
      
      **Marketing:**
      - Share on r/fantasyfootball
      - Create ProductHunt listing
      - Social media presence
      - SEO optimization
      - Email newsletter signup
      
      **Maintenance:**
      - Weekly data updates during season
      - Bug fix schedule
      - Feature request tracking
      - Community feedback integration
      - Off-season planning