name: MaiFarm Comprehensive Fixes - Create Farm, Go Wild, Quick Task
description: Application-wide analysis and implementation of best practices, bug fixes, and optimizations for all three main MaiFarm functions with production-ready quality
version: 2.0.0
priority: CRITICAL
execution_mode: sequential_with_validation

metadata:
  created_date: 2025-08-06
  target_functions:
    - Create Farm
    - Go Wild Mode
    - Quick Task
  estimated_completion: 8-10 hours
  agent_requirements: 3-5 agents
  testing_coverage_target: 95%

initial_prompt: |
  You are an expert full-stack developer tasked with fixing and optimizing the three main MaiFarm functions. 
  The application currently has critical issues preventing production deployment:
  
  CRITICAL ISSUES SUMMARY:
  - Create Farm: Farm persistence fails (404 after creation), WebSocket unreliable, multi-agent coordination broken
  - Go Wild: No harvest records created, missing tmux integration, discoveries not persisted
  - Quick Task: Redis crashes cause failures, tasks stuck in queued state, no cleanup after completion
  
  Your mission is to implement a comprehensive fix that ensures all three functions work flawlessly with:
  - Robust error handling and graceful fallbacks
  - Real-time updates via reliable WebSocket connections
  - Proper database persistence and state management
  - Automated cleanup and resource management
  - Production-grade monitoring and observability
  
  Architecture Context:
  - Frontend: React 18 + TypeScript + Vite + Zustand
  - Backend: Express + TypeScript + Socket.io + PostgreSQL/Redis
  - Multi-Agent: Python scripts + tmux sessions + Claude Code coordination
  
  Quality Requirements:
  - Zero critical bugs
  - 95%+ test coverage
  - Sub-100ms response times
  - Graceful degradation when services unavailable
  - Clear error messages for users

steps:
  - content: Analyze Current Implementation and Issues
    description: |
      Conduct thorough analysis of existing codebase and issues:
      
      1. Review bug reports and QA test results:
         - Read CREATE_FARM_QA_REPORT.md for Create Farm issues
         - Read GO_WILD_QA_REPORT.md for Go Wild issues  
         - Read QA_QUICK_TASK_REPORT.md for Quick Task issues
         - Analyze reports/bug-report-*.json for TypeScript errors
      
      2. Examine critical code paths:
         - src/components/Farm/GrowingPage.tsx (navigation and status tracking)
         - src/components/Task/QuickTaskModal.tsx (quick task creation)
         - src/components/GoWild/GoWildModal.tsx (go wild initialization)
         - server/api/farms.ts (farm CRUD operations)
         - server/services/quickTaskService.ts (quick task execution)
         - server/services/goWildManager.ts (exploration management)
         - server/services/multiClaudeService.ts (multi-agent coordination)
      
      3. Identify root causes:
         - Database connection and transaction handling
         - WebSocket event emission and subscription
         - State synchronization between frontend and backend
         - Resource cleanup and memory management
         - Error propagation and handling
      
      4. Create issue priority matrix:
         - Critical: Blocks core functionality
         - High: Degrades user experience significantly
         - Medium: Performance or minor UX issues
         - Low: Nice-to-have improvements
      
      Document all findings in a structured analysis report.

  - content: Fix Create Farm Database Persistence
    description: |
      Resolve farm persistence issues causing 404 errors:
      
      1. Fix database storage in server/api/farms.ts:
         - Add proper transaction handling for farm creation
         - Ensure farm data is committed before response
         - Add retry logic for transient database failures
         - Implement proper connection pooling
      
      2. Update server/services/farmManager.ts:
         - Add in-memory cache as fallback
         - Implement write-through caching strategy
         - Add farm state synchronization
         - Ensure farms persist across server restarts
      
      3. Fix farm retrieval endpoints:
         - Add proper error handling for missing farms
         - Implement farm existence checks
         - Add logging for debugging persistence issues
         - Return consistent JSON responses
      
      4. Add database migrations:
         - Create farms table if not exists
         - Add proper indexes for performance
         - Set up foreign key constraints
         - Add audit columns (created_at, updated_at)
      
      5. Implement farm state recovery:
         - Load farms from database on startup
         - Sync with in-memory state
         - Handle orphaned farms
         - Clean up stale farm data
      
      Test with multiple farm creation scenarios and verify persistence.

  - content: Implement Reliable WebSocket Communication
    description: |
      Fix WebSocket connectivity and real-time updates:
      
      1. Fix Socket.io server configuration:
         - Update server/websocket/socketServer.ts
         - Configure proper CORS settings
         - Add connection pooling
         - Implement heartbeat mechanism
         - Add connection state logging
      
      2. Implement client-side reconnection:
         - Update src/hooks/useWebSocket.ts
         - Add exponential backoff for reconnection
         - Implement connection state management
         - Add offline queue for pending messages
         - Show connection status in UI
      
      3. Fix event emission and subscription:
         - Ensure all events are properly namespaced
         - Add event validation and typing
         - Implement event acknowledgments
         - Add event replay for missed messages
         - Create event documentation
      
      4. Add WebSocket fallback mechanisms:
         - Implement long-polling as fallback
         - Add REST API polling for critical updates
         - Create hybrid approach for reliability
         - Ensure graceful degradation
      
      5. Optimize WebSocket performance:
         - Implement message batching
         - Add compression for large payloads
         - Use binary frames where appropriate
         - Add rate limiting to prevent floods
      
      Test with network interruptions and validate recovery.

  - content: Fix Quick Task Execution Flow
    description: |
      Resolve Quick Task issues with Redis dependencies and task execution:
      
      1. Add Redis fallback in server/services/quickTaskService.ts:
         - Check Redis availability before operations
         - Use in-memory queue as fallback
         - Implement graceful degradation
         - Add health checks for Redis
      
      2. Fix task state transitions:
         - Ensure tasks move from queued → processing → completed
         - Add WebSocket events for each transition
         - Implement timeout handling
         - Add retry logic for failed tasks
      
      3. Implement task execution engine:
         - Create dedicated task processor
         - Add concurrent task handling
         - Implement priority queue
         - Add task cancellation support
      
      4. Fix farm cleanup after completion:
         - Add cleanup scheduler
         - Remove completed quick task farms
         - Clean up associated resources
         - Archive task results before deletion
      
      5. Add comprehensive error handling:
         - Catch and handle all exceptions
         - Provide meaningful error messages
         - Add error recovery mechanisms
         - Log errors for debugging
      
      Test with various quick task scenarios including Redis unavailable.

  - content: Complete Go Wild Mode Implementation
    description: |
      Fix Go Wild exploration and harvest creation:
      
      1. Implement harvest record creation:
         - Auto-create harvest when exploration completes
         - Store discoveries in harvest
         - Link harvest to farm
         - Add harvest metadata
      
      2. Add tmux session integration:
         - Create tmux sessions for real agents
         - Capture agent output
         - Parse and store agent discoveries
         - Add session monitoring
      
      3. Fix discovery persistence:
         - Auto-save high-impact discoveries
         - Implement discovery ranking
         - Add discovery categorization
         - Create discovery export
      
      4. Improve exploration visualization:
         - Fix 3D graph updates
         - Add real-time node creation
         - Show discovery indicators
         - Add exploration progress bar
      
      5. Implement safety controls:
         - Add resource limits
         - Implement circuit breakers
         - Add exploration boundaries
         - Create rollback mechanisms
      
      Test with various exploration configurations and durations.

  - content: Fix Multi-Agent Coordination
    description: |
      Resolve multi-agent orchestration issues:
      
      1. Fix coordination file monitoring:
         - Properly watch /tmp/claude_coordination/active_agents.json
         - Handle file creation/deletion
         - Parse JSON safely with error handling
         - Sync with WebSocket events
      
      2. Implement agent lifecycle management:
         - Track agent creation and termination
         - Monitor agent health
         - Handle agent failures gracefully
         - Implement agent restart logic
      
      3. Fix tmux session management:
         - Create sessions with proper naming
         - Handle session cleanup
         - Monitor session output
         - Parse agent responses
      
      4. Implement task distribution:
         - Create task queue per agent
         - Balance load across agents
         - Handle task reassignment
         - Track task completion
      
      5. Add agent communication:
         - Implement inter-agent messaging
         - Create shared state management
         - Add conflict resolution
         - Enable collaborative workflows
      
      Test with multiple agents and various failure scenarios.

  - content: Implement Comprehensive Error Handling
    description: |
      Add robust error handling throughout the application:
      
      1. Frontend error boundaries:
         - Add React error boundaries to all pages
         - Create fallback UI components
         - Implement error recovery actions
         - Add error reporting to backend
      
      2. Backend error middleware:
         - Create global error handler
         - Standardize error responses
         - Add error categorization
         - Implement error logging
      
      3. Database error handling:
         - Add connection retry logic
         - Handle transaction failures
         - Implement rollback mechanisms
         - Add connection pool recovery
      
      4. API error responses:
         - Standardize error format
         - Add error codes
         - Include helpful error messages
         - Add debugging information in dev mode
      
      5. User-facing error messages:
         - Create friendly error messages
         - Add recovery suggestions
         - Include support contact
         - Implement error toast notifications
      
      Test all error scenarios and validate graceful handling.

  - content: Optimize UI/UX Experience
    description: |
      Improve user interface and experience:
      
      1. Fix Growing Page navigation:
         - Reduce countdown timer to 30 seconds
         - Add immediate navigation on status change
         - Show clear progress indicators
         - Add manual skip button prominence
      
      2. Improve status indicators:
         - Add real-time farm status badges
         - Show agent activity indicators
         - Display task progress bars
         - Add completion notifications
      
      3. Enhance modal interactions:
         - Fix modal close/navigation issues
         - Add loading states
         - Improve form validation
         - Add confirmation dialogs
      
      4. Optimize performance:
         - Implement lazy loading
         - Add virtualization for lists
         - Optimize re-renders
         - Add skeleton loaders
      
      5. Improve responsive design:
         - Fix mobile layouts
         - Add touch gestures
         - Optimize for tablets
         - Test on various devices
      
      Conduct user testing and gather feedback.

  - content: Add Monitoring and Observability
    description: |
      Implement comprehensive monitoring:
      
      1. Add Prometheus metrics:
         - Track API response times
         - Monitor WebSocket connections
         - Count task completions
         - Measure error rates
      
      2. Configure Grafana dashboards:
         - Create service health dashboard
         - Add performance metrics
         - Monitor resource usage
         - Track user activity
      
      3. Implement distributed tracing:
         - Add trace IDs to requests
         - Track request flow
         - Identify bottlenecks
         - Monitor dependencies
      
      4. Add application logging:
         - Structured logging with levels
         - Log rotation and archival
         - Centralized log aggregation
         - Search and analysis tools
      
      5. Create alerts:
         - High error rate alerts
         - Performance degradation
         - Service unavailability
         - Resource exhaustion
      
      Set up monitoring infrastructure and validate all metrics.

  - content: Implement Security Enhancements
    description: |
      Add security best practices:
      
      1. Input validation and sanitization:
         - Validate all user inputs
         - Sanitize for XSS prevention
         - Implement SQL injection prevention
         - Add request size limits
      
      2. Authentication and authorization:
         - Fix JWT implementation
         - Add refresh token rotation
         - Implement RBAC properly
         - Add session management
      
      3. Security headers:
         - Configure helmet.js properly
         - Add CSP headers
         - Implement CORS correctly
         - Add rate limiting
      
      4. Data protection:
         - Encrypt sensitive data
         - Implement secure communication
         - Add audit logging
         - Handle PII properly
      
      5. Security testing:
         - Run OWASP dependency check
         - Perform penetration testing
         - Add security unit tests
         - Implement security monitoring
      
      Conduct security audit and fix all vulnerabilities.

  - content: Optimize Database Performance
    description: |
      Improve database performance and reliability:
      
      1. Add proper indexes:
         - Index foreign keys
         - Add composite indexes
         - Optimize query patterns
         - Monitor index usage
      
      2. Implement connection pooling:
         - Configure pool size
         - Add connection retry
         - Monitor pool health
         - Handle connection leaks
      
      3. Optimize queries:
         - Use prepared statements
         - Add query caching
         - Implement pagination
         - Avoid N+1 queries
      
      4. Add database monitoring:
         - Track query performance
         - Monitor connection pool
         - Alert on slow queries
         - Track database size
      
      5. Implement backup strategy:
         - Regular automated backups
         - Point-in-time recovery
         - Test restore procedures
         - Monitor backup health
      
      Run performance tests and optimize slow queries.

  - content: Create Comprehensive Test Suite
    description: |
      Implement thorough testing coverage:
      
      1. Unit tests:
         - Test all service methods
         - Cover error scenarios
         - Mock external dependencies
         - Achieve 90% coverage
      
      2. Integration tests:
         - Test API endpoints
         - Verify database operations
         - Test WebSocket events
         - Validate multi-service flows
      
      3. End-to-end tests:
         - Test complete user workflows
         - Validate Create Farm flow
         - Test Go Wild exploration
         - Verify Quick Task execution
      
      4. Performance tests:
         - Load test with k6
         - Stress test endpoints
         - Test concurrent users
         - Monitor resource usage
      
      5. Automated testing:
         - Set up CI/CD pipeline
         - Run tests on commit
         - Generate coverage reports
         - Block deployment on failures
      
      Create test documentation and maintain test suite.

  - content: Update Documentation
    description: |
      Create comprehensive documentation:
      
      1. API documentation:
         - Document all endpoints
         - Add request/response examples
         - Include error codes
         - Generate OpenAPI spec
      
      2. Architecture documentation:
         - System architecture diagram
         - Data flow diagrams
         - Component relationships
         - Technology stack details
      
      3. Development guide:
         - Setup instructions
         - Development workflow
         - Testing procedures
         - Debugging tips
      
      4. Operations manual:
         - Deployment procedures
         - Monitoring setup
         - Troubleshooting guide
         - Disaster recovery
      
      5. User documentation:
         - Feature guides
         - Video tutorials
         - FAQ section
         - Support resources
      
      Keep documentation up-to-date and accessible.

  - content: Performance Optimization
    description: |
      Optimize application performance:
      
      1. Frontend optimization:
         - Code splitting
         - Bundle size reduction
         - Image optimization
         - Lazy loading
      
      2. Backend optimization:
         - Response caching
         - Query optimization
         - Connection pooling
         - Async processing
      
      3. Network optimization:
         - Enable compression
         - Optimize payloads
         - Reduce requests
         - Use CDN
      
      4. Database optimization:
         - Query optimization
         - Index tuning
         - Connection pooling
         - Cache strategy
      
      5. Monitoring optimization:
         - Reduce metric overhead
         - Optimize log levels
         - Batch telemetry
         - Sample traces
      
      Achieve sub-100ms p95 response times.

  - content: Final Validation and Production Readiness
    description: |
      Ensure production readiness:
      
      1. Complete feature testing:
         - Test Create Farm end-to-end
         - Validate Go Wild exploration
         - Verify Quick Task execution
         - Test all edge cases
      
      2. Performance validation:
         - Run load tests
         - Verify response times
         - Check resource usage
         - Validate scalability
      
      3. Security validation:
         - Run security scan
         - Test authentication
         - Verify authorization
         - Check for vulnerabilities
      
      4. Operational readiness:
         - Verify monitoring
         - Test alerts
         - Validate backups
         - Check disaster recovery
      
      5. Sign-off checklist:
         - All critical bugs fixed
         - 95% test coverage achieved
         - Performance targets met
         - Security review passed
         - Documentation complete
         - Monitoring operational
         - Team trained
         - Rollback plan ready
      
      DO NOT STOP until all validation criteria are met and the application is 100% production ready.

validation_criteria:
  - All TypeScript errors resolved
  - Zero critical bugs remaining
  - 95% test coverage achieved
  - All three main functions working flawlessly
  - WebSocket connectivity stable
  - Database persistence reliable
  - Real-time updates functional
  - Error handling comprehensive
  - Performance targets met
  - Security vulnerabilities addressed
  - Documentation complete
  - Monitoring operational