<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal WebSocket Test</title>
  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
  <style>
    body {
      font-family: monospace;
      background: #1a1a1a;
      color: #00ff00;
      padding: 20px;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #00ff00;
    }
    .connected { background: #003300; }
    .disconnected { background: #330000; }
    .terminal {
      background: #000;
      padding: 10px;
      margin: 10px 0;
      height: 400px;
      overflow-y: auto;
      border: 1px solid #00ff00;
    }
    .terminal-line {
      margin: 2px 0;
      white-space: pre-wrap;
    }
    button {
      background: #00ff00;
      color: #000;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #00aa00;
    }
    .info {
      background: #002200;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #00ff00;
    }
  </style>
</head>
<body>
  <h1>🔧 Terminal WebSocket Test</h1>
  
  <div id="status" class="status disconnected">
    Status: <span id="statusText">Disconnected</span>
  </div>
  
  <div class="info">
    <p>This test page connects directly to the WebSocket server and listens for terminal output.</p>
    <p>Use this to verify if WebSocket messages are being sent properly.</p>
  </div>
  
  <div>
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
    <button onclick="joinSession()">Join Test Session</button>
    <button onclick="testBroadcast()">Test Broadcast</button>
    <button onclick="clearTerminal()">Clear Terminal</button>
  </div>
  
  <div>
    <input type="text" id="sessionId" placeholder="Session ID (e.g., farm-12345678)" style="width: 300px; padding: 5px;">
    <input type="text" id="farmId" placeholder="Farm ID (e.g., 12345678)" style="width: 200px; padding: 5px;">
    <button onclick="joinCustomSession()">Join Custom Session</button>
  </div>
  
  <h2>Terminal Output:</h2>
  <div id="terminal" class="terminal">
    <div class="terminal-line">Waiting for output...</div>
  </div>
  
  <h2>Events Log:</h2>
  <div id="events" class="terminal" style="height: 200px;">
    <div class="terminal-line">Event log will appear here...</div>
  </div>

  <script>
    let socket = null;
    let isConnected = false;
    
    function updateStatus(connected) {
      isConnected = connected;
      const statusEl = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      
      if (connected) {
        statusEl.className = 'status connected';
        statusText.textContent = 'Connected';
        addEvent('✅ Connected to WebSocket server');
      } else {
        statusEl.className = 'status disconnected';
        statusText.textContent = 'Disconnected';
        addEvent('❌ Disconnected from WebSocket server');
      }
    }
    
    function addTerminalLine(text, agentId = '') {
      const terminal = document.getElementById('terminal');
      const line = document.createElement('div');
      line.className = 'terminal-line';
      line.textContent = agentId ? `[Agent ${agentId}] ${text}` : text;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }
    
    function addEvent(text) {
      const events = document.getElementById('events');
      const line = document.createElement('div');
      line.className = 'terminal-line';
      line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      events.appendChild(line);
      events.scrollTop = events.scrollHeight;
    }
    
    function clearTerminal() {
      document.getElementById('terminal').innerHTML = '<div class="terminal-line">Terminal cleared...</div>';
    }
    
    function connect() {
      if (socket && socket.connected) {
        addEvent('Already connected');
        return;
      }
      
      socket = io('http://localhost:4567', {
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: 5,
        reconnectionDelay: 1000
      });
      
      // Connection events
      socket.on('connect', () => {
        updateStatus(true);
        addEvent(`Socket ID: ${socket.id}`);
      });
      
      socket.on('disconnect', () => {
        updateStatus(false);
      });
      
      socket.on('error', (error) => {
        addEvent(`❌ Error: ${error}`);
      });
      
      // Terminal events
      socket.on('terminal:output', (data) => {
        addEvent(`📥 Received terminal:output for agent ${data.agentId}`);
        
        if (data.lines && Array.isArray(data.lines)) {
          data.lines.forEach(line => {
            addTerminalLine(line, data.agentId);
          });
        } else if (data.output) {
          const lines = data.output.split('\\n');
          lines.forEach(line => {
            addTerminalLine(line, data.agentId);
          });
        }
      });
      
      socket.on('terminal:joined', (data) => {
        addEvent(`✅ Joined session: ${data.sessionId || 'unknown'}`);
      });
      
      socket.on('terminal:registered', (data) => {
        addEvent(`✅ Registered for farm: ${data.farmId}`);
      });
      
      socket.on('terminal:ready', (data) => {
        addEvent(`✅ Terminal ready: ${data.message}`);
      });
      
      socket.on('terminal:streaming:ready', (data) => {
        addEvent(`✅ Streaming ready for session: ${data.sessionId}`);
      });
      
      // Listen for all events (debugging)
      socket.onAny((event, ...args) => {
        if (!event.startsWith('terminal:')) {
          addEvent(`📡 Event: ${event}`);
        }
      });
    }
    
    function disconnect() {
      if (socket) {
        socket.disconnect();
        socket = null;
      }
    }
    
    function joinSession() {
      if (!socket || !socket.connected) {
        addEvent('❌ Not connected. Click Connect first.');
        return;
      }
      
      const sessionId = 'test-session';
      const farmId = 'test-farm';
      
      addEvent(`Joining session: ${sessionId} (farm: ${farmId})`);
      
      socket.emit('terminal:join_session', {
        sessionId: sessionId,
        farmId: farmId
      });
    }
    
    function joinCustomSession() {
      if (!socket || !socket.connected) {
        addEvent('❌ Not connected. Click Connect first.');
        return;
      }
      
      const sessionId = document.getElementById('sessionId').value || 'farm-test';
      const farmId = document.getElementById('farmId').value || 'test';
      
      addEvent(`Joining custom session: ${sessionId} (farm: ${farmId})`);
      
      socket.emit('terminal:join_session', {
        sessionId: sessionId,
        farmId: farmId
      });
    }
    
    async function testBroadcast() {
      const sessionId = document.getElementById('sessionId').value || 'test-session';
      const farmId = document.getElementById('farmId').value || 'test-farm';
      
      addEvent(`Sending test broadcast for ${sessionId}...`);
      
      try {
        const response = await fetch('http://localhost:4567/api/debug/terminal/broadcast', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, farmId })
        });
        
        const data = await response.json();
        if (data.success) {
          addEvent('✅ Test broadcast sent');
        } else {
          addEvent(`❌ Broadcast failed: ${data.error}`);
        }
      } catch (error) {
        addEvent(`❌ Error: ${error.message}`);
      }
    }
    
    // Auto-connect on load
    window.addEventListener('load', () => {
      setTimeout(connect, 500);
    });
  </script>
</body>
</html>
